<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laso Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-card">
      <h1>Laso Admin</h1>
      <p>Remote Config Management</p>
      <input type="email" id="login-email" placeholder="Email" autocomplete="email" />
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
      <button id="login-btn">Sign In</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="header">
      <h1>Laso Remote Config</h1>
      <div class="header-actions">
        <span class="user-email" id="user-email"></span>
        <button class="btn btn-primary" id="save-btn" disabled>Save &amp; Publish</button>
        <button class="btn btn-secondary" id="logout-btn">Sign Out</button>
      </div>
    </div>

    <!-- Feature Access -->
    <div class="config-section" id="section-features">
      <h2>Feature Access</h2>
      <!-- Rows injected by JS -->
    </div>

    <!-- Limits -->
    <div class="config-section" id="section-limits">
      <h2>Free Tier Limits</h2>
    </div>

    <!-- Pricing -->
    <div class="config-section" id="section-pricing">
      <h2>Pricing</h2>
    </div>

    <!-- Alert Thresholds -->
    <div class="config-section" id="section-alerts">
      <h2>Alert Thresholds</h2>
    </div>

    <!-- Watch Monitor -->
    <div class="config-section" id="section-watch">
      <h2>Watch Monitor</h2>
    </div>

    <!-- Notifications -->
    <div class="config-section" id="section-notifications">
      <h2>Notification Optimizer</h2>
    </div>

    <!-- Analysis -->
    <div class="config-section" id="section-analysis">
      <h2>Analysis Thresholds</h2>
    </div>

    <!-- Feedback & System Config -->
    <div class="config-section" id="section-system">
      <h2>Feedback &amp; System Config</h2>
    </div>

    <!-- User Feedback (from Firestore) -->
    <div class="config-section" id="section-feedback">
      <h2>User Feedback</h2>
      <div class="feedback-controls">
        <button class="btn btn-secondary" id="load-feedback-btn">Load Feedback</button>
        <span class="feedback-count" id="feedback-count"></span>
      </div>
      <div id="feedback-summary"></div>
      <div id="feedback-list"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Loading -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <!-- Firebase SDK (compat for simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
