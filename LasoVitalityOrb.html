<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laso · Vitality Age · Aspirational orb</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(120% 120% at 50% 35%, #f4f8fc 0%, #e8eff7 52%, #dde7f2 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;
    min-height:100vh; -webkit-font-smoothing:antialiased; overflow:hidden;
  }

  .stage{position:relative; width:min(88vw, 560px); aspect-ratio:1; }
  canvas{position:absolute; inset:0; width:100%; height:100%;}

  /* soft glow halo lifting the sphere off the background */
  .halo{position:absolute; left:50%; top:50%; width:66%; aspect-ratio:1; transform:translate(-50%,-50%);
    border-radius:50%; background:radial-gradient(circle, rgba(150,200,255,.55), rgba(150,200,255,0) 70%);
    filter:blur(22px); opacity:0; transition:opacity 1.1s ease .3s; z-index:1;}
  .in .halo{opacity:1;}

  /* glass sphere */
  .sphere{
    position:absolute; left:50%; top:50%; width:54%; aspect-ratio:1; transform:translate(-50%,-50%) scale(.9);
    border-radius:50%; opacity:0; z-index:2;
    background:
      radial-gradient(125% 125% at 33% 24%, #9cbce2 0%, #4f74a6 19%, #2f4f80 44%, #1a3056 72%, #0d1c33 100%);
    box-shadow:
      inset 0 3px 14px rgba(255,255,255,.28),
      inset 0 -26px 56px rgba(0,0,0,.55),
      inset 0 0 40px rgba(70,120,200,.25),
      0 26px 80px rgba(31,70,150,.40);
    transition:opacity 1s ease .2s, transform 1.2s cubic-bezier(.22,1,.36,1) .2s;
    overflow:hidden;
  }
  /* specular sheen near the top, glassy */
  .sphere{background-blend-mode:normal;}
  .in .sphere{opacity:1; transform:translate(-50%,-50%) scale(1);}
  /* faint internal cloud texture, like the reference's soft continents */
  .sphere::before, .sphere::after{content:""; position:absolute; border-radius:50%; filter:blur(18px); opacity:.5;}
  .sphere::before{width:70%; height:60%; left:8%; top:14%; background:radial-gradient(circle, rgba(120,140,170,.45), transparent 70%);}
  .sphere::after{width:60%; height:55%; right:6%; bottom:8%; background:radial-gradient(circle, rgba(10,20,35,.7), transparent 70%);}
  /* breathing once revealed */
  .in .sphere{animation:breathe 6s ease-in-out 1.4s infinite;}
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.018);}}

  /* bright rim ring (blue -> green), drawn on */
  .rim{position:absolute; left:50%; top:50%; width:54%; aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none;}
  .rim svg{width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 5px rgba(150,210,255,.9)) drop-shadow(0 0 12px rgba(120,200,255,.5));}
  .rim circle{stroke-dasharray:100; stroke-dashoffset:100; transition:stroke-dashoffset 1.5s ease .4s;}
  .in .rim circle{stroke-dashoffset:0;}

  /* center text */
  .txt{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; z-index:3; width:54%;}
  .num{font-size:clamp(56px,15vw,116px); font-weight:800; line-height:1; letter-spacing:-3px; color:#fff;
    text-shadow:0 2px 24px rgba(0,0,0,.45); font-variant-numeric:tabular-nums;}
  .label{font-size:clamp(14px,3.4vw,22px); font-weight:700; letter-spacing:3px; color:rgba(255,255,255,.92); margin-top:8px;
    opacity:0; transform:translateY(8px); transition:opacity .6s ease .9s, transform .6s ease .9s;}
  .in .label{opacity:1; transform:none;}
  .younger{font-size:clamp(13px,3.1vw,20px); font-weight:700; color:#46d27a; margin-top:12px; letter-spacing:.3px;
    opacity:0; transform:translateY(8px) scale(.95); transition:opacity .55s ease, transform .55s cubic-bezier(.34,1.56,.64,1);}
  .in .younger{opacity:1; transform:none; transition-delay:1.5s;}
  .younger b{font-weight:800;}

  .hint{font-size:13px; color:#7c8aa0; letter-spacing:.2px;}
  .replay{padding:9px 18px; border-radius:999px; border:1px solid rgba(46,111,232,.4); background:rgba(46,111,232,.08); color:#2E6FE8; font-size:13px; font-weight:600; cursor:pointer;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
    .sphere{opacity:1 !important; transform:translate(-50%,-50%) !important;}
    .rim circle{stroke-dashoffset:0 !important;} .label,.younger{opacity:1 !important; transform:none !important;}
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="aura"></canvas>
    <div class="halo"></div>
    <div class="sphere"></div>
    <div class="rim">
      <svg viewBox="0 0 100 100">
        <defs><linearGradient id="rimg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#bfe6ff"/><stop offset=".5" stop-color="#8fd0ff"/><stop offset="1" stop-color="#46d27a"/>
        </linearGradient></defs>
        <circle cx="50" cy="50" r="48" fill="none" stroke="url(#rimg)" stroke-width="1.9" stroke-linecap="round" pathLength="100" transform="rotate(-90 50 50)"/>
      </svg>
    </div>
    <div class="txt">
      <div class="num" id="num" data-count="27">27</div>
      <div class="label">Vitality Age</div>
      <div class="younger"><b>3 years</b> younger</div>
    </div>
  </div>

  <button class="replay" onclick="play()">&#8635; Replay</button>

<script>
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('aura');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W, H, cx, cy, RR;

  function resize(){
    var r = canvas.getBoundingClientRect();
    W = r.width; H = r.height; cx = W/2; cy = H/2; RR = Math.min(W,H)/2;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  // Flowing dotted RIBBONS: each strand is a continuous weaving loop drawn with
  // dots that stream along it, so it reads as orbiting energy, not random dust.
  var STRANDS = [
    {n:560, base:0.80, band:0.013, flow: 0.055, morph:0.20, harm:[[2,0.060],[3,0.040]], phase:0.0, hue:'blue'},
    {n:480, base:0.86, band:0.011, flow:-0.040, morph:0.15, harm:[[3,0.052],[5,0.030]], phase:1.7, hue:'lite'},
    {n:380, base:0.93, band:0.011, flow: 0.030, morph:0.11, harm:[[2,0.050],[4,0.035]], phase:3.1, hue:'mix'}
  ];
  var P = [];
  function build(){
    P = [];
    for(var s=0; s<STRANDS.length; s++){
      var st = STRANDS[s];
      for(var i=0;i<st.n;i++){
        P.push({
          s:s,
          u: (i/st.n)*Math.PI*2,                // ordered position along the ribbon
          j: (Math.random()*2-1),               // tiny radial jitter so it is a band, not a hairline
          size: 0.6 + Math.random()*1.5,
          tw: Math.random()*Math.PI*2,          // twinkle phase
          twS: 0.7 + Math.random()*1.2,
          al: 0.40 + Math.random()*0.5,
          green: (st.hue==='mix' && Math.random()<0.20)
        });
      }
    }
  }

  function color(hue, a){
    if(hue==='blue') return 'rgba(46,111,232,'+a+')';
    if(hue==='lite') return 'rgba(140,185,240,'+a+')';
    // 'mix': mostly blue with an occasional green glint handled per-particle
    return 'rgba(70,150,232,'+a+')';
  }

  var t0 = null, intro = 0, raf = null;
  function frame(now){
    if(t0===null) t0 = now;
    var t = (now - t0)/1000;
    intro = reduce ? 1 : Math.min(1, t/1.4);

    ctx.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p = P[i], st = STRANDS[p.s];
      // dots stream along the ribbon (flow); the ribbon shape itself morphs slowly
      var phi = p.u + t*st.flow;
      var rad = st.base;
      for(var h=0; h<st.harm.length; h++){
        var k = st.harm[h][0], amp = st.harm[h][1];
        rad += amp * Math.sin(k*phi + t*st.morph + st.phase);
      }
      rad += p.j * st.band;
      var R = rad * RR;
      var x = cx + Math.cos(phi) * R;
      var y = cy + Math.sin(phi) * R;
      // fake depth: front dots bigger and brighter, back dots small and faint
      var depth = 0.5 + 0.5*Math.sin(phi + p.s*2.1);
      var tw = 0.5 + 0.5*Math.sin(t*p.twS + p.tw);
      var size = p.size * (0.6 + 0.7*depth);
      var a = p.al * tw * (0.4 + 0.6*depth) * intro;
      var col = p.green ? 'rgba(70,205,120,'+(a*1.05)+')' : color(st.hue, a);
      ctx.beginPath();
      ctx.fillStyle = col;
      ctx.arc(x, y, size, 0, Math.PI*2);
      ctx.fill();
    }
    raf = requestAnimationFrame(frame);
  }

  function easeOut(t){ return 1 - Math.pow(1-t, 3); }
  function countUp(el, dur){
    var target = parseInt(el.getAttribute('data-count'),10), start=null;
    (function tick(now){
      if(start===null) start=now;
      var p = Math.min(1,(now-start)/dur);
      el.textContent = Math.round(easeOut(p)*target);
      if(p<1) requestAnimationFrame(tick); else el.textContent = target;
    })(performance.now());
  }

  function play(){
    var stage = document.getElementById('stage');
    var num = document.getElementById('num');
    if(reduce){ stage.classList.add('in'); num.textContent = num.getAttribute('data-count'); return; }
    stage.classList.remove('in'); num.textContent = '0';
    if(raf) cancelAnimationFrame(raf);
    t0 = null;
    void stage.offsetWidth;
    stage.classList.add('in');
    raf = requestAnimationFrame(frame);
    setTimeout(function(){ countUp(num, 1200); }, 300);
  }

  window.addEventListener('load', function(){ resize(); build(); play(); });
</script>
</body>
</html>
