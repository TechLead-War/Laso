<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laso · Vitality Age · onboarding colours, orb reacts on feed</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;}
  /* Onboarding palette: blue primary, green = good, amber = warning, dark navy bg */
  :root{
    --blue:#0A84FF; --blue-bright:#5AC8FA; --green:#34C759; --amber:#FF9F0A; --grey:#4a505a;
    --fg:#fff; --fg2:rgba(255,255,255,.55); --fg3:rgba(255,255,255,.38);
    --card:rgba(17,22,33,.82);
  }
  html,body{height:100%;}
  body{background:radial-gradient(135% 115% at 50% 33%, #0a1020 0%, #05070e 48%, #000000 100%);
    color:#fff; -webkit-font-smoothing:antialiased; overflow:hidden;}
  .stage{position:relative; width:100vw; height:100vh; min-height:680px;}
  canvas{position:absolute; inset:0; width:100%; height:100%; z-index:1;}

  .glow{position:absolute; left:50%; top:50%; width:46vmin; height:46vmin; transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(10,132,255,.14), transparent 66%); filter:blur(20px); z-index:0; opacity:0;
    transition:opacity 1.2s ease .2s, transform .3s ease;}
  .in .glow{opacity:1;}
  .glow.flash{transform:translate(-50%,-50%) scale(1.18); background:radial-gradient(circle, rgba(90,200,250,.38), transparent 68%);}

  /* expanding reaction ring when a metric enters the orb */
  .ripple{position:absolute; left:50%; top:50%; width:30vmin; height:30vmin; margin:-15vmin 0 0 -15vmin; border-radius:50%;
    border:2px solid; transform:scale(.55); opacity:.85; z-index:2; pointer-events:none;
    transition:transform .85s cubic-bezier(.2,.7,.3,1), opacity .85s ease-out;}
  .ripple.go{transform:scale(1.75); opacity:0;}

  .center{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; z-index:4; pointer-events:none;}
  .num{font-size:clamp(64px,12vmin,128px); font-weight:800; letter-spacing:-3px; line-height:1; color:#fff;
    text-shadow:0 0 30px rgba(10,132,255,.45); font-variant-numeric:tabular-nums; transition:transform .25s ease;}
  .num.bump{transform:scale(1.07);}
  .label{font-size:clamp(14px,2.5vmin,22px); font-weight:700; letter-spacing:4px; color:rgba(255,255,255,.82); margin-top:12px;
    opacity:0; transition:opacity .6s ease 1s; min-height:1em;}
  .in .label{opacity:1;}
  .younger{font-size:clamp(15px,2.6vmin,24px); font-weight:700; color:var(--blue-bright); margin-top:12px;
    opacity:0; transform:translateY(8px); transition:opacity .6s ease, transform .6s cubic-bezier(.34,1.56,.64,1);}
  .done .younger{opacity:1; transform:none;}

  .card{position:absolute; width:min(34vw,420px); min-width:300px; background:var(--card); border:1px solid rgba(255,255,255,.08);
    border-radius:20px; padding:18px 22px; z-index:3; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 18px 50px rgba(0,0,0,.6); opacity:0; transform:translateY(14px) scale(.97);
    transition:opacity .6s ease, transform .6s cubic-bezier(.22,1,.36,1);}
  .in .card{opacity:1; transform:none;}
  .card.c1{left:3%;  top:16%;  transition-delay:.5s;}
  .card.c2{right:3%; top:4%;   transition-delay:.7s;}
  .card.c3{right:4%; top:60%;  transition-delay:.95s;}
  .card.c4{left:4%;  bottom:8%; transition-delay:1.15s;}

  .card .top{display:flex; align-items:flex-start; justify-content:space-between; gap:14px;}
  .card .name{font-size:15px; font-weight:800; letter-spacing:2px; color:#fff;}
  .card .contrib{text-align:right; line-height:1; white-space:nowrap;}
  .card .contrib .v{font-size:30px; font-weight:800; letter-spacing:-1px;}
  .card .contrib .u{font-size:13px; color:var(--fg3); font-weight:600;}
  .good .v{color:var(--blue-bright);} .bad .v{color:var(--amber);}

  .meter{margin-top:22px;}
  .valrow{position:relative; height:18px; margin-bottom:4px;}
  .valnum{position:absolute; transform:translateX(-50%); font-size:13px; font-weight:800; color:#fff; white-space:nowrap; bottom:0; left:8%;
    transition:left 1.1s cubic-bezier(.22,1,.36,1) .5s;}
  .in .valnum{left:var(--p);}
  .valnum span{color:var(--fg3); font-weight:600;}
  .track{position:relative; height:9px; border-radius:6px; overflow:hidden;
    background:linear-gradient(90deg, var(--amber) 0 42%, var(--grey) 42% 58%, var(--blue) 58% 100%);}
  .track::after{content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(90deg, transparent 0 6.4%, rgba(0,0,0,.55) 6.4% 7.6%);}
  .mark{position:absolute; top:-7px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:9px solid #fff; z-index:2;
    transform:translateX(-50%); left:8%; transition:left 1.1s cubic-bezier(.22,1,.36,1) .5s; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}
  .in .mark{left:var(--p);}
  .ends{display:flex; justify-content:space-between; margin-top:7px; font-size:11.5px; font-weight:700;}
  .ends .lo{color:var(--amber);} .ends .hi{color:var(--blue-bright);}

  .replay{position:absolute; left:50%; bottom:18px; transform:translateX(-50%); z-index:5; padding:9px 20px; border-radius:999px;
    border:1px solid rgba(10,132,255,.45); background:rgba(10,132,255,.12); color:var(--blue-bright); font-size:13px; font-weight:600; cursor:pointer;}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="glow"></div>
    <canvas id="sphere"></canvas>

    <div class="center">
      <div class="num" id="num">0.0</div>
      <div class="label" id="label">YOUR AGE</div>
      <div class="younger" id="younger">3 years younger</div>
    </div>

    <div class="card c1 bad" data-delta="0.5">
      <div class="top"><div class="name">STEPS</div><div class="contrib"><span class="v">+0.5</span><div class="u">years</div></div></div>
      <div class="meter">
        <div class="valrow"><div class="valnum" style="--p:57%">6,841 <span>Steps</span></div></div>
        <div class="track"><div class="mark" style="--p:57%"></div></div>
        <div class="ends"><span class="lo">0K</span><span class="hi">12K</span></div>
      </div>
    </div>

    <div class="card c2 good" data-delta="-2.1">
      <div class="top"><div class="name">VO2 MAX</div><div class="contrib"><span class="v">-2.1</span><div class="u">years</div></div></div>
      <div class="meter">
        <div class="valrow"><div class="valnum" style="--p:58%">47</div></div>
        <div class="track"><div class="mark" style="--p:58%"></div></div>
        <div class="ends"><span class="lo">15</span><span class="hi">70</span></div>
      </div>
    </div>

    <div class="card c3 good" data-delta="-1.8">
      <div class="top"><div class="name">TIME IN HR ZONE 1-3</div><div class="contrib"><span class="v">-1.8</span><div class="u">years</div></div></div>
      <div class="meter">
        <div class="valrow"><div class="valnum" style="--p:75%">01:30 <span>h</span></div></div>
        <div class="track"><div class="mark" style="--p:75%"></div></div>
        <div class="ends"><span class="lo">0h</span><span class="hi">2h</span></div>
      </div>
    </div>

    <div class="card c4 bad" data-delta="0.4">
      <div class="top"><div class="name">SLEEP CONSISTENCY</div><div class="contrib"><span class="v">+0.4</span><div class="u">years</div></div></div>
      <div class="meter">
        <div class="valrow"><div class="valnum" style="--p:74%">74<span>%</span></div></div>
        <div class="track"><div class="mark" style="--p:74%"></div></div>
        <div class="ends"><span class="lo">0%</span><span class="hi">100%</span></div>
      </div>
    </div>

    <button class="replay" onclick="play()">&#8635; Replay</button>
  </div>

<script>
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('sphere'), ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W,H,cx,cy,R, P=[], t0=null, raf=null;
  var flare=0, rPulse=0;   // orb reaction state (brightness + size pulse)

  function resize(){
    var r = canvas.getBoundingClientRect();
    W=r.width; H=r.height; cx=W/2; cy=H/2; R=Math.min(W,H)*0.24;
    canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', function(){ resize(); });

  function build(){
    P=[]; var N=1100;
    for(var i=0;i<N;i++){
      var u=Math.random(), v=Math.random(), th=2*Math.PI*u, ph=Math.acos(2*v-1), rr=0.80+0.20*Math.random();
      P.push({ x:Math.sin(ph)*Math.cos(th)*rr, y:Math.cos(ph)*rr, z:Math.sin(ph)*Math.sin(th)*rr,
        size:0.5+Math.random()*1.6, tw:Math.random()*Math.PI*2, twS:0.8+Math.random()*1.3,
        al:0.35+Math.random()*0.55, white:Math.random()<0.16 });
    }
  }
  function frame(now){
    if(t0===null) t0=now;
    var t=(now-t0)/1000, intro = reduce ? 1 : Math.min(1, t/1.4);
    flare *= 0.93; rPulse *= 0.90;                 // decay the reaction each frame
    // idle life: the orb gently breathes and squash-stretches, then returns, so it is never static
    var idle = 0.022*Math.sin(t*0.85);
    var bx = 1 + 0.030*Math.sin(t*0.55);
    var by = 1 - 0.030*Math.sin(t*0.55);
    var Reff = R*(1 + rPulse*0.07 + idle);
    var ay=t*0.22, tilt=-0.32, ct=Math.cos(tilt), stt=Math.sin(tilt), cyA=Math.cos(ay), syA=Math.sin(ay);
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<P.length;i++){
      var p=P[i];
      var x=p.x*cyA + p.z*syA, z=-p.x*syA + p.z*cyA, y=p.y;
      var y2=y*ct - z*stt, z2=y*stt + z*ct;
      var depth=(z2+1)/2, sx=cx + x*Reff*bx, sy=cy + y2*Reff*by;
      var tw=0.55+0.45*Math.sin(t*p.twS+p.tw);
      var size=p.size*(0.45+1.05*depth)*(1+rPulse*0.5);
      var a=p.al*tw*(0.18+0.82*depth)*intro*(1+flare*1.3);
      if(a>1) a=1;
      ctx.fillStyle = p.white ? 'rgba(180,222,255,'+(a*1.05)+')' : 'rgba(10,132,255,'+a+')';
      ctx.beginPath(); ctx.arc(sx,sy,size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    ctx.beginPath(); ctx.ellipse(cx,cy, Reff*1.02*bx, Reff*1.02*by, 0, 0, Math.PI*2);
    ctx.strokeStyle='rgba(90,200,250,'+((0.22+0.4*flare)*intro)+')'; ctx.lineWidth=1+rPulse; ctx.stroke();
    raf=requestAnimationFrame(frame);
  }

  function easeOut(t){ return 1-Math.pow(1-t,3); }
  function tween(setter, from, to, dur){
    var start=null;
    (function tick(now){ if(start===null)start=now; var p=Math.min(1,(now-start)/dur);
      setter(from + (to-from)*easeOut(p)); if(p<1) requestAnimationFrame(tick); else setter(to); })(performance.now());
  }

  var TL=[];
  function at(ms,fn){ TL.push(setTimeout(fn,ms)); }
  function clearTL(){ TL.forEach(clearTimeout); TL=[]; }

  var START=30;
  var ORDER=['.c1','.c2','.c3','.c4'];
  var num=document.getElementById('num'), label=document.getElementById('label'), stage=document.getElementById('stage');
  function setNum(x){ num.textContent = x.toFixed(1); }

  function flyIn(el){
    var cr=el.getBoundingClientRect(), sr=stage.getBoundingClientRect();
    var dx=(sr.left+sr.width/2)-(cr.left+cr.width/2), dy=(sr.top+sr.height/2)-(cr.top+cr.height/2);
    el.style.transition='transform .85s cubic-bezier(.5,0,.25,1), opacity .85s ease';
    el.style.transform='translate('+dx+'px,'+dy+'px) scale(.12)';
    el.style.opacity='0';
  }
  function react(good){
    // the orb visibly responds: ripple ring + brightness flare + size pulse
    flare=0.9; rPulse=1;
    document.querySelector('.glow').classList.add('flash'); num.classList.add('bump');
    at(260,function(){ document.querySelector('.glow').classList.remove('flash'); num.classList.remove('bump'); });
    var rp=document.createElement('div'); rp.className='ripple';
    rp.style.borderColor = good ? 'rgba(90,200,250,.8)' : 'rgba(255,159,10,.7)';
    stage.appendChild(rp);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ rp.classList.add('go'); }); });
    at(900, function(){ if(rp.parentNode) rp.parentNode.removeChild(rp); });
  }

  function play(){
    clearTL();
    if(raf) cancelAnimationFrame(raf); t0=null; flare=0; rPulse=0;
    stage.classList.remove('in'); stage.classList.remove('done');
    document.querySelectorAll('.card').forEach(function(c){ c.style.cssText=''; });
    document.querySelectorAll('.ripple').forEach(function(r){ r.remove(); });
    label.textContent='YOUR AGE'; setNum(0);
    void stage.offsetWidth;

    if(reduce){
      stage.classList.add('in'); stage.classList.add('done');
      label.textContent='VITALITY AGE'; setNum(START-3);
      build(); frame(performance.now()); return;
    }

    stage.classList.add('in');
    raf=requestAnimationFrame(frame);
    at(300, function(){ tween(setNum, 0, START, 1100); });

    var running=START, base=2400, gap=950;
    ORDER.forEach(function(sel, i){
      at(base + i*gap, function(){
        var el=document.querySelector(sel);
        var d=parseFloat(el.getAttribute('data-delta'));
        var from=running; running=Math.round((running+d)*10)/10;
        if(i===0) label.textContent='CALCULATING';
        tween(setNum, from, running, 650);
        flyIn(el); react(d < 0);   // green ripple when it makes you younger, amber when older
      });
    });

    var endAt = base + ORDER.length*gap + 250;
    at(endAt, function(){ label.textContent='VITALITY AGE'; stage.classList.add('done'); });
    at(endAt + 3200, play);
  }

  window.addEventListener('load', function(){ resize(); build(); play(); });
</script>
</body>
</html>
