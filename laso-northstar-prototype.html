<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Laso North Star, Two Rituals One Loop</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  :root{
    --bg:#050607; --card1:#101216; --card2:#0B0C0F; --elev:#1C1F26;
    --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.09); --line3:rgba(255,255,255,.14);
    --hi:#F4F6F9; --mid:rgba(244,246,249,.6); --lo:rgba(244,246,249,.32);
    --accent:#22D3EE; --primary:#4DA3FF;
    --optimal:#10B981; --fair:#F59E0B; --poor:#E5484D;
    --sleep:#818CF8; --stress:#A78BFA;
    --fn:-apple-system,"SF Pro Rounded","SF Pro Display","Helvetica Neue",Arial,sans-serif;
    --fp:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  }
  html{background:#000}
  body{font-family:var(--fp);color:var(--hi);display:flex;justify-content:center;overflow-x:hidden;background:#000}
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
  svg{display:block}

  .app{width:100%;max-width:480px;min-height:100dvh;position:relative;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  @media (min-width:560px){
    body{padding:28px 0}
    .app{min-height:calc(100dvh - 56px);border:1px solid #1e2126;border-radius:44px;box-shadow:0 40px 90px rgba(0,0,0,.75)}
  }

  /* ambient score-tinted light */
  .ambient{position:absolute;top:-180px;left:50%;transform:translateX(-50%);width:620px;height:620px;border-radius:50%;pointer-events:none;filter:blur(50px);opacity:.5;transition:background 1.2s ease;z-index:0;
    background:radial-gradient(circle,var(--todayGlow,rgba(16,185,129,.32)),transparent 62%)}
  .app.night .ambient{background:radial-gradient(circle,rgba(109,99,241,.34),transparent 62%)}

  main{flex:1;position:relative;z-index:1}
  .view{display:none;padding:16px 16px 116px;animation:fadeUp .35s ease}
  .view.on{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.view,.sheet-panel,.ringp,.gdot,.checkpop{animation:none!important;transition:none!important}}

  .kick{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--lo)}
  .h1{font-family:var(--fn);font-size:30px;font-weight:800;letter-spacing:-.025em;margin-top:4px}
  .sub{font-size:14px;color:var(--mid)}
  .label{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--lo)}
  .it{font-size:16px;font-weight:700;letter-spacing:-.01em}

  .card{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--line2);border-radius:26px;padding:18px;margin-top:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .rowline{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .chev{color:var(--lo)}
  .pill{font-size:11.5px;font-weight:800;border-radius:999px;padding:5px 11px;display:inline-block;letter-spacing:.02em}

  .streak{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(34,211,238,.06));border:1px solid rgba(34,211,238,.3);color:var(--accent);border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px;font-family:var(--fn);box-shadow:0 4px 16px rgba(34,211,238,.12)}

  .modeseg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}
  .modeseg button{font-size:12px;font-weight:700;color:var(--mid);padding:7px 13px;border-radius:999px;transition:.2s}
  .modeseg button.on{background:var(--elev);color:var(--hi);box-shadow:0 2px 8px rgba(0,0,0,.4)}

  /* rings */
  .ringbox{position:relative;display:flex;align-items:center;justify-content:center}
  .ringp{transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)}
  .ringcenter{position:absolute;display:flex;flex-direction:column;align-items:center;text-align:center}
  .heronum{font-family:var(--fn);font-weight:800;font-size:clamp(64px,21vw,84px);line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .heropct{font-size:11px;letter-spacing:.22em;color:var(--lo);font-weight:800;margin-top:5px;text-transform:uppercase}
  .hero{display:flex;flex-direction:column;align-items:center;margin-top:18px}
  .tierpill{margin-top:16px;font-family:var(--fn);font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:8px 18px}
  .why{margin-top:12px;font-size:15.5px;color:var(--mid);text-align:center;max-width:330px;line-height:1.55}
  .receipt{margin-top:12px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--optimal);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.24);border-radius:999px;padding:8px 15px}
  .delta{position:absolute;top:8px;right:-6px;font-family:var(--fn);font-weight:800;font-size:13px;border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums;color:var(--optimal);background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.3)}

  /* sleep receipt strip */
  .stagestrip{display:flex;height:18px;border-radius:9px;overflow:hidden;margin-top:12px}
  .stagestrip i{height:100%}

  /* action card */
  .acticon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;background:linear-gradient(135deg,rgba(16,185,129,.24),rgba(16,185,129,.08));border:1px solid rgba(16,185,129,.28)}
  .cta{width:100%;background:linear-gradient(135deg,#2fe0f7,#17b6d4);color:#03242b;border-radius:16px;padding:16px;font-size:15.5px;font-weight:800;letter-spacing:-.01em;margin-top:16px;transition:filter .15s,transform .1s;box-shadow:0 10px 26px rgba(34,211,238,.22)}
  .cta:hover{filter:brightness(1.06)}
  .cta:active{transform:scale(.98)}
  .cta.ghost{background:rgba(255,255,255,.06);color:var(--hi);border:1px solid var(--line2);box-shadow:none}

  .donecard{border-color:rgba(16,185,129,.26);background:linear-gradient(180deg,rgba(16,185,129,.1),rgba(16,185,129,.03));text-align:center;padding:26px 18px}
  .checkpop{width:54px;height:54px;border-radius:50%;background:rgba(16,185,129,.16);border:1.5px solid rgba(16,185,129,.45);display:inline-flex;align-items:center;justify-content:center;font-size:24px;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

  /* bet gauge */
  .gauge{position:relative;height:18px;border-radius:9px;margin-top:18px;background:linear-gradient(90deg,#E5484D,#F59E0B 45%,#10B981 72%);opacity:.9}
  .gauge::after{content:'';position:absolute;inset:0;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .gtick{position:absolute;top:-7px;bottom:-7px;width:2px;background:rgba(255,255,255,.4);border-radius:1px}
  .gtick::after{content:'75';position:absolute;top:-16px;left:-7px;font-size:9.5px;font-weight:800;color:var(--lo)}
  .gdot{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);background:#fff;border:5px solid #0a0b0d;box-shadow:0 2px 12px rgba(0,0,0,.6);transition:left .6s cubic-bezier(.22,1,.36,1)}
  .betnum{font-family:var(--fn);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums;transition:color .4s}

  /* journey */
  .jstrip{display:flex;gap:10px;overflow-x:auto;margin:14px -16px 0;padding:4px 16px 8px;scrollbar-width:none}
  .jstrip::-webkit-scrollbar{display:none}
  .jt{flex:0 0 118px;border-radius:20px;padding:14px 12px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--card1),var(--card2));text-align:left;transition:transform .15s}
  .jt:hover{transform:translateY(-2px)}
  .jt .je{font-size:22px}
  .jt .jd{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:var(--lo);text-transform:uppercase;margin-top:8px}
  .jt .jn{font-size:12.5px;font-weight:700;margin-top:4px;line-height:1.3}
  .jt.done{border-color:rgba(16,185,129,.3)}
  .jt.done .je::after{content:' ✓';color:var(--optimal);font-size:14px;font-weight:800}
  .jt.now{border-color:rgba(34,211,238,.5);background:linear-gradient(180deg,rgba(34,211,238,.1),rgba(34,211,238,.02));box-shadow:0 8px 26px rgba(34,211,238,.14)}
  .jt.locked{opacity:.55}

  /* journal chips */
  .jgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .jc{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--mid);background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:16px;padding:14px 14px;transition:.18s;text-align:left}
  .jc .je2{font-size:19px}
  .jc.on{color:var(--hi);border-color:rgba(229,72,77,.5);background:rgba(229,72,77,.12);box-shadow:0 6px 18px rgba(229,72,77,.12)}
  .jc.pos.on{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.12);box-shadow:0 6px 18px rgba(16,185,129,.12)}
  .jfeed{font-size:13.5px;color:var(--mid);margin-top:14px;line-height:1.55;min-height:22px}

  /* night scene */
  .night1{background:linear-gradient(180deg,#131530,#0a0b18);border:1px solid rgba(129,140,248,.22);border-radius:26px;padding:24px 18px;margin-top:14px;position:relative;overflow:hidden;text-align:center}
  .star{position:absolute;color:rgba(255,255,255,.5);font-size:9px;animation:tw 3s infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:.8}}

  /* explore dials */
  .dials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .dial{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--line2);border-radius:22px;padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:9px}
  .dialnum{position:absolute;font-family:var(--fn);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
  .dial .dl{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lo)}

  .frow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
  .frow:last-child{border-bottom:0}
  .frow .fi{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .frow .fn2{flex:1;min-width:0}
  .frow .ft1{font-size:14.5px;font-weight:700}
  .frow .ft2{font-size:12.5px;color:var(--lo);margin-top:3px;line-height:1.45}
  .locked{opacity:.6}
  .lockpill{font-size:10.5px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--elev);color:var(--mid)}

  /* chat */
  .chat{display:flex;flex-direction:column;gap:10px;margin-top:14px;min-height:200px}
  .msg{max-width:88%;padding:12px 14px;border-radius:18px;font-size:14.5px;line-height:1.5}
  .msg.bot{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--line2);border-bottom-left-radius:6px;align-self:flex-start}
  .msg.me{background:linear-gradient(135deg,rgba(77,163,255,.3),rgba(77,163,255,.16));border:1px solid rgba(77,163,255,.3);border-bottom-right-radius:6px;align-self:flex-end}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chipq{font-size:13px;font-weight:600;color:var(--mid);background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:999px;padding:10px 15px;transition:.15s}
  .chipq:hover{color:var(--hi);border-color:var(--accent)}
  .askrow{display:flex;gap:8px;margin-top:14px}
  .askrow input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:14px;padding:13px 15px;color:var(--hi);font-size:14.5px;font-family:var(--fp);outline:none}
  .askrow input:focus{border-color:var(--accent)}
  .askrow button{background:var(--accent);color:#03242b;border-radius:14px;padding:0 18px;font-weight:800;font-size:14px}

  /* tab bar + why fab */
  .tabbar{position:sticky;bottom:0;z-index:30;display:flex;justify-content:space-around;align-items:center;padding:10px 4px calc(12px + env(safe-area-inset-bottom));background:rgba(5,6,7,.8);backdrop-filter:blur(24px);border-top:1px solid var(--line)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--lo);font-size:10px;font-weight:800;letter-spacing:.04em;padding:4px 16px;border-radius:12px;transition:color .18s}
  .tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--accent)}
  .whyfab{position:absolute;right:16px;bottom:96px;z-index:28;height:44px;border-radius:999px;background:rgba(28,31,38,.9);backdrop-filter:blur(12px);border:1px solid var(--line3);display:flex;align-items:center;gap:7px;padding:0 16px;font-size:13px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.55)}

  /* sheet */
  .sheetwrap{position:fixed;inset:0;z-index:50;display:none;justify-content:center;align-items:flex-end}
  .sheetwrap.open{display:flex}
  .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s}
  .sheetwrap.open .backdrop{opacity:1}
  .sheet-panel{position:relative;width:100%;max-width:480px;max-height:92dvh;background:linear-gradient(180deg,#101216,#08090b);border:1px solid var(--line3);border-bottom:0;border-radius:28px 28px 0 0;overflow-y:auto;padding:14px 18px 44px;transform:translateY(24px);animation:sheetUp .3s ease forwards}
  @keyframes sheetUp{to{transform:none}}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line3);margin:0 auto 10px}
  .sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .sheethead .st{font-family:var(--fn);font-size:20px;font-weight:800;letter-spacing:-.015em}
  .xbtn{width:32px;height:32px;border-radius:50%;background:var(--elev);color:var(--mid);font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}

  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--line2);border-radius:20px;padding:16px;text-align:center}
  .stat .sv{font-family:var(--fn);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
  .stat .sl{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lo);margin-top:5px}

  .zrow{display:flex;align-items:center;gap:10px;margin-top:10px}
  .zrow .zl{flex:0 0 110px;font-size:12.5px;font-weight:700;color:var(--mid)}
  .zbar{flex:1;height:12px;border-radius:6px;background:var(--elev);overflow:hidden}
  .zbar i{display:block;height:100%;border-radius:6px}
  .zrow .zm{flex:0 0 76px;text-align:right;font-family:var(--fn);font-size:12.5px;font-weight:700;color:var(--mid);font-variant-numeric:tabular-nums}
  .bb{height:14px;position:relative;border-radius:7px;background:var(--elev);margin-top:10px}
  .bb-band{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.12);border-radius:7px}
  .bb-dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(0,0,0,.45)}

  .whyblock{margin-top:14px;padding:16px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line)}
  .whyblock .wt{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .whyblock .wb{font-size:13.5px;color:var(--mid);line-height:1.6;margin-top:7px}
  .whyblock .wm{font-size:12.5px;color:var(--accent);font-weight:700;margin-top:9px;line-height:1.5}

  .toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%) translateY(8px);background:var(--elev);border:1px solid var(--line3);color:var(--hi);font-size:13px;font-weight:600;border-radius:999px;padding:11px 19px;opacity:0;transition:.25s;z-index:90;pointer-events:none;white-space:nowrap;box-shadow:0 12px 32px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%)}

  /* ---- redesign additions (Home + Explore) ---- */
  .sdots{display:flex;gap:4px;margin-top:7px;justify-content:flex-end}
  .sdot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .sdot.f{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
  .sdot.m{background:var(--line3)}
  .verdict{font-family:var(--fn);font-size:22px;font-weight:800;letter-spacing:-.02em;text-align:center;margin:14px auto 0;max-width:320px}
  .actioncard{position:relative;overflow:hidden}
  .actioncard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .cta.climax{animation:ctaPulse 2.4s ease-in-out infinite}
  @keyframes ctaPulse{0%,100%{box-shadow:0 10px 26px rgba(34,211,238,.22)}50%{box-shadow:0 10px 42px rgba(34,211,238,.5)}}
  .heroring svg{animation:breathe 5s ease-in-out infinite}
  @keyframes breathe{0%,100%{filter:drop-shadow(0 0 18px var(--heroGlow))}50%{filter:drop-shadow(0 0 34px var(--heroGlow))}}
  .gzone{position:absolute;top:0;bottom:0;left:75%;right:0;border-radius:0 9px 9px 0;box-shadow:inset 0 0 0 1.5px rgba(16,185,129,.55);pointer-events:none}
  .delta.dn{color:var(--poor);background:rgba(229,72,77,.14);border-color:rgba(229,72,77,.3)}
  .ddelta{position:absolute;top:4px;right:0;font-family:var(--fn);font-weight:800;font-size:10px;border-radius:999px;padding:3px 7px;font-variant-numeric:tabular-nums;color:var(--optimal);background:rgba(16,185,129,.16);border:1px solid rgba(16,185,129,.32)}
  .ddelta.dn{color:var(--poor);background:rgba(229,72,77,.16);border-color:rgba(229,72,77,.32)}
  .dialspark{margin-top:2px;opacity:.9;height:18px;display:flex;justify-content:center}
  .evrow{position:relative;height:22px;margin-bottom:6px}
  .evm{position:absolute;top:0;transform:translateX(-50%);font-size:14px}
  @media (prefers-reduced-motion: reduce){.heroring svg,.cta.climax{animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="ambient"></div>
<main>

  <!-- ============ TODAY ============ -->
  <section class="view on" id="view-today">
    <div class="rowline">
      <div>
        <div class="kick" id="greetDate"></div>
        <div class="h1" id="greetTitle">Good morning, Ayush</div>
      </div>
      <button class="streak" data-toast="5 day streak. Open and glance keeps it. 2 freezes protect it.">&#128293; 5</button>
    </div>
    <div class="rowline" style="margin-top:12px">
      <span class="label">Preview</span>
      <div class="modeseg" id="modeSeg">
        <button data-mode="morning" class="on">&#9728;&#65039; Morning</button>
        <button data-mode="tonight">&#127769; Tonight</button>
      </div>
    </div>

    <div id="ritual"></div>

    <div class="label" style="margin-top:26px">Your first week</div>
    <div class="jstrip" id="jstrip"></div>
  </section>

  <!-- ============ EXPLORE ============ -->
  <section class="view" id="view-explore">
    <div class="rowline">
      <div>
        <div class="kick">Everything your body told us</div>
        <div class="h1">Explore</div>
      </div>
      <div style="text-align:right"><button class="streak" data-toast="5 day streak. Open and glance keeps it.">&#128293; 5</button><div class="sdots" id="expDots"></div></div>
    </div>
    <div id="weekRibbon"></div>
    <div id="todayLever"></div>
    <div class="dials" id="dials"></div>
    <div class="card">
      <div class="label" style="margin-bottom:6px">What we know about you</div>
      <button class="frow" data-open="day2">
        <div class="fi" style="background:linear-gradient(135deg,rgba(129,140,248,.22),rgba(129,140,248,.08))">&#128564;</div>
        <div class="fn2"><div class="ft1">Your sleep fingerprint</div><div class="ft2">Fast to fall asleep, but late meals split your night at 3 am.</div></div>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="frow" data-open="day3">
        <div class="fi" style="background:linear-gradient(135deg,rgba(16,185,129,.22),rgba(16,185,129,.08))">&#128147;</div>
        <div class="fn2"><div class="ft1">Your HRV baseline</div><div class="ft2">62 ms from 90 days of history. Your numbers are judged against you now.</div></div>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="frow locked" data-open="day5">

<script>
'use strict';
const $ = s => document.querySelector(s);

const C = {

  sleep:'#818CF8', stress:'#A78BFA', accent:'#22D3EE', primary:'#4DA3FF', track:'#20242B',
  brain:'#F472B6', vitality:'#34D399', activity:'#FBBF24'
};
const bandColor = s => s >= 75 ? C.optimal : s >= 50 ? C.fair : C.poor;

const state = { mode:'morning', actionDone:false, tab:'today' };
const JOURNAL = new Set();
const EFFECTS = { 'Alcohol':-18, 'Late caffeine':-7, 'Screens in bed':-6, 'Reading instead':4 };
const BET_BASE = 82;
const betNow = () => Math.max(40, BET_BASE + [...JOURNAL].reduce((s, k) => s + EFFECTS[k], 0));

/* one source of truth for the demo story — keep internally consistent (drivers sum to the score, trend last = today) */
const DEMO = {
  baseline: 72,
  drivers: [['Deep sleep', 6], ['On-time bed', 3], ['Late meal', -3]],   // 72 + 6 + 3 - 3 = 78
  trend: [76, 79, 64, 81, 62, 80, 78],                                    // last = today 78; 5 of 7 above 72
  trendEvents: [{ i: 2, label: 'late night' }, { i: 4, label: 'late night' }, { i: 6, label: 'today', color: C.accent }],
  streak: ['k', 'k', 'm', 'k', 'f', 'k', 'k'],                            // kept / miss / freeze
  dials: [
    { n: 'Sleep',     v: '85',   pct: .85, c: C.sleep,    s: 'day2',     d: '&#9650; 3',   good: true,  tr: [80, 82, 79, 84, 81, 83, 85] },
    { n: 'Readiness', v: '78',   pct: .78, c: C.optimal,  s: 'day3',     d: '&#9650; 6',   good: true,  tr: [76, 79, 64, 81, 62, 80, 78] },
    { n: 'Calm',      v: '80',   pct: .80, c: C.stress,   s: 'calm',     d: '&#9660; 2',   good: false, tr: [84, 82, 80, 78, 81, 79, 80] },
    { n: 'Brain',     v: '81',   pct: .81, c: C.brain,    s: 'brain',    d: '&#9650; 1',   good: true,  tr: [79, 80, 78, 82, 80, 81, 81] },
    { n: 'Strain',    v: '8.4',  pct: .40, c: C.activity, s: 'strain',   d: 'LOW',         good: true,  tr: [12, 9, 14, 7, 10, 6, 9] },
    { n: 'Vitality',  v: '26.6', pct: .85, c: C.vitality, s: 'vitality', d: '&#9660; 1.5', good: true,  tr: [28.1, 27.8, 27.5, 27.2, 27, 26.8, 26.6] }
  ]
};

/* ---------- helpers ---------- */
function ringSVG(size, stroke, pct, color, center, glow){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, pct)));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);${glow ? `filter:drop-shadow(0 0 22px ${color}55)` : ''}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${C.track}" stroke-width="${stroke}" fill="none"/>
    <circle class="ringp" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/>
  </svg>${center || ''}`;
}
function animateRings(root){
  root.querySelectorAll('.ringp').forEach(el => {
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.strokeDashoffset = el.dataset.off; }));
  });
}
function countUp(el, to, dur){
  if (el._raf) cancelAnimationFrame(el._raf);
  const D = dur || 1100, t0 = performance.now();
  const step = t => {
    const p = Math.min(1, Math.max(0, (t - t0) / D)), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * e);
    if (p < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}
function spark(series, color, w, h){
  const W = w || 110, H = h || 34, pad = 3;
  const lo = Math.min(...series), hi = Math.max(...series);
  const px = i => pad + i * (W - 2 * pad) / (series.length - 1);
  const py = v => H - pad - ((v - lo) / ((hi - lo) || 1)) * (H - 2 * pad);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${series.map((v, i) => px(i) + ',' + py(v)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
/* trendSVG — spark() plus a dashed personal-baseline line and annotated event dots. Own function, does not touch spark(). */
function trendSVG(series, baseline, events, color, w, h){
  const W = w || 290, H = h || 62, pad = 8;
  const lo = Math.min(...series, baseline), hi = Math.max(...series, baseline);
  const px = i => pad + i * (W - 2 * pad) / (series.length - 1);
  const py = v => H - pad - ((v - lo) / ((hi - lo) || 1)) * (H - 2 * pad);
  const base = py(baseline);
  const marks = (events || []).map(e =>
    `<circle cx="${px(e.i)}" cy="${py(series[e.i])}" r="3.6" fill="${e.color || C.poor}"/>` +
    `<text x="${px(e.i)}" y="${H - 1}" font-size="8" fill="#7a8088" text-anchor="middle">${e.label}</text>`).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <line x1="${pad}" y1="${base}" x2="${W - pad}" y2="${base}" stroke="#ffffff33" stroke-width="1" stroke-dasharray="4 4"/>
    <polyline points="${series.map((v, i) => px(i) + ',' + py(v)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${marks}</svg>`;
}
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1900);
}
const STARS = [[8,12],[24,28],[86,10],[68,30],[40,8],[92,34],[14,40],[55,18]].map(p =>
  `<span class="star" style="left:${p[0]}%;top:${p[1]}px;animation-delay:${(p[0] % 5) * .4}s">&#10022;</span>`).join('');

/* ---------- TODAY: two rituals ---------- */

    r.innerHTML = `
      <div class="hero">
        <div class="ringbox heroring" style="--heroGlow:${C.optimal}88">
          ${ringSVG(224, 15, 0.78, C.optimal, `<div class="ringcenter"><div class="heronum" id="heroNum" style="color:${C.optimal}">0</div><div class="heropct" style="color:${C.optimal}">Ready</div><div style="font-size:11px;color:var(--lo);font-weight:700;margin-top:4px;letter-spacing:0">your normal 72</div></div>`, true)}
          <div class="delta">&#9650; 6</div>
        </div>

      </div>

      ${state.actionDone ? `

      </div>`}

      <div class="statgrid" style="grid-template-columns:1fr 1fr 1fr">
        <button class="stat" data-open="day2"><div class="sv" style="color:${C.sleep}">85</div><div class="sl">Sleep %</div></button>
        <button class="stat" data-open="day3"><div class="sv" style="color:${C.optimal}">68</div><div class="sl">HRV &#9650;6</div></button>
        <button class="stat" data-open="tonightpeek"><div class="sv" style="color:${C.optimal}">&#10003;</div><div class="sl">Bet won</div></button>
      </div>

      <button class="card" style="width:100%;text-align:left" data-mode-go="tonight">
        <div class="rowline">
          <span class="label">Tonight &#8594; <b style="color:${bandColor(betNow())};font-family:var(--fn);font-size:15px">${betNow()}</b></span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="gauge" style="height:8px;margin-top:12px"><span class="gzone"></span><span class="gtick" style="left:75%"></span><span class="gdot" style="left:${betNow()}%;width:16px;height:16px;border-width:3px"></span></div>
      </button>`;
    animateRings(r);
    countUp($('#heroNum'), 78);
    const ab = $('#actionBtn');
    if (ab) ab.addEventListener('click', () => { state.actionDone = true; renderRitual(); toast('Planned. Your streak is safe for today.'); });
  } else {
    $('#greetTitle').textContent = 'Good evening, Ayush';
    const b = betNow();
    r.innerHTML = `
      <div class="hero" style="margin-top:22px">
        <div class="kick" style="letter-spacing:.22em">Tomorrow&#8217;s forecast</div>
        <div class="betnum" id="betNum" style="color:${bandColor(b)};margin-top:10px">${b}</div>
        <div style="width:100%;max-width:330px;padding:0 6px">
          <div class="gauge" style="height:22px"><span class="gzone"></span><span class="gtick" style="left:75%"></span><span class="gdot" id="betDot" style="left:${b}%;box-shadow:0 0 14px #10B981,0 2px 12px rgba(0,0,0,.6)"></span></div>
        </div>
        <div class="verdict" style="margin-top:18px;color:${bandColor(b)}">In bed by 10:30 holds this.</div>
        <div class="sub" style="text-align:center;margin-top:6px;max-width:320px">Green band starts at 75. Every tap below moves the dot, live.</div>
      </div>

      <div class="card">
        <div class="label">What happened tonight? 10 seconds</div>
        <div class="jgrid">
          <button class="jc" data-j="Alcohol"><span class="je2">&#127863;</span> Alcohol</button>
          <button class="jc" data-j="Late caffeine"><span class="je2">&#9749;</span> Late caffeine</button>
          <button class="jc" data-j="Screens in bed"><span class="je2">&#128241;</span> Screens in bed</button>
          <button class="jc pos" data-j="Reading instead"><span class="je2">&#128213;</span> Reading instead</button>
        </div>
        <div id="betLedger" style="margin-top:8px"></div>
        <div class="jfeed" id="jfeed">Tap what applies. Watch the forecast react.</div>
      </div>

      <div class="night1">
        ${STARS}
        <div style="font-size:26px">&#127769;</div>
        <div class="it" style="margin-top:10px;font-size:16px">Wind down 10:00 &#183; reveal 7:00 am</div>
        <div class="sub" style="margin-top:6px;line-height:1.5">Streak safe. Good night.</div>
      </div>`;
    updateBet();

}
function renderJourney(){
  const days = [
    {d:'Day 1', n:'Your 90 day story', e:'&#129516;', s:'done', sheet:'day1'},
    {d:'Day 2', n:'Sleep fingerprint', e:'&#128564;', s:'done', sheet:'day2'},
    {d:'Day 3', n:'HRV baseline', e:'&#128147;', s:'now', sheet:'day3'},
    {d:'Day 5', n:'First correlation', e:'&#128279;', s:'locked', sheet:'day5'},
    {d:'Day 7', n:'Week 1 report', e:'&#128202;', s:'locked', sheet:'day7'}
  ];
  $('#jstrip').innerHTML = days.map(x => `
    <button class="jt ${x.s}" data-open="${x.sheet}">
      <div class="je">${x.s === 'locked' ? '&#128274;' : x.e}</div>
      <div class="jd">${x.d}${x.s === 'now' ? ' &#183; today' : ''}</div>
      <div class="jn">${x.n}</div>
    </button>`).join('');
}
function updateBet(){
  const b = betNow();
  const bn = $('#betNum'), bd = $('#betDot');
  if (bn){ bn.textContent = b; bn.style.color = bandColor(b); }
  if (bd) bd.style.left = b + '%';
  const led = $('#betLedger');
  if (led){
    const rows = [`<div class="zrow"><div class="zl">Base</div><div class="zbar"><i style="width:82%;background:var(--elev)"></i></div><div class="zm">82</div></div>`];
    [...JOURNAL].forEach(k => {
      const e = EFFECTS[k];
      rows.push(`<div class="zrow"><div class="zl">${k}</div><div class="zbar"><i style="width:${Math.min(100, Math.abs(e) * 4 + 6)}%;background:${e > 0 ? C.optimal : C.poor}"></i></div><div class="zm" style="color:${e > 0 ? C.optimal : C.poor}">${e > 0 ? '+' : ''}${e}</div></div>`);
    });
    rows.push(`<div class="zrow"><div class="zl" style="font-weight:800;color:var(--hi)">Forecast</div><div class="zbar"><i style="width:${b}%;background:${bandColor(b)}"></i></div><div class="zm" style="color:${bandColor(b)}">${b}</div></div>`);
    led.innerHTML = rows.join('');
  }
  const fb = $('#jfeed');
  if (fb){
    if (!JOURNAL.size) fb.innerHTML = 'Tap what applies. Watch the forecast react.';
    else {
      const parts = [...JOURNAL].map(k => `${k} ${EFFECTS[k] > 0 ? '+' : ''}${EFFECTS[k]}`);
      fb.innerHTML = `Logged: ${parts.join(', ')}. <b style="color:${bandColor(b)}">Forecast ${b}.</b> Tomorrow we grade it against reality. That is how your correlations get built.`;
    }

}

/* ---------- COACH ---------- */
function coachReply(q){
  const ql = q.toLowerCase();
  if (ql.includes('bet') || ql.includes('forecast')) return 'The forecast is a promise with a receipt. Tonight your choices set a number, tomorrow your body grades it. After a week the gap between forecast and reality becomes your personal playbook.';
  if (ql.includes('run') || ql.includes('train')) return 'You are green today, 78. A 30 minute easy run lands well. Keep your heart rate under 150 and tomorrow will thank you.';
  if (ql.includes('sleep')) return 'Aim for 7.8 hours tonight, in bed by 10:30. Your last three green mornings all followed that bedtime. That is your pattern, not a generic rule.';
  return 'You are at 78 and green. Ask me about tonight, training, or what your first week is unlocking.';
}
function addMsg(text, me){
  const m = document.createElement('div');
  m.className = 'msg ' + (me ? 'me' : 'bot');
  m.textContent = text;
  $('#chat').appendChild(m);
  m.scrollIntoView({behavior:'smooth', block:'end'});
}
function ask(q){
  if (!q || !q.trim()) return;
  addMsg(q, true);
  setTimeout(() => addMsg(coachReply(q), false), 400);
}
function initCoach(){
  $('#chat').innerHTML = '';
  addMsg('Morning. You are green at 78. What would you like to know?', false);
  $('#coachChips').innerHTML = ['How does the bet work?', 'Should I train hard today?', 'What sets my sleep need?'].map(q => `<button class="chipq">${q}</button>`).join('');
  document.querySelectorAll('#coachChips .chipq').forEach(b => b.addEventListener('click', () => ask(b.textContent)));
}

  day7(){

        <div style="font-size:32px">&#128274;</div>
        <div class="it" style="margin-top:12px">Unlocks Saturday</div>

  calm(){
    const seg = [['s',7],['s',8],['r',9],['s',10],['r',11],['o',12],['s',13],['s',14],['r',15],['r',16],['s',17],['s',18],['r',19],['s',20],['r',21],['o',22]];

      <div class="hero" style="margin-top:8px">
        <div class="ringbox">${ringSVG(178, 13, 0.80, C.stress, `<div class="ringcenter"><div style="font-family:var(--fn);font-weight:800;font-size:46px;line-height:1;color:${C.stress}">80</div><div class="heropct">Calm</div></div>`, true)}</div>

          <span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:#3d436e;margin-right:6px"></i>Relaxed</span>

      <div class="card">
        <div class="zrow"><div class="zl">Stressed</div><div class="zbar"><i style="width:50%;background:${C.poor}"></i></div><div class="zm">8 h</div></div>

        <div class="zrow"><div class="zl">Restorative</div><div class="zbar"><i style="width:13%;background:${C.optimal}"></i></div><div class="zm">2 h</div></div>
        <div class="sub" style="font-size:12.5px;margin-top:12px;line-height:1.55">8 stressed hours, and they clustered around meetings, not workouts. That is mental load, and only 2 restorative hours paid it back.</div>
      </div>
      <div class="card"><div class="label" style="color:${C.stress};margin-bottom:6px">Do this today</div><div class="it" style="font-size:16px">One 5-min Unwind before dinner</div><div class="sub" style="font-size:12.5px;margin-top:5px">On days you did one, your next-morning readiness came in about 7 points higher.</div></div>`;
  },

  brain(){
    return HEAD('Brain health') + `
      <div class="hero" style="margin-top:8px">
        <div class="ringbox">${ringSVG(178, 13, 0.81, C.brain, `<div class="ringcenter"><div style="font-family:var(--fn);font-weight:800;font-size:46px;line-height:1;color:${C.brain}">81</div><div class="heropct">of 100</div></div>`, true)}</div>
      </div>
      <div class="sub" style="text-align:center;margin-top:6px">81 and sharp, but memory is your weak driver, down 4 points. It is the first thing short sleep takes.</div>
      <div class="card">
        <div class="label" style="margin-bottom:8px">What drives it</div>
        <div class="zrow"><div class="zl">Readiness 40%</div><div class="zbar"><i style="width:81%;background:${C.brain}"></i></div><div class="zm">-2 pts</div></div>
        <div class="zrow"><div class="zl">Memory 25%</div><div class="zbar"><i style="width:72%;background:${C.brain}"></i></div><div class="zm">-4 pts</div></div>

        <div class="zrow"><div class="zl">Focus 15%</div><div class="zbar"><i style="width:76%;background:${C.brain}"></i></div><div class="zm">+1 pt</div></div>

        <div class="sub" style="font-size:12.5px;margin-top:9px">You are 7.6 short of the zone. On a 0 to 21 log scale those last points are the hardest, so it takes a real session, not a walk.</div>

  vitality(){
    return HEAD('Vitality age') + `
      <div class="hero" style="margin-top:12px">

      </div>

  tonightpeek(){

      <div class="sub" style="margin-top:4px">A preview of the evening ritual. One nudge, three taps, done.</div>
      <div class="card">
        <div class="frow"><div class="fi" style="background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(34,211,238,.08))">&#128276;</div><div class="fn2"><div class="ft1">10:00 pm, one notification</div><div class="ft2">Wind down now. In bed by 10:30 holds tomorrow at 82.</div></div></div>
        <div class="frow"><div class="fi" style="background:linear-gradient(135deg,rgba(129,140,248,.22),rgba(129,140,248,.08))">&#128221;</div><div class="fn2"><div class="ft1">Three taps of honesty</div><div class="ft2">Alcohol, late caffeine, screens. The forecast reacts live.</div></div></div>
        <div class="frow"><div class="fi" style="background:linear-gradient(135deg,rgba(16,185,129,.22),rgba(16,185,129,.08))">&#127769;</div><div class="fn2"><div class="ft1">Then the app says good night</div><div class="ft2">Reveal at 7:00 am. The loop closes while you sleep.</div></div></div>
      </div>

  },

  why(){
    return HEAD('Why this design') + `
      <div class="sub" style="margin-top:2px;line-height:1.55">90% of new users leave within a week. This design exists to make them come back tomorrow, then the day after. Target: 50% still here on day 7.</div>

      <div class="whyblock">
        <div class="wt">1. The old app told users to leave</div>
        <div class="wb">"Day 5 of 8, learning your patterns" sat in slot 2 and promised value later than the churn window. Meanwhile 13 cards, 32 metrics and three different confidence percentages answered a question nobody asked.</div>
        <div class="wm">Fix: one score, one why line, one action, then an explicit done state. Oura cut 5 tabs to 3 for exactly this reason.</div>
      </div>

      <div class="whyblock">
        <div class="wt">2. Day 1 value comes from the past, not the future</div>
        <div class="wb">The phone already holds 90 days of HealthKit history. The first session mines it: your real sleep need, your best mornings, your 48 hour late night tax. No dead calibration week, no apology banner.</div>
        <div class="wm">Fix: the Day 1 story reveal. Amplitude: products that deliver value in session 1 keep roughly double the users at day 7.</div>
      </div>

      <div class="whyblock">
        <div class="wt">3. The bet is the retention engine</div>
        <div class="wb">People return to see something they caused. Tonight you log three taps and the forecast moves live, tomorrow morning the reveal grades it. Two sessions a day, each one paying off the other. WHOOP has the pieces, sleep planner and journal, but the payoff takes months. Ours pays tomorrow.</div>
        <div class="wm">Fix: Tonight&#8217;s bet gauge + the morning receipt chip under the score.</div>
      </div>

      <div class="whyblock">
        <div class="wt">4. Calibration became an advent calendar</div>
        <div class="wb">The waiting room is now the content: Day 2 sleep fingerprint, Day 3 HRV baseline, Day 5 first correlation, Day 7 week report. Each day has a named reason to open the app. WHOOP&#8217;s dated unlock schedule crossed with Oura&#8217;s calibration countdowns.</div>
        <div class="wm">Fix: the Your First Week strip with dated unlocks.</div>
      </div>

      <div class="whyblock">
        <div class="wt">5. Streak that forgives, paywall that waits</div>
        <div class="wb">Open and glance keeps the streak, two freezes protect it. Duolingo&#8217;s freeze cut churn 21% for at risk users. Nothing is paywalled in week 1: the wall moved past the day 5 correlation, when the user has seen the product be right about them.</div>
        <div class="wm">Fix: forgiving streak chip + Pro deferred past the first aha.</div>
      </div>

      <div class="whyblock">
        <div class="wt">What we deliberately rejected</div>
        <div class="wb">WHOOP&#8217;s 0 to 21 strain scale (unintuitive), home screen metric walls (overwhelm), weekly and monthly assessments up front (WHOOP itself retired them in app), leaderboards for beginners (they always lose), and hard score cutoffs on noisy day 1 data (trust killer). Vitals still exist, one tap deep, interpreted first.</div>
      </div>

      <div class="whyblock">
        <div class="wt">Honesty about the number</div>
        <div class="wb">Health apps average 7 to 11% day 7 retention and the best cross category products hold about double that. 50% is beyond every published benchmark, so treat it as the design target, not a forecast. Every lever here has published evidence, and each one is measurable: day 1 story completion, bet participation, reveal opens, day 5 unlock views.</div>
      </div>`;
  }
};

function openSheet(kind){
  const p = $('#sheetPanel');
  p.innerHTML = '<div class="grab"></div>' + SHEETS[kind]();
  $('#sheetwrap').classList.add('open');
  p.scrollTop = 0;
  animateRings(p);
}
function closeSheet(){ $('#sheetwrap').classList.remove('open'); }

/* ---------- nav + wiring ---------- */
function setTab(t){
  state.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + t));
  if (t === 'coach' && !$('#chat').childElementCount) initCoach();
}
function setMode(m){
  state.mode = m;
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  renderRitual();
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#backdrop').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('#askBtn').addEventListener('click', () => { ask($('#askInput').value); $('#askInput').value = ''; });
$('#askInput').addEventListener('keydown', e => { if (e.key === 'Enter'){ ask(e.target.value); e.target.value = ''; } });

document.body.addEventListener('click', e => {
  const el = e.target.closest('[data-close],[data-open],[data-toast],[data-j],[data-mode-go]');
  if (!el) return;
  if (el.hasAttribute('data-close')) return closeSheet();
  if (el.hasAttribute('data-open')) return openSheet(el.dataset.open);
  if (el.hasAttribute('data-mode-go')){ closeSheet(); return setMode(el.dataset.modeGo); }
  if (el.hasAttribute('data-j')){
    const k = el.dataset.j;
    if (JOURNAL.has(k)) JOURNAL.delete(k); else JOURNAL.add(k);
    el.classList.toggle('on');
    return updateBet();
  }
  if (el.hasAttribute('data-toast')) return toast(el.dataset.toast);
});

$('#greetDate').textContent = new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}).toUpperCase();
renderRitual();
renderExplore();
</script>
</body>
</html>
