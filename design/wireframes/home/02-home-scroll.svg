<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <clipPath id="screen-clip">
      <rect width="393" height="852" rx="44"/>
    </clipPath>
    <linearGradient id="blur-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F2F7" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#F2F2F7" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <g id="Background" clip-path="url(#screen-clip)">
    <rect width="393" height="852" fill="#F2F2F7" rx="44"/>
  </g>

  <!-- Status Bar -->
  <g id="Status-Bar">
    <text x="36" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
    <circle cx="298" cy="17" r="3" fill="#1C1C1E"/>
    <circle cx="308" cy="17" r="3" fill="#1C1C1E"/>
    <circle cx="318" cy="17" r="3" fill="#1C1C1E"/>
    <circle cx="328" cy="17" r="3" fill="#8E8E93"/>
    <path d="M340 13 Q345 9 350 13" stroke="#1C1C1E" stroke-width="1.5" fill="none"/>
    <path d="M342 16 Q345 13 348 16" stroke="#1C1C1E" stroke-width="1.5" fill="none"/>
    <circle cx="345" cy="18" r="1.2" fill="#1C1C1E"/>
    <rect x="355" y="11" width="22" height="12" rx="3" stroke="#1C1C1E" stroke-width="1" fill="none"/>
    <rect x="377" y="15" width="2" height="4" rx="1" fill="#1C1C1E"/>
    <rect x="357" y="13" width="16" height="8" rx="1.5" fill="#34C759"/>
  </g>

  <!-- Scrolled Top Bar -->
  <g id="Top-Nav-Scrolled">
    <rect x="0" y="0" width="393" height="52" fill="#F2F2F7" opacity="0.95"/>
    <text x="20" y="44" font-family="-apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#1C1C1E">Home</text>
    <line x1="0" y1="52" x2="393" y2="52" stroke="#E5E5EA" stroke-width="0.5"/>
  </g>

  <!-- Body Insights Section -->
  <g id="Body-Insights-Section">
    <text x="20" y="80" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Body Insights</text>

    <!-- Weight Trend Card -->
    <g id="Weight-Trend-Card">
      <rect x="20" y="92" width="168" height="100" rx="16" fill="#FFFFFF"/>
      <text x="40" y="118" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#8E8E93">Weight Trend</text>
      <text x="40" y="144" font-family="-apple-system, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1C1C1E">165.2</text>
      <text x="127" y="144" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#8E8E93">lbs</text>
      <!-- Mini trend line -->
      <polyline points="40,172 60,170 80,174 100,168 120,166 140,164 160,162" fill="none" stroke="#34C759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- BMI Status Card -->
    <g id="BMI-Status-Card">
      <rect x="205" y="92" width="168" height="100" rx="16" fill="#FFFFFF"/>
      <text x="225" y="118" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#8E8E93">BMI Status</text>
      <text x="225" y="144" font-family="-apple-system, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1C1C1E">23.4</text>
      <rect x="225" y="156" width="56" height="22" rx="11" fill="#34C75920"/>
      <text x="253" y="171" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#34C759">Normal</text>
    </g>
  </g>

  <!-- Health Risks Section -->
  <g id="Health-Risks-Section">
    <text x="20" y="224" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Needs Attention</text>

    <!-- Risk Card 1 (Red) -->
    <g id="Risk-Card-High">
      <rect x="20" y="236" width="353" height="64" rx="16" fill="#FFFFFF"/>
      <rect x="20" y="236" width="5" height="64" rx="2.5" fill="#FF3B30"/>
      <text x="44" y="260" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">Elevated Resting HR Pattern</text>
      <rect x="282" y="248" width="68" height="20" rx="10" fill="#FF3B3020"/>
      <text x="316" y="262" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF3B30">High Risk</text>
      <text x="44" y="280" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#8E8E93">3 consecutive days above baseline</text>
    </g>

    <!-- Risk Card 2 (Orange) -->
    <g id="Risk-Card-Medium">
      <rect x="20" y="308" width="353" height="64" rx="16" fill="#FFFFFF"/>
      <rect x="20" y="308" width="5" height="64" rx="2.5" fill="#FF9500"/>
      <text x="44" y="332" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">Sleep Duration Declining</text>
      <rect x="282" y="320" width="68" height="20" rx="10" fill="#FF950020"/>
      <text x="316" y="334" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF9500">Moderate</text>
      <text x="44" y="352" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#8E8E93">Average down 42min vs last month</text>
    </g>

    <!-- Risk Card 3 (Yellow) -->
    <g id="Risk-Card-Low">
      <rect x="20" y="380" width="353" height="64" rx="16" fill="#FFFFFF"/>
      <rect x="20" y="380" width="5" height="64" rx="2.5" fill="#FFCC00"/>
      <text x="44" y="404" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">Low Activity Trend</text>
      <rect x="297" y="392" width="52" height="20" rx="10" fill="#FFCC0020"/>
      <text x="323" y="406" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#CC9900">Low</text>
      <text x="44" y="424" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#8E8E93">Step count 18% below weekly average</text>
    </g>
  </g>

  <!-- Weekly Review Card -->
  <g id="Weekly-Review-Card">
    <text x="20" y="474" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Weekly Review</text>
    <rect x="20" y="486" width="353" height="90" rx="16" fill="#FFFFFF"/>
    <text x="40" y="516" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Score: 74 → 78</text>
    <rect x="218" y="502" width="38" height="20" rx="10" fill="#34C75920"/>
    <text x="237" y="516" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#34C759">+4</text>
    <text x="40" y="538" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">3 wins this week</text>
    <text x="40" y="560" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#007AFF">View Full Review</text>
    <path d="M 156 554 L 161 560 L 156 566" fill="none" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Coach Recommendations Section -->
  <g id="Coach-Recommendations-Section">
    <text x="20" y="606" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Coach Recommendations</text>

    <!-- Action Card 1 -->
    <g id="Action-Card-1">
      <rect x="20" y="618" width="353" height="50" rx="16" fill="#FFFFFF"/>
      <circle cx="48" cy="643" r="13" fill="#007AFF20"/>
      <text x="48" y="648" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13">&#x1F6B6;</text>
      <text x="70" y="647" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#1C1C1E">Add a 20-min evening walk</text>
      <path d="M 350 637 L 356 643 L 350 649" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Action Card 2 -->
    <g id="Action-Card-2">
      <rect x="20" y="676" width="353" height="50" rx="16" fill="#FFFFFF"/>
      <circle cx="48" cy="701" r="13" fill="#007AFF20"/>
      <text x="48" y="706" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13">&#x1F634;</text>
      <text x="70" y="705" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#1C1C1E">Aim for bedtime before 11pm</text>
      <path d="M 350 695 L 356 701 L 350 707" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Correlations Teaser Section (PRO gated) -->
  <g id="Correlations-Teaser-Section">
    <g id="Correlations-Header">
      <text x="20" y="756" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Correlations</text>
      <!-- PRO badge -->
      <rect x="138" y="740" width="40" height="20" rx="6" fill="#007AFF"/>
      <text x="158" y="754" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">PRO</text>
    </g>

    <!-- Blurred/dimmed preview card -->
    <g id="Correlations-Locked-Preview">
      <rect x="20" y="766" width="353" height="80" rx="16" fill="#FFFFFF" opacity="0.6"/>
      <!-- Faux blurred content -->
      <rect x="40" y="780" width="100" height="8" rx="4" fill="#E5E5EA"/>
      <rect x="40" y="796" width="160" height="8" rx="4" fill="#E5E5EA"/>
      <rect x="40" y="812" width="80" height="8" rx="4" fill="#E5E5EA"/>
      <rect x="250" y="784" width="40" height="40" rx="8" fill="#E5E5EA"/>
      <rect x="300" y="784" width="40" height="40" rx="8" fill="#E5E5EA"/>

      <!-- Overlay -->
      <rect x="20" y="766" width="353" height="80" rx="16" fill="url(#blur-fade)"/>

      <!-- Lock icon + CTA -->
      <g id="Lock-Overlay" transform="translate(196, 806)">
        <!-- Lock body -->
        <rect x="-7" y="-4" width="14" height="10" rx="2" fill="#8E8E93"/>
        <!-- Lock shackle -->
        <path d="M -4 -4 L -4 -9 A 4 4 0 0 1 4 -9 L 4 -4" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
        <text x="0" y="22" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#007AFF">Upgrade to unlock</text>
      </g>
    </g>
  </g>

  <!-- Bottom Tab Bar -->
  <g id="Tab-Bar">
    <rect x="0" y="778" width="393" height="74" fill="#FFFFFF"/>
    <line x1="0" y1="778" x2="393" y2="778" stroke="#E5E5EA" stroke-width="0.5"/>
    <!-- Home tab (selected) -->
    <g id="Tab-Home-Selected">
      <path d="M 66 798 L 78 788 L 90 798 L 90 812 L 82 812 L 82 804 L 74 804 L 74 812 L 66 812 Z" fill="#007AFF"/>
      <text x="78" y="826" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#007AFF">Home</text>
    </g>
    <!-- Live tab -->
    <g id="Tab-Live">
      <line x1="187" y1="803" x2="187" y2="795" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
      <line x1="192" y1="807" x2="192" y2="789" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
      <line x1="197" y1="804" x2="197" y2="793" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
      <line x1="202" y1="807" x2="202" y2="786" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
      <line x1="207" y1="803" x2="207" y2="792" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
      <text x="197" y="826" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="500" fill="#8E8E93">Live</text>
    </g>
    <!-- Explore tab -->
    <g id="Tab-Explore">
      <rect x="304" y="804" width="6" height="10" rx="1.5" fill="#8E8E93"/>
      <rect x="313" y="798" width="6" height="16" rx="1.5" fill="#8E8E93"/>
      <rect x="322" y="790" width="6" height="24" rx="1.5" fill="#8E8E93"/>
      <text x="316" y="826" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="500" fill="#8E8E93">Explore</text>
    </g>
    <!-- Home indicator -->
    <rect x="148" y="840" width="97" height="4" rx="2" fill="#1C1C1E"/>
  </g>
</svg>