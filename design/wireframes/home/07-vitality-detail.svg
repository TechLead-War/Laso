<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <clipPath id="screen-clip">
      <rect width="393" height="852" rx="44"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g id="Background" clip-path="url(#screen-clip)">
    <rect width="393" height="852" fill="#F2F2F7" rx="44"/>
  </g>

  <!-- Status Bar -->
  <g id="Status-Bar">
    <text x="36" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
    <circle cx="298" cy="17" r="3" fill="#1C1C1E"/>
    <circle cx="308" cy="17" r="3" fill="#1C1C1E"/>
    <circle cx="318" cy="17" r="3" fill="#1C1C1E"/>
    <circle cx="328" cy="17" r="3" fill="#8E8E93"/>
    <path d="M340 13 Q345 9 350 13" stroke="#1C1C1E" stroke-width="1.5" fill="none"/>
    <path d="M342 16 Q345 13 348 16" stroke="#1C1C1E" stroke-width="1.5" fill="none"/>
    <circle cx="345" cy="18" r="1.2" fill="#1C1C1E"/>
    <rect x="355" y="11" width="22" height="12" rx="3" stroke="#1C1C1E" stroke-width="1" fill="none"/>
    <rect x="377" y="15" width="2" height="4" rx="1" fill="#1C1C1E"/>
    <rect x="357" y="13" width="16" height="8" rx="1.5" fill="#34C759"/>
  </g>

  <!-- Navigation Bar -->
  <g id="Nav-Bar">
    <rect x="0" y="36" width="393" height="52" fill="#F2F2F7"/>
    <!-- Back chevron -->
    <g id="Back-Button">
      <path d="M 14 54 L 6 62 L 14 70" fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="67" font-family="-apple-system, system-ui, sans-serif" font-size="17" fill="#007AFF">Home</text>
    </g>
    <text x="196" y="67" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#1C1C1E">Vitality Age</text>
    <line x1="0" y1="88" x2="393" y2="88" stroke="#E5E5EA" stroke-width="0.5"/>
  </g>

  <!-- Hero Section -->
  <g id="Vitality-Hero-Section">
    <!-- Large Ring -->
    <g id="Vitality-Ring" transform="translate(196, 180)">
      <circle cx="0" cy="0" r="70" fill="none" stroke="#E5E5EA" stroke-width="10"/>
      <!-- Filled ring (~85%) -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#34C759" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="374 66" stroke-dashoffset="110" transform="rotate(-90)"/>
      <text x="0" y="8" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="48" font-weight="700" fill="#1C1C1E">31</text>
      <text x="0" y="28" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93">years</text>
    </g>
    <!-- Subtitle -->
    <rect x="136" y="268" width="120" height="28" rx="14" fill="#34C75920"/>
    <text x="196" y="287" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#34C759">3 years younger</text>
    <text x="196" y="312" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">vs actual age 34</text>
  </g>

  <!-- Per-Metric Breakdown -->
  <g id="Metric-Breakdown-Section">
    <text x="20" y="352" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Metric Contributions</text>
    <rect x="20" y="366" width="353" height="216" rx="16" fill="#FFFFFF"/>

    <!-- Resting HR -->
    <g id="Metric-RestingHR">
      <circle cx="40" cy="396" r="5" fill="#34C759"/>
      <text x="56" y="392" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">Resting HR</text>
      <text x="56" y="408" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#8E8E93">62 bpm (expected 68)</text>
      <text x="353" y="400" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#34C759">-2.0 yrs</text>
      <line x1="40" y1="420" x2="353" y2="420" stroke="#E5E5EA" stroke-width="0.5"/>
    </g>

    <!-- VO2 Max -->
    <g id="Metric-VO2Max">
      <circle cx="40" cy="446" r="5" fill="#34C759"/>
      <text x="56" y="442" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">VO2 Max</text>
      <text x="56" y="458" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#8E8E93">42 mL/kg/min (expected 38)</text>
      <text x="353" y="450" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#34C759">-1.5 yrs</text>
      <line x1="40" y1="470" x2="353" y2="470" stroke="#E5E5EA" stroke-width="0.5"/>
    </g>

    <!-- HRV -->
    <g id="Metric-HRV">
      <circle cx="40" cy="496" r="5" fill="#34C759"/>
      <text x="56" y="492" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">HRV</text>
      <text x="56" y="508" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#8E8E93">48 ms (expected 42)</text>
      <text x="353" y="500" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#34C759">-1.0 yrs</text>
      <line x1="40" y1="520" x2="353" y2="520" stroke="#E5E5EA" stroke-width="0.5"/>
    </g>

    <!-- BMI (positive = older) -->
    <g id="Metric-BMI">
      <circle cx="40" cy="546" r="5" fill="#FF9500"/>
      <text x="56" y="542" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">BMI</text>
      <text x="56" y="558" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#8E8E93">24.8 (expected 23.5)</text>
      <text x="353" y="550" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FF9500">+0.5 yrs</text>
    </g>
  </g>

  <!-- Historical Chart -->
  <g id="Historical-Chart-Section">
    <text x="20" y="614" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">6-Month Trend</text>
    <rect x="20" y="628" width="353" height="120" rx="16" fill="#FFFFFF"/>

    <!-- Y-axis labels -->
    <text x="35" y="652" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#8E8E93">34</text>
    <text x="35" y="682" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#8E8E93">32</text>
    <text x="35" y="712" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#8E8E93">30</text>

    <!-- Grid lines -->
    <line x1="55" y1="648" x2="353" y2="648" stroke="#E5E5EA" stroke-width="0.5" stroke-dasharray="4 2"/>
    <line x1="55" y1="678" x2="353" y2="678" stroke="#E5E5EA" stroke-width="0.5" stroke-dasharray="4 2"/>
    <line x1="55" y1="708" x2="353" y2="708" stroke="#E5E5EA" stroke-width="0.5" stroke-dasharray="4 2"/>

    <!-- Actual age reference line -->
    <line x1="55" y1="648" x2="353" y2="648" stroke="#FF3B30" stroke-width="1" stroke-dasharray="6 3" opacity="0.5"/>
    <text x="356" y="652" font-family="-apple-system, system-ui, sans-serif" font-size="9" fill="#FF3B30" opacity="0.7">34</text>

    <!-- Trend line -->
    <polyline points="55,700 105,695 155,690 205,685 255,680 305,675 350,670"
      fill="none" stroke="#34C759" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Dots -->
    <circle cx="55" cy="700" r="3" fill="#34C759"/>
    <circle cx="105" cy="695" r="3" fill="#34C759"/>
    <circle cx="155" cy="690" r="3" fill="#34C759"/>
    <circle cx="205" cy="685" r="3" fill="#34C759"/>
    <circle cx="255" cy="680" r="3" fill="#34C759"/>
    <circle cx="305" cy="675" r="3" fill="#34C759"/>
    <circle cx="350" cy="670" r="3" fill="#34C759"/>

    <!-- X-axis labels -->
    <text x="55" y="732" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#8E8E93">Sep</text>
    <text x="105" y="732" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#8E8E93">Oct</text>
    <text x="155" y="732" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#8E8E93">Nov</text>
    <text x="205" y="732" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#8E8E93">Dec</text>
    <text x="255" y="732" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#8E8E93">Jan</text>
    <text x="305" y="732" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#8E8E93">Feb</text>
    <text x="350" y="732" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#8E8E93">Mar</text>
  </g>

  <!-- Improvement Opportunities -->
  <g id="Improvement-Opportunities-Section">
    <text x="20" y="778" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Improvement Opportunities</text>

    <!-- Opportunity Card 1 -->
    <g id="Opportunity-Card-1">
      <rect x="20" y="792" width="168" height="80" rx="16" fill="#FFFFFF"/>
      <circle cx="44" cy="816" r="12" fill="#FF950020"/>
      <text x="44" y="821" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13">&#x2696;&#xFE0F;</text>
      <text x="40" y="848" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1C1E">Lower BMI</text>
      <text x="40" y="862" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93">-0.5 yrs potential</text>
    </g>

    <!-- Opportunity Card 2 -->
    <g id="Opportunity-Card-2">
      <rect x="205" y="792" width="168" height="80" rx="16" fill="#FFFFFF"/>
      <circle cx="229" cy="816" r="12" fill="#007AFF20"/>
      <text x="229" y="821" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13">&#x1F6B6;</text>
      <text x="225" y="848" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1C1E">More Activity</text>
      <text x="225" y="862" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93">-0.3 yrs potential</text>
    </g>
  </g>

  <!-- Home indicator -->
  <rect x="148" y="840" width="97" height="4" rx="2" fill="#1C1C1E"/>
</svg>