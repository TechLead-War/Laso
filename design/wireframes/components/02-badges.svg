<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="#F2F2F7" rx="12"/>

  <!-- Title -->
  <g id="Page-Title">
    <text x="40" y="52" font-size="28" font-weight="700" fill="#1C1C1E">Badges</text>
    <line x1="40" y1="68" x2="760" y2="68" stroke="#E5E5EA" stroke-width="1"/>
  </g>

  <!-- Section: Severity Badges -->
  <g id="Severity-Badges">
    <text x="40" y="110" font-size="16" font-weight="600" fill="#8E8E93">SEVERITY BADGES</text>

    <!-- Critical -->
    <g id="Badge-Critical" transform="translate(40, 130)">
      <rect x="0" y="0" width="80" height="28" rx="14" fill="#FF3B30"/>
      <text x="40" y="18" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Critical</text>
    </g>

    <!-- Warning -->
    <g id="Badge-Warning" transform="translate(140, 130)">
      <rect x="0" y="0" width="80" height="28" rx="14" fill="#FF9500"/>
      <text x="40" y="18" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Warning</text>
    </g>

    <!-- Info -->
    <g id="Badge-Info" transform="translate(240, 130)">
      <rect x="0" y="0" width="80" height="28" rx="14" fill="#007AFF"/>
      <text x="40" y="18" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Info</text>
    </g>

    <!-- Annotation -->
    <g transform="translate(360, 130)">
      <text x="0" y="12" font-size="11" fill="#8E8E93">Height: 28pt</text>
      <text x="0" y="28" font-size="11" fill="#8E8E93">Corner radius: 14pt (fully rounded)</text>
      <text x="0" y="44" font-size="11" fill="#8E8E93">Font: 12pt semibold, white</text>
      <text x="0" y="60" font-size="11" fill="#8E8E93">Padding: 16pt horizontal</text>
    </g>
  </g>

  <!-- Section: Trend Badges -->
  <g id="Trend-Badges">
    <text x="40" y="230" font-size="16" font-weight="600" fill="#8E8E93">TREND BADGES</text>

    <!-- Up -->
    <g id="Badge-Trend-Up" transform="translate(40, 250)">
      <rect x="0" y="0" width="70" height="26" rx="13" fill="#34C75920" stroke="#34C759" stroke-width="1"/>
      <text x="35" y="17" font-size="12" font-weight="600" fill="#34C759" text-anchor="middle">&#8593; Up</text>
    </g>

    <!-- Down -->
    <g id="Badge-Trend-Down" transform="translate(130, 250)">
      <rect x="0" y="0" width="82" height="26" rx="13" fill="#FF3B3020" stroke="#FF3B30" stroke-width="1"/>
      <text x="41" y="17" font-size="12" font-weight="600" fill="#FF3B30" text-anchor="middle">&#8595; Down</text>
    </g>

    <!-- Stable -->
    <g id="Badge-Trend-Stable" transform="translate(232, 250)">
      <rect x="0" y="0" width="86" height="26" rx="13" fill="#8E8E9320" stroke="#8E8E93" stroke-width="1"/>
      <text x="43" y="17" font-size="12" font-weight="600" fill="#8E8E93" text-anchor="middle">&#8594; Stable</text>
    </g>

    <!-- Annotation -->
    <g transform="translate(360, 250)">
      <text x="0" y="12" font-size="11" fill="#8E8E93">Outlined style with tinted background</text>
      <text x="0" y="28" font-size="11" fill="#8E8E93">Arrow prefix indicates direction</text>
    </g>
  </g>

  <!-- Section: Data Confidence -->
  <g id="Data-Confidence-Badges">
    <text x="40" y="340" font-size="16" font-weight="600" fill="#8E8E93">DATA CONFIDENCE</text>

    <!-- High -->
    <g id="Badge-Confidence-High" transform="translate(40, 360)">
      <rect x="0" y="0" width="68" height="26" rx="13" fill="none" stroke="#34C759" stroke-width="1.5"/>
      <circle cx="14" cy="13" r="4" fill="#34C759"/>
      <text x="42" y="17" font-size="11" font-weight="600" fill="#34C759" text-anchor="middle">High</text>
    </g>

    <!-- Medium -->
    <g id="Badge-Confidence-Medium" transform="translate(128, 360)">
      <rect x="0" y="0" width="86" height="26" rx="13" fill="none" stroke="#FFCC00" stroke-width="1.5"/>
      <circle cx="14" cy="13" r="4" fill="#FFCC00"/>
      <text x="50" y="17" font-size="11" font-weight="600" fill="#FFCC00" text-anchor="middle">Medium</text>
    </g>

    <!-- Low -->
    <g id="Badge-Confidence-Low" transform="translate(234, 360)">
      <rect x="0" y="0" width="62" height="26" rx="13" fill="none" stroke="#8E8E93" stroke-width="1.5"/>
      <circle cx="14" cy="13" r="4" fill="#8E8E93"/>
      <text x="38" y="17" font-size="11" font-weight="600" fill="#8E8E93" text-anchor="middle">Low</text>
    </g>

    <!-- Annotation -->
    <g transform="translate(360, 360)">
      <text x="0" y="12" font-size="11" fill="#8E8E93">Outline only, dot indicator + label</text>
      <text x="0" y="28" font-size="11" fill="#8E8E93">1.5pt border, color matches state</text>
    </g>
  </g>

  <!-- Section: Data Source -->
  <g id="Data-Source-Badges">
    <text x="40" y="450" font-size="16" font-weight="600" fill="#8E8E93">DATA SOURCE</text>

    <!-- Apple Watch -->
    <g id="Badge-Source-AppleWatch" transform="translate(40, 470)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <!-- Watch icon -->
      <rect x="12" y="6" width="12" height="16" rx="3" fill="none" stroke="#8E8E93" stroke-width="1.2"/>
      <line x1="15" y1="4" x2="21" y2="4" stroke="#8E8E93" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="15" y1="24" x2="21" y2="24" stroke="#8E8E93" stroke-width="1.2" stroke-linecap="round"/>
      <text x="76" y="18" font-size="12" font-weight="500" fill="#1C1C1E" text-anchor="middle">Apple Watch</text>
    </g>

    <!-- Manual -->
    <g id="Badge-Source-Manual" transform="translate(190, 470)">
      <rect x="0" y="0" width="98" height="28" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <!-- Pencil icon -->
      <line x1="14" y1="18" x2="24" y2="8" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="22" y1="10" x2="24" y2="8" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="20" x2="14" y2="18" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
      <text x="60" y="18" font-size="12" font-weight="500" fill="#1C1C1E" text-anchor="middle">Manual</text>
    </g>

    <!-- Annotation -->
    <g transform="translate(360, 470)">
      <text x="0" y="12" font-size="11" fill="#8E8E93">White card style, icon + label</text>
      <text x="0" y="28" font-size="11" fill="#8E8E93">1pt #E5E5EA border</text>
    </g>
  </g>

  <!-- Section: PRO Badge -->
  <g id="PRO-Badge">
    <text x="40" y="560" font-size="16" font-weight="600" fill="#8E8E93">PRO BADGE</text>

    <!-- PRO pill - standard -->
    <g id="Badge-PRO-Standard" transform="translate(40, 580)">
      <rect x="0" y="0" width="52" height="24" rx="12" fill="#FF9500"/>
      <text x="26" y="16" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PRO</text>
    </g>

    <!-- PRO pill - small inline -->
    <g id="Badge-PRO-Small" transform="translate(112, 580)">
      <rect x="0" y="2" width="40" height="20" rx="10" fill="#FF9500"/>
      <text x="20" y="16" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PRO</text>
    </g>

    <!-- PRO in context -->
    <g id="Badge-PRO-Context" transform="translate(180, 576)">
      <rect x="0" y="0" width="240" height="44" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="16" y="27" font-size="14" font-weight="500" fill="#1C1C1E">Export Health Report</text>
      <rect x="182" y="12" width="42" height="20" rx="10" fill="#FF9500"/>
      <text x="203" y="26" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PRO</text>
    </g>

    <!-- Annotation -->
    <g transform="translate(460, 580)">
      <text x="0" y="12" font-size="11" fill="#8E8E93">Gold accent (#FF9500), white text</text>
      <text x="0" y="28" font-size="11" fill="#8E8E93">Used inline next to gated features</text>
    </g>
  </g>

  <!-- Section: Strength Badges (Correlations) -->
  <g id="Strength-Badges">
    <text x="40" y="680" font-size="16" font-weight="600" fill="#8E8E93">STRENGTH BADGES (CORRELATIONS)</text>

    <!-- Strong -->
    <g id="Badge-Strength-Strong" transform="translate(40, 700)">
      <rect x="0" y="0" width="76" height="26" rx="13" fill="#34C75920" stroke="#34C759" stroke-width="1"/>
      <text x="38" y="17" font-size="11" font-weight="600" fill="#34C759" text-anchor="middle">Strong</text>
    </g>

    <!-- Moderate -->
    <g id="Badge-Strength-Moderate" transform="translate(136, 700)">
      <rect x="0" y="0" width="88" height="26" rx="13" fill="#FF950020" stroke="#FF9500" stroke-width="1"/>
      <text x="44" y="17" font-size="11" font-weight="600" fill="#FF9500" text-anchor="middle">Moderate</text>
    </g>

    <!-- Weak -->
    <g id="Badge-Strength-Weak" transform="translate(244, 700)">
      <rect x="0" y="0" width="66" height="26" rx="13" fill="#8E8E9320" stroke="#8E8E93" stroke-width="1"/>
      <text x="33" y="17" font-size="11" font-weight="600" fill="#8E8E93" text-anchor="middle">Weak</text>
    </g>

    <!-- Annotation -->
    <g transform="translate(360, 700)">
      <text x="0" y="12" font-size="11" fill="#8E8E93">Used in correlation cards</text>
      <text x="0" y="28" font-size="11" fill="#8E8E93">Strong: |r| > 0.7, Moderate: 0.4-0.7, Weak: &lt; 0.4</text>
    </g>
  </g>

  <!-- Section: Category Badges -->
  <g id="Category-Badges">
    <text x="40" y="800" font-size="16" font-weight="600" fill="#8E8E93">CATEGORY BADGES</text>

    <!-- Heart -->
    <g id="Badge-Category-Heart" transform="translate(40, 820)">
      <rect x="0" y="0" width="68" height="26" rx="13" fill="#FF3B3018"/>
      <text x="34" y="17" font-size="11" font-weight="600" fill="#FF3B30" text-anchor="middle">Heart</text>
    </g>

    <!-- Sleep -->
    <g id="Badge-Category-Sleep" transform="translate(120, 820)">
      <rect x="0" y="0" width="64" height="26" rx="13" fill="#007AFF18"/>
      <text x="32" y="17" font-size="11" font-weight="600" fill="#007AFF" text-anchor="middle">Sleep</text>
    </g>

    <!-- Activity -->
    <g id="Badge-Category-Activity" transform="translate(196, 820)">
      <rect x="0" y="0" width="76" height="26" rx="13" fill="#34C75918"/>
      <text x="38" y="17" font-size="11" font-weight="600" fill="#34C759" text-anchor="middle">Activity</text>
    </g>

    <!-- Body -->
    <g id="Badge-Category-Body" transform="translate(284, 820)">
      <rect x="0" y="0" width="60" height="26" rx="13" fill="#FF950018"/>
      <text x="30" y="17" font-size="11" font-weight="600" fill="#FF9500" text-anchor="middle">Body</text>
    </g>

    <!-- Respiratory -->
    <g id="Badge-Category-Respiratory" transform="translate(356, 820)">
      <rect x="0" y="0" width="96" height="26" rx="13" fill="#5856D618"/>
      <text x="48" y="17" font-size="11" font-weight="600" fill="#5856D6" text-anchor="middle">Respiratory</text>
    </g>

    <!-- Mindfulness -->
    <g id="Badge-Category-Mindfulness" transform="translate(464, 820)">
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#AF52DE18"/>
      <text x="50" y="17" font-size="11" font-weight="600" fill="#AF52DE" text-anchor="middle">Mindfulness</text>
    </g>

    <!-- Mobility -->
    <g id="Badge-Category-Mobility" transform="translate(576, 820)">
      <rect x="0" y="0" width="78" height="26" rx="13" fill="#00C7BE18"/>
      <text x="39" y="17" font-size="11" font-weight="600" fill="#00C7BE" text-anchor="middle">Mobility</text>
    </g>
  </g>

  <!-- Section: Spec Summary -->
  <g id="Badge-Specs">
    <text x="40" y="920" font-size="16" font-weight="600" fill="#8E8E93">BADGE SPECIFICATIONS</text>

    <g transform="translate(40, 940)">
      <rect x="0" y="0" width="720" height="220" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>

      <!-- Table header -->
      <text x="20" y="28" font-size="12" font-weight="600" fill="#8E8E93">Type</text>
      <text x="160" y="28" font-size="12" font-weight="600" fill="#8E8E93">Height</text>
      <text x="240" y="28" font-size="12" font-weight="600" fill="#8E8E93">Corner Radius</text>
      <text x="380" y="28" font-size="12" font-weight="600" fill="#8E8E93">Style</text>
      <text x="540" y="28" font-size="12" font-weight="600" fill="#8E8E93">Font</text>
      <line x1="20" y1="38" x2="700" y2="38" stroke="#E5E5EA" stroke-width="0.5"/>

      <!-- Severity -->
      <text x="20" y="60" font-size="12" fill="#1C1C1E">Severity</text>
      <text x="160" y="60" font-size="12" fill="#1C1C1E">28pt</text>
      <text x="240" y="60" font-size="12" fill="#1C1C1E">14pt (pill)</text>
      <text x="380" y="60" font-size="12" fill="#1C1C1E">Solid fill, white text</text>
      <text x="540" y="60" font-size="12" fill="#1C1C1E">12pt SB</text>

      <!-- Trend -->
      <text x="20" y="85" font-size="12" fill="#1C1C1E">Trend</text>
      <text x="160" y="85" font-size="12" fill="#1C1C1E">26pt</text>
      <text x="240" y="85" font-size="12" fill="#1C1C1E">13pt (pill)</text>
      <text x="380" y="85" font-size="12" fill="#1C1C1E">Tint bg + 1pt outline</text>
      <text x="540" y="85" font-size="12" fill="#1C1C1E">12pt SB</text>

      <!-- Confidence -->
      <text x="20" y="110" font-size="12" fill="#1C1C1E">Confidence</text>
      <text x="160" y="110" font-size="12" fill="#1C1C1E">26pt</text>
      <text x="240" y="110" font-size="12" fill="#1C1C1E">13pt (pill)</text>
      <text x="380" y="110" font-size="12" fill="#1C1C1E">Outline + dot indicator</text>
      <text x="540" y="110" font-size="12" fill="#1C1C1E">11pt SB</text>

      <!-- Data Source -->
      <text x="20" y="135" font-size="12" fill="#1C1C1E">Data Source</text>
      <text x="160" y="135" font-size="12" fill="#1C1C1E">28pt</text>
      <text x="240" y="135" font-size="12" fill="#1C1C1E">14pt (pill)</text>
      <text x="380" y="135" font-size="12" fill="#1C1C1E">White card, 1pt border</text>
      <text x="540" y="135" font-size="12" fill="#1C1C1E">12pt Med</text>

      <!-- PRO -->
      <text x="20" y="160" font-size="12" fill="#1C1C1E">PRO</text>
      <text x="160" y="160" font-size="12" fill="#1C1C1E">24pt / 20pt</text>
      <text x="240" y="160" font-size="12" fill="#1C1C1E">12pt / 10pt</text>
      <text x="380" y="160" font-size="12" fill="#1C1C1E">Solid #FF9500, white text</text>
      <text x="540" y="160" font-size="12" fill="#1C1C1E">11pt Bold</text>

      <!-- Strength -->
      <text x="20" y="185" font-size="12" fill="#1C1C1E">Strength</text>
      <text x="160" y="185" font-size="12" fill="#1C1C1E">26pt</text>
      <text x="240" y="185" font-size="12" fill="#1C1C1E">13pt (pill)</text>
      <text x="380" y="185" font-size="12" fill="#1C1C1E">Tint bg + 1pt outline</text>
      <text x="540" y="185" font-size="12" fill="#1C1C1E">11pt SB</text>

      <!-- Category -->
      <text x="20" y="210" font-size="12" fill="#1C1C1E">Category</text>
      <text x="160" y="210" font-size="12" fill="#1C1C1E">26pt</text>
      <text x="240" y="210" font-size="12" fill="#1C1C1E">13pt (pill)</text>
      <text x="380" y="210" font-size="12" fill="#1C1C1E">Light tint fill, no border</text>
      <text x="540" y="210" font-size="12" fill="#1C1C1E">11pt SB</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="400" y="1185" font-size="11" fill="#8E8E93" text-anchor="middle">Laso Design System - Badges - v1.0</text>
</svg>