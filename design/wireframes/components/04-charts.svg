<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="#F2F2F7" rx="12"/>

  <!-- Title -->
  <g id="Page-Title">
    <text x="40" y="52" font-size="28" font-weight="700" fill="#1C1C1E">Charts &amp; Visualizations</text>
    <line x1="40" y1="68" x2="760" y2="68" stroke="#E5E5EA" stroke-width="1"/>
  </g>

  <!-- ==================== MetricChartView ==================== -->
  <g id="MetricChartView">
    <text x="40" y="110" font-size="16" font-weight="600" fill="#8E8E93">METRIC CHART VIEW</text>

    <g id="MetricChart-Card" transform="translate(40, 125)">
      <rect x="0" y="0" width="720" height="260" rx="16" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="0.5"/>

      <!-- Chart title area -->
      <text x="20" y="28" font-size="15" font-weight="600" fill="#1C1C1E">Resting Heart Rate</text>
      <text x="20" y="46" font-size="13" fill="#8E8E93">Last 30 days</text>

      <!-- Current value -->
      <text x="640" y="28" font-size="22" font-weight="700" fill="#1C1C1E" text-anchor="end">62</text>
      <text x="700" y="28" font-size="13" fill="#8E8E93" text-anchor="end">bpm</text>

      <!-- Chart area -->
      <g transform="translate(50, 60)">
        <!-- Y-axis labels -->
        <text x="-8" y="5" font-size="10" fill="#8E8E93" text-anchor="end">75</text>
        <text x="-8" y="45" font-size="10" fill="#8E8E93" text-anchor="end">70</text>
        <text x="-8" y="85" font-size="10" fill="#8E8E93" text-anchor="end">65</text>
        <text x="-8" y="125" font-size="10" fill="#8E8E93" text-anchor="end">60</text>
        <text x="-8" y="165" font-size="10" fill="#8E8E93" text-anchor="end">55</text>

        <!-- Grid lines -->
        <line x1="0" y1="0" x2="640" y2="0" stroke="#E5E5EA" stroke-width="0.5"/>
        <line x1="0" y1="40" x2="640" y2="40" stroke="#E5E5EA" stroke-width="0.5"/>
        <line x1="0" y1="80" x2="640" y2="80" stroke="#E5E5EA" stroke-width="0.5"/>
        <line x1="0" y1="120" x2="640" y2="120" stroke="#E5E5EA" stroke-width="0.5"/>
        <line x1="0" y1="160" x2="640" y2="160" stroke="#E5E5EA" stroke-width="0.5"/>

        <!-- Normal range shaded area -->
        <rect x="0" y="56" width="640" height="48" rx="0" fill="#34C759" opacity="0.08"/>

        <!-- Baseline dotted line -->
        <line x1="0" y1="80" x2="640" y2="80" stroke="#34C759" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
        <text x="645" y="83" font-size="9" fill="#34C759">baseline</text>

        <!-- Data polyline -->
        <polyline
          points="0,90 22,85 44,70 66,65 88,72 110,80 132,95 154,100 176,88 198,75 220,68 242,60 264,55 286,62 308,70 330,78 352,85 374,80 396,72 418,65 440,58 462,55 484,60 506,68 528,72 550,78 572,82 594,76 616,70 640,65"
          fill="none" stroke="#FF3B30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Data points -->
        <circle cx="0" cy="90" r="2.5" fill="#FF3B30"/>
        <circle cx="132" cy="95" r="2.5" fill="#FF3B30"/>
        <circle cx="264" cy="55" r="2.5" fill="#FF3B30"/>
        <circle cx="396" cy="72" r="2.5" fill="#FF3B30"/>
        <circle cx="528" cy="72" r="2.5" fill="#FF3B30"/>
        <circle cx="640" cy="65" r="2.5" fill="#FF3B30"/>

        <!-- X-axis labels -->
        <text x="0" y="180" font-size="10" fill="#8E8E93" text-anchor="start">Feb 7</text>
        <text x="160" y="180" font-size="10" fill="#8E8E93" text-anchor="middle">Feb 14</text>
        <text x="320" y="180" font-size="10" fill="#8E8E93" text-anchor="middle">Feb 21</text>
        <text x="480" y="180" font-size="10" fill="#8E8E93" text-anchor="middle">Feb 28</text>
        <text x="640" y="180" font-size="10" fill="#8E8E93" text-anchor="end">Mar 7</text>
      </g>
    </g>
  </g>

  <!-- ==================== TimeRangeSelector ==================== -->
  <g id="TimeRangeSelector">
    <text x="40" y="420" font-size="16" font-weight="600" fill="#8E8E93">TIME RANGE SELECTOR</text>

    <g id="TimeRange-Control" transform="translate(40, 435)">
      <!-- Background pill -->
      <rect x="0" y="0" width="320" height="36" rx="8" fill="#E5E5EA" opacity="0.5"/>

      <!-- 7d - unselected -->
      <g>
        <rect x="2" y="2" width="78" height="32" rx="7" fill="none"/>
        <text x="41" y="22" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="middle">7d</text>
      </g>

      <!-- 30d - selected -->
      <g>
        <rect x="81" y="2" width="78" height="32" rx="7" fill="#FFFFFF"/>
        <text x="120" y="22" font-size="13" font-weight="600" fill="#1C1C1E" text-anchor="middle">30d</text>
      </g>

      <!-- 90d - unselected -->
      <g>
        <rect x="160" y="2" width="78" height="32" rx="7" fill="none"/>
        <text x="199" y="22" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="middle">90d</text>
      </g>

      <!-- 180d - unselected -->
      <g>
        <rect x="239" y="2" width="79" height="32" rx="7" fill="none"/>
        <text x="278" y="22" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="middle">180d</text>
      </g>
    </g>

    <!-- Annotations -->
    <g transform="translate(400, 438)">
      <text x="0" y="12" font-size="11" fill="#8E8E93">Height: 36pt, corner radius: 8pt</text>
      <text x="0" y="28" font-size="11" fill="#8E8E93">Selected: white fill with subtle shadow</text>
      <text x="0" y="44" font-size="11" fill="#8E8E93">Unselected: #8E8E93 text, no fill</text>
    </g>
  </g>

  <!-- ==================== StatisticsGrid ==================== -->
  <g id="StatisticsGrid">
    <text x="40" y="510" font-size="16" font-weight="600" fill="#8E8E93">STATISTICS GRID</text>

    <g id="Stats-Grid" transform="translate(40, 525)">
      <!-- Row 1 -->
      <!-- Stat box 1 -->
      <rect x="0" y="0" width="170" height="80" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="0.5"/>
      <text x="16" y="24" font-size="12" fill="#8E8E93">Average</text>
      <text x="16" y="50" font-size="22" font-weight="700" fill="#1C1C1E">64</text>
      <text x="52" y="50" font-size="13" fill="#8E8E93">bpm</text>
      <!-- Trend indicator -->
      <text x="140" y="50" font-size="12" font-weight="600" fill="#34C759" text-anchor="end">&#8595; 3%</text>

      <!-- Stat box 2 -->
      <rect x="182" y="0" width="170" height="80" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="0.5"/>
      <text x="198" y="24" font-size="12" fill="#8E8E93">Range</text>
      <text x="198" y="50" font-size="22" font-weight="700" fill="#1C1C1E">55 - 72</text>
      <text x="322" y="50" font-size="13" fill="#8E8E93">bpm</text>

      <!-- Row 2 -->
      <!-- Stat box 3 -->
      <rect x="0" y="92" width="170" height="80" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="0.5"/>
      <text x="16" y="116" font-size="12" fill="#8E8E93">Variability</text>
      <text x="16" y="142" font-size="22" font-weight="700" fill="#1C1C1E">4.2</text>
      <text x="54" y="142" font-size="13" fill="#8E8E93">bpm</text>
      <!-- Trend -->
      <text x="140" y="142" font-size="12" font-weight="600" fill="#FF3B30" text-anchor="end">&#8593; 8%</text>

      <!-- Stat box 4 -->
      <rect x="182" y="92" width="170" height="80" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="0.5"/>
      <text x="198" y="116" font-size="12" fill="#8E8E93">Data Points</text>
      <text x="198" y="142" font-size="22" font-weight="700" fill="#1C1C1E">30</text>
      <text x="236" y="142" font-size="13" fill="#8E8E93">days</text>
    </g>

    <!-- Annotations -->
    <g transform="translate(430, 530)">
      <text x="0" y="12" font-size="11" fill="#8E8E93">Grid: 2 columns, 12pt gap</text>
      <text x="0" y="28" font-size="11" fill="#8E8E93">Card: 16pt padding, 12pt corner radius</text>
      <text x="0" y="44" font-size="11" fill="#8E8E93">Label: 12pt regular #8E8E93</text>
      <text x="0" y="60" font-size="11" fill="#8E8E93">Value: 22pt bold #1C1C1E</text>
      <text x="0" y="76" font-size="11" fill="#8E8E93">Unit: 13pt regular #8E8E93</text>
      <text x="0" y="92" font-size="11" fill="#8E8E93">Trend: 12pt semibold, green (good) / red (bad)</text>
    </g>
  </g>

  <!-- ==================== Activity Rings ==================== -->
  <g id="ActivityRings">
    <text x="40" y="730" font-size="16" font-weight="600" fill="#8E8E93">ACTIVITY RINGS</text>

    <g id="Activity-Rings-Component" transform="translate(140, 810)">
      <!-- Stand ring (outer) -->
      <circle cx="0" cy="0" r="56" fill="none" stroke="#E5E5EA" stroke-width="10" opacity="0.3"/>
      <circle cx="0" cy="0" r="56" fill="none" stroke="#34C759" stroke-width="10"
              stroke-dasharray="351.86" stroke-dashoffset="70.37" stroke-linecap="round"
              transform="rotate(-90)"/>

      <!-- Exercise ring (middle) -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="#E5E5EA" stroke-width="10" opacity="0.3"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#FFCC00" stroke-width="10"
              stroke-dasharray="263.89" stroke-dashoffset="79.17" stroke-linecap="round"
              transform="rotate(-90)"/>

      <!-- Move ring (inner) -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#E5E5EA" stroke-width="10" opacity="0.3"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#FF3B30" stroke-width="10"
              stroke-dasharray="175.93" stroke-dashoffset="26.39" stroke-linecap="round"
              transform="rotate(-90)"/>
    </g>

    <!-- Ring labels -->
    <g transform="translate(230, 770)">
      <circle cx="0" cy="0" r="5" fill="#34C759"/>
      <text x="12" y="4" font-size="12" font-weight="500" fill="#1C1C1E">Stand: 10/12 hrs</text>

      <circle cx="0" cy="24" r="5" fill="#FFCC00"/>
      <text x="12" y="28" font-size="12" font-weight="500" fill="#1C1C1E">Exercise: 22/30 min</text>

      <circle cx="0" cy="48" r="5" fill="#FF3B30"/>
      <text x="12" y="52" font-size="12" font-weight="500" fill="#1C1C1E">Move: 428/500 cal</text>
    </g>

    <!-- ==================== Recovery Gauge ==================== -->
    <g id="RecoveryGauge">
      <text x="440" y="730" font-size="16" font-weight="600" fill="#8E8E93">RECOVERY GAUGE</text>

      <g id="Recovery-Gauge-Component" transform="translate(580, 830)">
        <!-- Background arc -->
        <path d="M -70,0 A 70,70 0 0,1 70,0" fill="none" stroke="#E5E5EA" stroke-width="12" stroke-linecap="round"/>

        <!-- Red zone -->
        <path d="M -70,0 A 70,70 0 0,1 -49.5,-49.5" fill="none" stroke="#FF3B30" stroke-width="12" stroke-linecap="round"/>

        <!-- Orange zone -->
        <path d="M -49.5,-49.5 A 70,70 0 0,1 0,-70" fill="none" stroke="#FF9500" stroke-width="12" stroke-linecap="round"/>

        <!-- Yellow zone -->
        <path d="M 0,-70 A 70,70 0 0,1 49.5,-49.5" fill="none" stroke="#FFCC00" stroke-width="12" stroke-linecap="round"/>

        <!-- Green zone -->
        <path d="M 49.5,-49.5 A 70,70 0 0,1 70,0" fill="none" stroke="#34C759" stroke-width="12" stroke-linecap="round"/>

        <!-- Needle -->
        <line x1="0" y1="0" x2="38" y2="-42" stroke="#1C1C1E" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="5" fill="#1C1C1E"/>

        <!-- Value -->
        <text x="0" y="-16" font-size="28" font-weight="700" fill="#1C1C1E" text-anchor="middle">74</text>
        <text x="0" y="2" font-size="11" fill="#8E8E93" text-anchor="middle">Recovery</text>

        <!-- Min/Max labels -->
        <text x="-76" y="18" font-size="10" fill="#8E8E93" text-anchor="middle">0</text>
        <text x="76" y="18" font-size="10" fill="#8E8E93" text-anchor="middle">100</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="400" y="885" font-size="11" fill="#8E8E93" text-anchor="middle">Laso Design System - Charts &amp; Visualizations - v1.0</text>
</svg>