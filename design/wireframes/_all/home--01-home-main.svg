<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <clipPath id="screen-clip">
      <rect width="393" height="852" rx="44"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g id="Background" clip-path="url(#screen-clip)">
    <rect width="393" height="852" fill="#F2F2F7" rx="44"/>
  </g>

  <!-- Status Bar -->
  <g id="Status-Bar">
    <text x="36" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
    <!-- Signal dots -->
    <circle cx="298" cy="17" r="3" fill="#1C1C1E"/>
    <circle cx="308" cy="17" r="3" fill="#1C1C1E"/>
    <circle cx="318" cy="17" r="3" fill="#1C1C1E"/>
    <circle cx="328" cy="17" r="3" fill="#8E8E93"/>
    <!-- WiFi -->
    <path d="M340 13 Q345 9 350 13" stroke="#1C1C1E" stroke-width="1.5" fill="none"/>
    <path d="M342 16 Q345 13 348 16" stroke="#1C1C1E" stroke-width="1.5" fill="none"/>
    <circle cx="345" cy="18" r="1.2" fill="#1C1C1E"/>
    <!-- Battery -->
    <rect x="355" y="11" width="22" height="12" rx="3" stroke="#1C1C1E" stroke-width="1" fill="none"/>
    <rect x="377" y="15" width="2" height="4" rx="1" fill="#1C1C1E"/>
    <rect x="357" y="13" width="16" height="8" rx="1.5" fill="#34C759"/>
  </g>

  <!-- Top Navigation Bar -->
  <g id="Top-Nav-Bar">
    <text x="20" y="68" font-family="-apple-system, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1C1C1E">Good morning, Alex</text>
    <!-- Journal icon -->
    <g id="Journal-Icon">
      <rect x="320" y="48" width="26" height="26" rx="5" fill="none" stroke="#007AFF" stroke-width="1.5"/>
      <line x1="326" y1="55" x2="340" y2="55" stroke="#007AFF" stroke-width="1.2"/>
      <line x1="326" y1="59" x2="340" y2="59" stroke="#007AFF" stroke-width="1.2"/>
      <line x1="326" y1="63" x2="336" y2="63" stroke="#007AFF" stroke-width="1.2"/>
      <line x1="326" y1="67" x2="332" y2="67" stroke="#007AFF" stroke-width="1.2"/>
    </g>
    <!-- Settings gear icon -->
    <g id="Settings-Icon">
      <circle cx="366" cy="61" r="8" fill="none" stroke="#8E8E93" stroke-width="1.5"/>
      <circle cx="366" cy="61" r="3" fill="none" stroke="#8E8E93" stroke-width="1.5"/>
      <line x1="366" y1="49" x2="366" y2="53" stroke="#8E8E93" stroke-width="1.5"/>
      <line x1="366" y1="69" x2="366" y2="73" stroke="#8E8E93" stroke-width="1.5"/>
      <line x1="354" y1="61" x2="358" y2="61" stroke="#8E8E93" stroke-width="1.5"/>
      <line x1="374" y1="61" x2="378" y2="61" stroke="#8E8E93" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Recovery Hero Card -->
  <g id="Recovery-Hero-Card">
    <rect x="20" y="92" width="353" height="220" rx="16" fill="#FFFFFF"/>
    <text x="40" y="122" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#8E8E93" letter-spacing="0.5">YOUR READINESS SCORE</text>
    <!-- Semi-circle gauge -->
    <g id="Readiness-Gauge" transform="translate(196, 220)">
      <!-- Background arc -->
      <path d="M -90 0 A 90 90 0 0 1 90 0" fill="none" stroke="#E5E5EA" stroke-width="14" stroke-linecap="round"/>
      <!-- Filled arc (78%) -->
      <path d="M -90 0 A 90 90 0 0 1 72.8 -53.3" fill="none" stroke="#34C759" stroke-width="14" stroke-linecap="round"/>
      <!-- Score number -->
      <text x="0" y="-20" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="48" font-weight="700" fill="#1C1C1E">78</text>
      <text x="0" y="2" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#8E8E93">/100</text>
    </g>
    <!-- Status text -->
    <rect x="148" y="252" width="98" height="28" rx="14" fill="#34C75920"/>
    <text x="197" y="271" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#34C759">Ready to Go</text>
    <!-- Info icon -->
    <circle cx="345" cy="118" r="10" fill="none" stroke="#8E8E93" stroke-width="1.2"/>
    <text x="345" y="123" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#8E8E93">i</text>
  </g>

  <!-- Vitality Age Card & Sleep Card (side by side) -->
  <g id="Summary-Cards-Row">
    <!-- Vitality Age Card -->
    <g id="Vitality-Age-Card">
      <rect x="20" y="326" width="168" height="150" rx="16" fill="#FFFFFF"/>
      <text x="40" y="354" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#8E8E93">Vitality Age</text>
      <!-- Ring graphic -->
      <circle cx="70" cy="406" r="30" fill="none" stroke="#E5E5EA" stroke-width="5"/>
      <path d="M 70 376 A 30 30 0 1 1 41.8 421" fill="none" stroke="#34C759" stroke-width="5" stroke-linecap="round"/>
      <text x="70" y="413" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="700" fill="#1C1C1E">31</text>
      <!-- Subtitle -->
      <text x="115" y="398" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="500" fill="#8E8E93">vs actual</text>
      <text x="115" y="414" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="500" fill="#8E8E93">age 34</text>
      <!-- Chevron -->
      <path d="M 168 396 L 175 401 L 168 406" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Sleep Card -->
    <g id="Sleep-Card">
      <rect x="205" y="326" width="168" height="150" rx="16" fill="#FFFFFF"/>
      <!-- Moon icon -->
      <path d="M 225 348 Q 225 338 235 336 Q 228 340 228 348 Q 228 356 235 360 Q 225 358 225 348 Z" fill="#007AFF"/>
      <text x="245" y="354" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#8E8E93">Sleep Duration</text>
      <text x="225" y="408" font-family="-apple-system, system-ui, sans-serif" font-size="32" font-weight="700" fill="#1C1C1E">7h 24m</text>
      <!-- Quality badge -->
      <rect x="225" y="424" width="52" height="24" rx="12" fill="#34C75920"/>
      <text x="251" y="441" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#34C759">Good</text>
    </g>
  </g>

  <!-- Period Summary Section -->
  <g id="Period-Summary-Section">
    <text x="20" y="508" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Last 7 Days</text>
    <rect x="20" y="520" width="353" height="170" rx="16" fill="#FFFFFF"/>

    <!-- Row 1: Steps -->
    <g id="Metric-Row-Steps">
      <text x="40" y="558" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="500" fill="#1C1C1E">Steps</text>
      <text x="310" y="558" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#34C759">+12%</text>
      <text x="353" y="558" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#34C759">&#8593;</text>
      <line x1="40" y1="572" x2="353" y2="572" stroke="#E5E5EA" stroke-width="0.5"/>
    </g>

    <!-- Row 2: Resting HR -->
    <g id="Metric-Row-RestingHR">
      <text x="40" y="606" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="500" fill="#1C1C1E">Resting HR</text>
      <text x="310" y="606" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#34C759">-3 bpm</text>
      <text x="353" y="606" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#34C759">&#8595;</text>
      <line x1="40" y1="620" x2="353" y2="620" stroke="#E5E5EA" stroke-width="0.5"/>
    </g>

    <!-- Row 3: HRV -->
    <g id="Metric-Row-HRV">
      <text x="40" y="654" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="500" fill="#1C1C1E">HRV</text>
      <text x="310" y="654" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#8E8E93">Stable</text>
      <text x="353" y="654" text-anchor="end" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#8E8E93">&#8594;</text>
    </g>
  </g>

  <!-- Bottom Tab Bar -->
  <g id="Tab-Bar">
    <rect x="0" y="778" width="393" height="74" fill="#FFFFFF"/>
    <line x1="0" y1="778" x2="393" y2="778" stroke="#E5E5EA" stroke-width="0.5"/>
    <!-- Home tab (selected) -->
    <g id="Tab-Home-Selected">
      <!-- House icon -->
      <path d="M 66 798 L 78 788 L 90 798 L 90 812 L 82 812 L 82 804 L 74 804 L 74 812 L 66 812 Z" fill="#007AFF"/>
      <text x="78" y="826" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#007AFF">Home</text>
    </g>
    <!-- Live tab -->
    <g id="Tab-Live">
      <!-- Waveform icon -->
      <line x1="187" y1="803" x2="187" y2="795" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
      <line x1="192" y1="807" x2="192" y2="789" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
      <line x1="197" y1="804" x2="197" y2="793" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
      <line x1="202" y1="807" x2="202" y2="786" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
      <line x1="207" y1="803" x2="207" y2="792" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
      <text x="197" y="826" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="500" fill="#8E8E93">Live</text>
    </g>
    <!-- Explore tab -->
    <g id="Tab-Explore">
      <!-- Chart icon -->
      <rect x="304" y="804" width="6" height="10" rx="1.5" fill="#8E8E93"/>
      <rect x="313" y="798" width="6" height="16" rx="1.5" fill="#8E8E93"/>
      <rect x="322" y="790" width="6" height="24" rx="1.5" fill="#8E8E93"/>
      <text x="316" y="826" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="500" fill="#8E8E93">Explore</text>
    </g>
    <!-- Home indicator -->
    <rect x="148" y="840" width="97" height="4" rx="2" fill="#1C1C1E"/>
  </g>
</svg>