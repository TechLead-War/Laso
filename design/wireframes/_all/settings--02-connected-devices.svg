<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="393" height="852" fill="#F2F2F7"/>

  <!-- Status Bar -->
  <g id="StatusBar">
    <text x="36" y="20" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
    <g transform="translate(330,8)">
      <rect x="0" y="2" width="4" height="10" rx="1" fill="#1C1C1E"/>
      <rect x="6" y="4" width="4" height="8" rx="1" fill="#1C1C1E"/>
      <rect x="12" y="6" width="4" height="6" rx="1" fill="#1C1C1E"/>
      <rect x="18" y="8" width="4" height="4" rx="1" fill="#1C1C1E"/>
    </g>
    <g transform="translate(352,6)">
      <rect x="0" y="2" width="22" height="11" rx="2" stroke="#1C1C1E" stroke-width="1" fill="none"/>
      <rect x="22" y="5" width="2" height="5" rx="1" fill="#1C1C1E"/>
      <rect x="2" y="4" width="16" height="7" rx="1" fill="#1C1C1E"/>
    </g>
  </g>

  <!-- Navigation Bar -->
  <g id="NavBar">
    <g id="BackButton" transform="translate(16,38)">
      <path d="M10,0 l-8,8 l8,8" stroke="#007AFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="12" font-size="17" fill="#007AFF">Settings</text>
    </g>
    <text x="197" y="50" font-size="17" font-weight="600" fill="#1C1C1E" text-anchor="middle">Connected Devices</text>
  </g>

  <!-- Scan Status Banner -->
  <g id="ScanStatus">
    <rect x="16" y="68" width="361" height="36" rx="10" fill="#FFFFFF"/>
    <!-- Spinner placeholder -->
    <circle cx="36" cy="86" r="8" fill="none" stroke="#007AFF" stroke-width="2" stroke-dasharray="12 8" stroke-linecap="round"/>
    <text x="52" y="91" font-size="14" fill="#8E8E93">Scanning for devices...</text>
  </g>

  <!-- Section: Active Devices -->
  <g id="Section-ActiveDevices">
    <text x="32" y="130" font-size="13" fill="#8E8E93" letter-spacing="0.5">ACTIVE DEVICES</text>

    <!-- Apple Watch Card -->
    <g id="Card-AppleWatch">
      <rect x="16" y="138" width="361" height="72" rx="16" fill="#FFFFFF"/>
      <!-- Device icon placeholder -->
      <rect x="28" y="150" width="48" height="48" rx="12" fill="#F2F2F7"/>
      <rect x="40" y="158" width="24" height="24" rx="4" fill="#E5E5EA"/>
      <text x="42" y="175" font-size="10" fill="#8E8E93" text-anchor="middle">
        <tspan x="52" dy="0"></tspan>
      </text>
      <!-- Watch icon approximation -->
      <rect x="46" y="162" width="12" height="16" rx="3" stroke="#8E8E93" stroke-width="1.5" fill="none"/>
      <line x1="49" y1="159" x2="55" y2="159" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="49" y1="181" x2="55" y2="181" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>

      <text x="88" y="166" font-size="17" font-weight="500" fill="#1C1C1E">Apple Watch Series 9</text>
      <g transform="translate(88,174)">
        <rect width="76" height="20" rx="10" fill="#34C759" opacity="0.15"/>
        <text x="38" y="14" font-size="12" font-weight="500" fill="#34C759" text-anchor="middle">Connected</text>
      </g>
      <text x="172" y="188" font-size="13" fill="#8E8E93">12 metrics</text>
      <path d="M365,174 l5,5 l-5,5" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Oura Ring Card -->
    <g id="Card-OuraRing">
      <rect x="16" y="218" width="361" height="72" rx="16" fill="#FFFFFF"/>
      <!-- Device icon placeholder -->
      <rect x="28" y="230" width="48" height="48" rx="12" fill="#F2F2F7"/>
      <!-- Ring icon approximation -->
      <circle cx="52" cy="254" r="10" fill="none" stroke="#8E8E93" stroke-width="2.5"/>

      <text x="88" y="246" font-size="17" font-weight="500" fill="#1C1C1E">Oura Ring Gen 3</text>
      <g transform="translate(88,254)">
        <rect width="76" height="20" rx="10" fill="#34C759" opacity="0.15"/>
        <text x="38" y="14" font-size="12" font-weight="500" fill="#34C759" text-anchor="middle">Connected</text>
      </g>
      <text x="172" y="268" font-size="13" fill="#8E8E93">6 metrics</text>
      <path d="M365,254 l5,5 l-5,5" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Section: Inactive Devices -->
  <g id="Section-InactiveDevices">
    <text x="32" y="320" font-size="13" fill="#8E8E93" letter-spacing="0.5">INACTIVE DEVICES</text>

    <g id="Card-WithingsScale">
      <rect x="16" y="328" width="361" height="72" rx="16" fill="#FFFFFF"/>
      <!-- Device icon placeholder -->
      <rect x="28" y="340" width="48" height="48" rx="12" fill="#F2F2F7"/>
      <!-- Scale icon approximation -->
      <rect x="40" y="356" width="24" height="16" rx="3" stroke="#8E8E93" stroke-width="1.5" fill="none"/>
      <line x1="48" y1="360" x2="56" y2="360" stroke="#8E8E93" stroke-width="1" stroke-linecap="round"/>

      <text x="88" y="356" font-size="17" font-weight="500" fill="#1C1C1E">Withings Scale</text>
      <g transform="translate(88,364)">
        <rect width="60" height="20" rx="10" fill="#E5E5EA"/>
        <text x="30" y="14" font-size="12" font-weight="500" fill="#8E8E93" text-anchor="middle">Inactive</text>
      </g>
      <text x="156" y="378" font-size="13" fill="#8E8E93">Last seen: 3 days ago</text>
      <path d="M365,364 l5,5 l-5,5" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Section: Discoverable -->
  <g id="Section-Discoverable">
    <text x="32" y="430" font-size="13" fill="#8E8E93" letter-spacing="0.5">DISCOVERABLE</text>

    <g id="Card-Whoop">
      <rect x="16" y="438" width="361" height="72" rx="16" fill="#FFFFFF"/>
      <!-- Device icon placeholder -->
      <rect x="28" y="450" width="48" height="48" rx="12" fill="#F2F2F7"/>
      <!-- Generic device icon -->
      <circle cx="52" cy="468" r="8" fill="none" stroke="#8E8E93" stroke-width="1.5"/>
      <line x1="52" y1="464" x2="52" y2="472" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="48" y1="468" x2="56" y2="468" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>

      <text x="88" y="470" font-size="17" font-weight="500" fill="#1C1C1E">Whoop 4.0</text>
      <text x="88" y="488" font-size="13" fill="#8E8E93">Fitness band</text>
      <!-- Setup button -->
      <rect x="310" y="458" width="60" height="32" rx="12" fill="#007AFF"/>
      <text x="340" y="479" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Setup</text>
    </g>
  </g>
</svg>