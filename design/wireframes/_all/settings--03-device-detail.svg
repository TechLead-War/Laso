<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="393" height="852" fill="#F2F2F7"/>

  <!-- Status Bar -->
  <g id="StatusBar">
    <text x="36" y="20" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
    <g transform="translate(330,8)">
      <rect x="0" y="2" width="4" height="10" rx="1" fill="#1C1C1E"/>
      <rect x="6" y="4" width="4" height="8" rx="1" fill="#1C1C1E"/>
      <rect x="12" y="6" width="4" height="6" rx="1" fill="#1C1C1E"/>
      <rect x="18" y="8" width="4" height="4" rx="1" fill="#1C1C1E"/>
    </g>
    <g transform="translate(352,6)">
      <rect x="0" y="2" width="22" height="11" rx="2" stroke="#1C1C1E" stroke-width="1" fill="none"/>
      <rect x="22" y="5" width="2" height="5" rx="1" fill="#1C1C1E"/>
      <rect x="2" y="4" width="16" height="7" rx="1" fill="#1C1C1E"/>
    </g>
  </g>

  <!-- Navigation Bar -->
  <g id="NavBar">
    <g id="BackButton" transform="translate(16,38)">
      <path d="M10,0 l-8,8 l8,8" stroke="#007AFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="12" font-size="17" fill="#007AFF">Devices</text>
    </g>
    <text x="197" y="50" font-size="17" font-weight="600" fill="#1C1C1E" text-anchor="middle">Apple Watch Series 9</text>
  </g>

  <!-- Status Section -->
  <g id="Section-Status">
    <rect x="16" y="68" width="361" height="140" rx="16" fill="#FFFFFF"/>
    <!-- Large device icon -->
    <rect x="149" y="82" width="96" height="96" rx="24" fill="#F2F2F7"/>
    <!-- Watch icon -->
    <rect x="175" y="100" width="44" height="56" rx="10" stroke="#C7C7CC" stroke-width="2" fill="none"/>
    <rect x="183" y="108" width="28" height="28" rx="4" fill="#E5E5EA"/>
    <line x1="185" y1="90" x2="209" y2="90" stroke="#C7C7CC" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="185" y1="166" x2="209" y2="166" stroke="#C7C7CC" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Connected badge -->
    <g transform="translate(152,182)">
      <rect width="88" height="24" rx="12" fill="#34C759" opacity="0.15"/>
      <circle cx="14" cy="12" r="4" fill="#34C759"/>
      <text x="50" y="16" font-size="13" font-weight="500" fill="#34C759" text-anchor="middle">Connected</text>
    </g>
  </g>
  <text x="197" y="224" font-size="13" fill="#8E8E93" text-anchor="middle">Last synced: Just now</text>

  <!-- Connected Metrics Section -->
  <g id="Section-Metrics">
    <text x="32" y="256" font-size="13" fill="#8E8E93" letter-spacing="0.5">METRICS</text>
    <rect x="16" y="264" width="361" height="504" rx="16" fill="#FFFFFF"/>

    <!-- Metric rows -->
    <g id="Metric-HeartRate">
      <text x="32" y="292" font-size="15" fill="#34C759">&#10003;</text>
      <text x="52" y="292" font-size="17" fill="#1C1C1E">Heart Rate</text>
      <text x="371" y="292" font-size="15" fill="#8E8E93" text-anchor="end">72 bpm</text>
    </g>
    <line x1="52" y1="302" x2="361" y2="302" stroke="#E5E5EA" stroke-width="0.5"/>

    <g id="Metric-HRV">
      <text x="32" y="328" font-size="15" fill="#34C759">&#10003;</text>
      <text x="52" y="328" font-size="17" fill="#1C1C1E">HRV</text>
      <text x="371" y="328" font-size="15" fill="#8E8E93" text-anchor="end">48 ms</text>
    </g>
    <line x1="52" y1="338" x2="361" y2="338" stroke="#E5E5EA" stroke-width="0.5"/>

    <g id="Metric-BloodOxygen">
      <text x="32" y="364" font-size="15" fill="#34C759">&#10003;</text>
      <text x="52" y="364" font-size="17" fill="#1C1C1E">Blood Oxygen</text>
      <text x="371" y="364" font-size="15" fill="#8E8E93" text-anchor="end">98%</text>
    </g>
    <line x1="52" y1="374" x2="361" y2="374" stroke="#E5E5EA" stroke-width="0.5"/>

    <g id="Metric-Steps">
      <text x="32" y="400" font-size="15" fill="#34C759">&#10003;</text>
      <text x="52" y="400" font-size="17" fill="#1C1C1E">Steps</text>
      <text x="371" y="400" font-size="15" fill="#8E8E93" text-anchor="end">8,432</text>
    </g>
    <line x1="52" y1="410" x2="361" y2="410" stroke="#E5E5EA" stroke-width="0.5"/>

    <g id="Metric-Sleep">
      <text x="32" y="436" font-size="15" fill="#34C759">&#10003;</text>
      <text x="52" y="436" font-size="17" fill="#1C1C1E">Sleep</text>
      <text x="371" y="436" font-size="15" fill="#8E8E93" text-anchor="end">7h 24m</text>
    </g>
    <line x1="52" y1="446" x2="361" y2="446" stroke="#E5E5EA" stroke-width="0.5"/>

    <g id="Metric-Workouts">
      <text x="32" y="472" font-size="15" fill="#34C759">&#10003;</text>
      <text x="52" y="472" font-size="17" fill="#1C1C1E">Workouts</text>
      <text x="371" y="472" font-size="15" fill="#8E8E93" text-anchor="end">1 today</text>
    </g>
    <line x1="52" y1="482" x2="361" y2="482" stroke="#E5E5EA" stroke-width="0.5"/>

    <g id="Metric-RespiratoryRate">
      <text x="32" y="508" font-size="15" fill="#34C759">&#10003;</text>
      <text x="52" y="508" font-size="17" fill="#1C1C1E">Respiratory Rate</text>
      <text x="371" y="508" font-size="15" fill="#8E8E93" text-anchor="end">15 brpm</text>
    </g>
    <line x1="52" y1="518" x2="361" y2="518" stroke="#E5E5EA" stroke-width="0.5"/>

    <g id="Metric-Temperature">
      <text x="32" y="544" font-size="15" fill="#34C759">&#10003;</text>
      <text x="52" y="544" font-size="17" fill="#1C1C1E">Temperature</text>
      <text x="371" y="544" font-size="15" fill="#8E8E93" text-anchor="end">+0.1&#176;</text>
    </g>
    <line x1="52" y1="554" x2="361" y2="554" stroke="#E5E5EA" stroke-width="0.5"/>

    <g id="Metric-StandHours">
      <text x="32" y="580" font-size="15" fill="#34C759">&#10003;</text>
      <text x="52" y="580" font-size="17" fill="#1C1C1E">Stand Hours</text>
      <text x="371" y="580" font-size="15" fill="#8E8E93" text-anchor="end">9 / 12</text>
    </g>
    <line x1="52" y1="590" x2="361" y2="590" stroke="#E5E5EA" stroke-width="0.5"/>

    <g id="Metric-NoiseExposure">
      <text x="32" y="616" font-size="15" fill="#34C759">&#10003;</text>
      <text x="52" y="616" font-size="17" fill="#1C1C1E">Noise Exposure</text>
      <text x="371" y="616" font-size="15" fill="#8E8E93" text-anchor="end">42 dB</text>
    </g>
    <line x1="52" y1="626" x2="361" y2="626" stroke="#E5E5EA" stroke-width="0.5"/>

    <g id="Metric-ECG">
      <text x="32" y="652" font-size="15" fill="#34C759">&#10003;</text>
      <text x="52" y="652" font-size="17" fill="#1C1C1E">ECG</text>
      <text x="371" y="652" font-size="15" fill="#8E8E93" text-anchor="end">Sinus</text>
    </g>
    <line x1="52" y1="662" x2="361" y2="662" stroke="#E5E5EA" stroke-width="0.5"/>

    <g id="Metric-WalkingSteadiness">
      <text x="32" y="688" font-size="15" fill="#34C759">&#10003;</text>
      <text x="52" y="688" font-size="17" fill="#1C1C1E">Walking Steadiness</text>
      <text x="371" y="688" font-size="15" fill="#8E8E93" text-anchor="end">OK</text>
    </g>
  </g>

  <!-- Disconnect Button -->
  <g id="Button-Disconnect">
    <rect x="16" y="790" width="361" height="48" rx="12" fill="#FFFFFF"/>
    <text x="197" y="820" font-size="17" fill="#FF3B30" text-anchor="middle">Disconnect Device</text>
  </g>
</svg>