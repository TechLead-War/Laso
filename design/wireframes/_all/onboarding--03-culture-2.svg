<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <!-- Background -->
  <g id="background">
    <rect width="393" height="852" fill="#F2F2F7"/>
  </g>

  <!-- Status Bar -->
  <g id="status-bar">
    <text x="36" y="22" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
    <g id="signal-bars" transform="translate(312, 10)">
      <rect x="0" y="6" width="3" height="4" rx="0.5" fill="#1C1C1E"/>
      <rect x="5" y="4" width="3" height="6" rx="0.5" fill="#1C1C1E"/>
      <rect x="10" y="2" width="3" height="8" rx="0.5" fill="#1C1C1E"/>
      <rect x="15" y="0" width="3" height="10" rx="0.5" fill="#1C1C1E"/>
    </g>
    <g id="wifi-icon" transform="translate(336, 10)">
      <path d="M5 2 C7.5 0, 10.5 0, 13 2" stroke="#1C1C1E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M7 5 C8.5 3.5, 9.5 3.5, 11 5" stroke="#1C1C1E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="9" cy="8" r="1.5" fill="#1C1C1E"/>
    </g>
    <g id="battery-icon" transform="translate(355, 10)">
      <rect x="0" y="1" width="22" height="10" rx="2" stroke="#1C1C1E" stroke-width="1" fill="none"/>
      <rect x="22" y="4" width="2" height="4" rx="1" fill="#1C1C1E"/>
      <rect x="2" y="3" width="17" height="6" rx="1" fill="#1C1C1E"/>
    </g>
  </g>

  <!-- Illustration Placeholder -->
  <g id="illustration-placeholder" transform="translate(47, 100)">
    <rect width="299" height="300" rx="24" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <!-- Brain icon -->
    <g transform="translate(149.5, 130)">
      <!-- Brain outline - left hemisphere -->
      <path d="M-8,-40 C-30,-40,-40,-20,-38,0 C-36,15,-28,25,-18,32 C-12,36,-8,38,-4,40" stroke="#007AFF" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Brain outline - right hemisphere -->
      <path d="M8,-40 C30,-40,40,-20,38,0 C36,15,28,25,18,32 C12,36,8,38,4,40" stroke="#007AFF" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Center line -->
      <line x1="0" y1="-40" x2="0" y2="40" stroke="#007AFF" stroke-width="2" opacity="0.4"/>
      <!-- Brain folds left -->
      <path d="M-8,-20 C-20,-18,-28,-8,-26,4" stroke="#007AFF" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
      <path d="M-6,-4 C-16,-2,-22,8,-18,16" stroke="#007AFF" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
      <!-- Brain folds right -->
      <path d="M8,-20 C20,-18,28,-8,26,4" stroke="#007AFF" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
      <path d="M6,-4 C16,-2,22,8,18,16" stroke="#007AFF" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
      <!-- Neural sparkles -->
      <circle cx="-20" cy="-28" r="2" fill="#34C759" opacity="0.7"/>
      <circle cx="22" cy="-16" r="2" fill="#34C759" opacity="0.7"/>
      <circle cx="-16" cy="14" r="2" fill="#34C759" opacity="0.7"/>
      <circle cx="18" cy="8" r="2" fill="#34C759" opacity="0.7"/>
    </g>
    <!-- Label -->
    <text x="149.5" y="260" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93" text-anchor="middle">Illustration</text>
  </g>

  <!-- Headline -->
  <g id="headline">
    <text x="196.5" y="458" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1C1C1E" text-anchor="middle">Intelligence that</text>
    <text x="196.5" y="494" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1C1C1E" text-anchor="middle">grows with you</text>
  </g>

  <!-- Body Text -->
  <g id="body-text">
    <text x="196.5" y="536" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="400" fill="#8E8E93" text-anchor="middle">Our on-device ML engine gets smarter</text>
    <text x="196.5" y="560" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="400" fill="#8E8E93" text-anchor="middle">every day, discovering patterns only</text>
    <text x="196.5" y="584" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="400" fill="#8E8E93" text-anchor="middle">your data can reveal.</text>
  </g>

  <!-- Progress Dots (2 of 7 filled) -->
  <g id="progress-dots" transform="translate(148.5, 632)">
    <circle cx="0" cy="0" r="4" fill="#007AFF"/>
    <circle cx="16" cy="0" r="4" fill="#007AFF"/>
    <circle cx="32" cy="0" r="4" fill="#E5E5EA"/>
    <circle cx="48" cy="0" r="4" fill="#E5E5EA"/>
    <circle cx="64" cy="0" r="4" fill="#E5E5EA"/>
    <circle cx="80" cy="0" r="4" fill="#E5E5EA"/>
    <circle cx="96" cy="0" r="4" fill="#E5E5EA"/>
  </g>

  <!-- Continue Button -->
  <g id="continue-button" transform="translate(32, 738)">
    <rect width="329" height="56" rx="14" fill="#007AFF"/>
    <text x="164.5" y="35" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Continue</text>
  </g>

  <!-- Home Indicator -->
  <g id="home-indicator">
    <rect x="128" y="832" width="137" height="5" rx="2.5" fill="#1C1C1E" opacity="0.2"/>
  </g>
</svg>