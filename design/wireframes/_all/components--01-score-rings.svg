<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="#F2F2F7" rx="12"/>

  <!-- Title -->
  <g id="Page-Title">
    <text x="40" y="52" font-size="28" font-weight="700" fill="#1C1C1E">Health Score Ring</text>
    <line x1="40" y1="68" x2="760" y2="68" stroke="#E5E5EA" stroke-width="1"/>
  </g>

  <!-- Section: Size Variants -->
  <g id="Size-Variants">
    <text x="40" y="110" font-size="16" font-weight="600" fill="#8E8E93">SIZE VARIANTS</text>

    <!-- Small Ring 48x48 -->
    <g id="Ring-Small" transform="translate(100, 180)">
      <text x="0" y="-30" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="middle">Small (48x48)</text>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#E5E5EA" stroke-width="4"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#34C759" stroke-width="4"
              stroke-dasharray="125.66" stroke-dashoffset="18.85" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="5" font-size="16" font-weight="700" fill="#1C1C1E" text-anchor="middle">85</text>
    </g>

    <!-- Medium Ring 80x80 -->
    <g id="Ring-Medium" transform="translate(300, 180)">
      <text x="0" y="-58" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="middle">Medium (80x80)</text>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#E5E5EA" stroke-width="6"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#FFCC00" stroke-width="6"
              stroke-dasharray="238.76" stroke-dashoffset="66.85" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="6" font-size="24" font-weight="700" fill="#1C1C1E" text-anchor="middle">72</text>
      <text x="0" y="60" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="middle">Heart</text>
    </g>

    <!-- Large Ring 140x140 -->
    <g id="Ring-Large" transform="translate(550, 180)">
      <text x="0" y="-95" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="middle">Large (140x140)</text>
      <circle cx="0" cy="0" r="66" fill="none" stroke="#E5E5EA" stroke-width="8"/>
      <circle cx="0" cy="0" r="66" fill="none" stroke="#34C759" stroke-width="8"
              stroke-dasharray="414.69" stroke-dashoffset="91.23" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="-4" font-size="40" font-weight="700" fill="#1C1C1E" text-anchor="middle">78</text>
      <text x="0" y="20" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="middle">Health Score</text>
      <!-- Change badge -->
      <g id="Change-Badge" transform="translate(42, -52)">
        <rect x="-16" y="-12" width="40" height="22" rx="11" fill="#34C759"/>
        <text x="4" y="4" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">+4</text>
      </g>
    </g>
  </g>

  <!-- Section: Color States -->
  <g id="Color-States">
    <text x="40" y="360" font-size="16" font-weight="600" fill="#8E8E93">COLOR STATES BY SCORE RANGE</text>

    <!-- Excellent: 80-100 Green -->
    <g id="Ring-Excellent" transform="translate(120, 460)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#E5E5EA" stroke-width="6"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#34C759" stroke-width="6"
              stroke-dasharray="263.89" stroke-dashoffset="26.39" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="6" font-size="26" font-weight="700" fill="#1C1C1E" text-anchor="middle">92</text>
      <text x="0" y="66" font-size="13" font-weight="600" fill="#34C759" text-anchor="middle">Excellent</text>
      <text x="0" y="84" font-size="12" font-weight="400" fill="#8E8E93" text-anchor="middle">80 - 100</text>
    </g>

    <!-- Good: 60-79 Yellow -->
    <g id="Ring-Good" transform="translate(290, 460)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#E5E5EA" stroke-width="6"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#FFCC00" stroke-width="6"
              stroke-dasharray="263.89" stroke-dashoffset="73.89" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="6" font-size="26" font-weight="700" fill="#1C1C1E" text-anchor="middle">72</text>
      <text x="0" y="66" font-size="13" font-weight="600" fill="#FFCC00" text-anchor="middle">Good</text>
      <text x="0" y="84" font-size="12" font-weight="400" fill="#8E8E93" text-anchor="middle">60 - 79</text>
    </g>

    <!-- Fair: 40-59 Orange -->
    <g id="Ring-Fair" transform="translate(460, 460)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#E5E5EA" stroke-width="6"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#FF9500" stroke-width="6"
              stroke-dasharray="263.89" stroke-dashoffset="131.94" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="6" font-size="26" font-weight="700" fill="#1C1C1E" text-anchor="middle">48</text>
      <text x="0" y="66" font-size="13" font-weight="600" fill="#FF9500" text-anchor="middle">Fair</text>
      <text x="0" y="84" font-size="12" font-weight="400" fill="#8E8E93" text-anchor="middle">40 - 59</text>
    </g>

    <!-- Poor: 0-39 Red -->
    <g id="Ring-Poor" transform="translate(630, 460)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#E5E5EA" stroke-width="6"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#FF3B30" stroke-width="6"
              stroke-dasharray="263.89" stroke-dashoffset="171.53" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="6" font-size="26" font-weight="700" fill="#1C1C1E" text-anchor="middle">25</text>
      <text x="0" y="66" font-size="13" font-weight="600" fill="#FF3B30" text-anchor="middle">Poor</text>
      <text x="0" y="84" font-size="12" font-weight="400" fill="#8E8E93" text-anchor="middle">0 - 39</text>
    </g>
  </g>

  <!-- Section: Ring with Category Label Variants -->
  <g id="Category-Ring-Variants">
    <text x="40" y="610" font-size="16" font-weight="600" fill="#8E8E93">CATEGORY RING VARIANTS</text>

    <!-- Heart -->
    <g id="Category-Heart" transform="translate(100, 710)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#E5E5EA" stroke-width="5"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#FF3B30" stroke-width="5"
              stroke-dasharray="213.63" stroke-dashoffset="42.73" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="5" font-size="20" font-weight="700" fill="#1C1C1E" text-anchor="middle">80</text>
      <text x="0" y="54" font-size="12" font-weight="500" fill="#FF3B30" text-anchor="middle">Heart</text>
    </g>

    <!-- Sleep -->
    <g id="Category-Sleep" transform="translate(240, 710)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#E5E5EA" stroke-width="5"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#007AFF" stroke-width="5"
              stroke-dasharray="213.63" stroke-dashoffset="53.41" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="5" font-size="20" font-weight="700" fill="#1C1C1E" text-anchor="middle">75</text>
      <text x="0" y="54" font-size="12" font-weight="500" fill="#007AFF" text-anchor="middle">Sleep</text>
    </g>

    <!-- Activity -->
    <g id="Category-Activity" transform="translate(380, 710)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#E5E5EA" stroke-width="5"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#34C759" stroke-width="5"
              stroke-dasharray="213.63" stroke-dashoffset="23.50" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="5" font-size="20" font-weight="700" fill="#1C1C1E" text-anchor="middle">89</text>
      <text x="0" y="54" font-size="12" font-weight="500" fill="#34C759" text-anchor="middle">Activity</text>
    </g>

    <!-- Body -->
    <g id="Category-Body" transform="translate(520, 710)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#E5E5EA" stroke-width="5"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#FF9500" stroke-width="5"
              stroke-dasharray="213.63" stroke-dashoffset="85.45" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="5" font-size="20" font-weight="700" fill="#1C1C1E" text-anchor="middle">60</text>
      <text x="0" y="54" font-size="12" font-weight="500" fill="#FF9500" text-anchor="middle">Body</text>
    </g>

    <!-- Respiratory -->
    <g id="Category-Respiratory" transform="translate(660, 710)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#E5E5EA" stroke-width="5"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#5856D6" stroke-width="5"
              stroke-dasharray="213.63" stroke-dashoffset="34.18" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="5" font-size="20" font-weight="700" fill="#1C1C1E" text-anchor="middle">84</text>
      <text x="0" y="54" font-size="12" font-weight="500" fill="#5856D6" text-anchor="middle">Respiratory</text>
    </g>
  </g>

  <!-- Section: Ring Anatomy -->
  <g id="Ring-Anatomy">
    <text x="40" y="830" font-size="16" font-weight="600" fill="#8E8E93">ANATOMY / SPECS</text>

    <!-- Large annotated ring -->
    <g transform="translate(200, 970)">
      <circle cx="0" cy="0" r="66" fill="none" stroke="#E5E5EA" stroke-width="8"/>
      <circle cx="0" cy="0" r="66" fill="none" stroke="#34C759" stroke-width="8"
              stroke-dasharray="414.69" stroke-dashoffset="91.23" stroke-linecap="round"
              transform="rotate(-90)"/>
      <text x="0" y="-4" font-size="40" font-weight="700" fill="#1C1C1E" text-anchor="middle">78</text>
      <text x="0" y="20" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="middle">Health Score</text>

      <!-- Annotation lines -->
      <!-- Track stroke -->
      <line x1="68" y1="-30" x2="120" y2="-60" stroke="#8E8E93" stroke-width="0.75" stroke-dasharray="3,2"/>
      <text x="125" y="-57" font-size="11" fill="#8E8E93">Track: #E5E5EA, 8pt stroke</text>

      <!-- Progress stroke -->
      <line x1="10" y1="-72" x2="60" y2="-110" stroke="#8E8E93" stroke-width="0.75" stroke-dasharray="3,2"/>
      <text x="65" y="-107" font-size="11" fill="#8E8E93">Progress: color by score, round cap</text>

      <!-- Score text -->
      <line x1="40" y1="0" x2="120" y2="20" stroke="#8E8E93" stroke-width="0.75" stroke-dasharray="3,2"/>
      <text x="125" y="17" font-size="11" fill="#8E8E93">Score: SF Pro Bold, centered</text>

      <!-- Label text -->
      <line x1="40" y1="20" x2="120" y2="55" stroke="#8E8E93" stroke-width="0.75" stroke-dasharray="3,2"/>
      <text x="125" y="52" font-size="11" fill="#8E8E93">Label: SF Pro Medium, #8E8E93</text>
    </g>

    <!-- Specs table -->
    <g transform="translate(440, 870)">
      <rect x="0" y="0" width="320" height="200" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="16" y="28" font-size="13" font-weight="600" fill="#1C1C1E">Specifications</text>
      <line x1="16" y1="38" x2="304" y2="38" stroke="#E5E5EA" stroke-width="0.5"/>

      <text x="16" y="60" font-size="11" fill="#8E8E93">Size</text>
      <text x="160" y="60" font-size="11" fill="#8E8E93">Radius</text>
      <text x="240" y="60" font-size="11" fill="#8E8E93">Stroke</text>

      <text x="16" y="82" font-size="12" fill="#1C1C1E">Small (48pt)</text>
      <text x="160" y="82" font-size="12" fill="#1C1C1E">22pt</text>
      <text x="240" y="82" font-size="12" fill="#1C1C1E">4pt</text>

      <text x="16" y="104" font-size="12" fill="#1C1C1E">Medium (80pt)</text>
      <text x="160" y="104" font-size="12" fill="#1C1C1E">38pt</text>
      <text x="240" y="104" font-size="12" fill="#1C1C1E">6pt</text>

      <text x="16" y="126" font-size="12" fill="#1C1C1E">Large (140pt)</text>
      <text x="160" y="126" font-size="12" fill="#1C1C1E">66pt</text>
      <text x="240" y="126" font-size="12" fill="#1C1C1E">8pt</text>

      <line x1="16" y1="140" x2="304" y2="140" stroke="#E5E5EA" stroke-width="0.5"/>

      <text x="16" y="162" font-size="11" font-weight="500" fill="#1C1C1E">Progress = (score/100) * circumference</text>
      <text x="16" y="182" font-size="11" font-weight="500" fill="#1C1C1E">Rotation: -90deg (start at 12 o'clock)</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="400" y="1175" font-size="11" fill="#8E8E93" text-anchor="middle">HealthPulse Design System - Score Rings - v1.0</text>
</svg>