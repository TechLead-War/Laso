<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, sans-serif; }
    </style>
    <linearGradient id="shareGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#34C759" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="shareGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5856D6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#F2F2F7" rx="12"/>

  <!-- Title -->
  <g id="Page-Title">
    <text x="40" y="52" font-size="28" font-weight="700" fill="#1C1C1E">Shareable Cards</text>
    <line x1="40" y1="68" x2="760" y2="68" stroke="#E5E5EA" stroke-width="1"/>
  </g>

  <!-- ==================== ShareableScoreCard ==================== -->
  <g id="ShareableScoreCard">
    <text x="40" y="110" font-size="16" font-weight="600" fill="#8E8E93">SHAREABLE SCORE CARD</text>

    <g id="ScoreCard-Component" transform="translate(40, 125)">
      <!-- Card with gradient background -->
      <rect x="0" y="0" width="300" height="380" rx="20" fill="url(#shareGrad1)" stroke="#E5E5EA" stroke-width="0.5"/>
      <rect x="0" y="0" width="300" height="380" rx="20" fill="#FFFFFF" opacity="0.85"/>

      <!-- App branding -->
      <g transform="translate(20, 24)">
        <!-- App icon placeholder -->
        <rect x="0" y="0" width="28" height="28" rx="7" fill="#007AFF"/>
        <text x="14" y="19" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">H</text>
        <text x="36" y="14" font-size="13" font-weight="600" fill="#1C1C1E">Laso</text>
        <text x="36" y="28" font-size="10" fill="#8E8E93">Weekly Health Summary</text>
      </g>

      <!-- Date -->
      <text x="260" y="42" font-size="11" fill="#8E8E93" text-anchor="end">Mar 1 - 7, 2026</text>

      <!-- Divider -->
      <line x1="20" y1="66" x2="280" y2="66" stroke="#E5E5EA" stroke-width="0.5"/>

      <!-- Score ring - centered -->
      <g transform="translate(150, 140)">
        <circle cx="0" cy="0" r="52" fill="none" stroke="#E5E5EA" stroke-width="7"/>
        <circle cx="0" cy="0" r="52" fill="none" stroke="#34C759" stroke-width="7"
                stroke-dasharray="326.73" stroke-dashoffset="65.35" stroke-linecap="round"
                transform="rotate(-90)"/>
        <text x="0" y="-2" font-size="36" font-weight="700" fill="#1C1C1E" text-anchor="middle">80</text>
        <text x="0" y="18" font-size="11" fill="#8E8E93" text-anchor="middle">Health Score</text>
      </g>

      <!-- Change badge -->
      <g transform="translate(128, 200)">
        <rect x="0" y="0" width="44" height="22" rx="11" fill="#34C759"/>
        <text x="22" y="15" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">+6</text>
      </g>

      <!-- Key stats row -->
      <g transform="translate(20, 240)">
        <!-- Stat 1 -->
        <g>
          <text x="43" y="0" font-size="10" fill="#8E8E93" text-anchor="middle">Avg Steps</text>
          <text x="43" y="20" font-size="18" font-weight="700" fill="#1C1C1E" text-anchor="middle">8,420</text>
        </g>

        <!-- Stat 2 -->
        <g transform="translate(100, 0)">
          <text x="43" y="0" font-size="10" fill="#8E8E93" text-anchor="middle">Avg Sleep</text>
          <text x="43" y="20" font-size="18" font-weight="700" fill="#1C1C1E" text-anchor="middle">7h 24m</text>
        </g>

        <!-- Stat 3 -->
        <g transform="translate(200, 0)">
          <text x="30" y="0" font-size="10" fill="#8E8E93" text-anchor="middle">Avg HRV</text>
          <text x="30" y="20" font-size="18" font-weight="700" fill="#1C1C1E" text-anchor="middle">48ms</text>
        </g>
      </g>

      <!-- Mini category scores -->
      <g transform="translate(20, 280)">
        <line x1="0" y1="0" x2="260" y2="0" stroke="#E5E5EA" stroke-width="0.5"/>

        <g transform="translate(0, 16)">
          <circle cx="8" cy="0" r="4" fill="#FF3B30"/>
          <text x="18" y="4" font-size="11" fill="#1C1C1E">Heart</text>
          <text x="70" y="4" font-size="11" font-weight="600" fill="#1C1C1E">82</text>
        </g>

        <g transform="translate(95, 16)">
          <circle cx="8" cy="0" r="4" fill="#007AFF"/>
          <text x="18" y="4" font-size="11" fill="#1C1C1E">Sleep</text>
          <text x="65" y="4" font-size="11" font-weight="600" fill="#1C1C1E">78</text>
        </g>

        <g transform="translate(185, 16)">
          <circle cx="8" cy="0" r="4" fill="#34C759"/>
          <text x="18" y="4" font-size="11" fill="#1C1C1E">Activity</text>
          <text x="75" y="4" font-size="11" font-weight="600" fill="#1C1C1E">85</text>
        </g>

        <g transform="translate(0, 38)">
          <circle cx="8" cy="0" r="4" fill="#FF9500"/>
          <text x="18" y="4" font-size="11" fill="#1C1C1E">Body</text>
          <text x="70" y="4" font-size="11" font-weight="600" fill="#1C1C1E">74</text>
        </g>

        <g transform="translate(95, 38)">
          <circle cx="8" cy="0" r="4" fill="#5856D6"/>
          <text x="18" y="4" font-size="11" fill="#1C1C1E">Resp.</text>
          <text x="65" y="4" font-size="11" font-weight="600" fill="#1C1C1E">81</text>
        </g>

        <g transform="translate(185, 38)">
          <circle cx="8" cy="0" r="4" fill="#AF52DE"/>
          <text x="18" y="4" font-size="11" fill="#1C1C1E">Mind.</text>
          <text x="75" y="4" font-size="11" font-weight="600" fill="#1C1C1E">79</text>
        </g>
      </g>

      <!-- Footer branding -->
      <text x="150" y="365" font-size="9" fill="#8E8E93" text-anchor="middle" opacity="0.6">Tracked with Laso for iOS</text>
    </g>
  </g>

  <!-- ==================== ShareableInsightCard ==================== -->
  <g id="ShareableInsightCard">
    <text x="400" y="110" font-size="16" font-weight="600" fill="#8E8E93">SHAREABLE INSIGHT CARD</text>

    <g id="InsightCard-Share-Component" transform="translate(400, 125)">
      <!-- Card with gradient -->
      <rect x="0" y="0" width="360" height="260" rx="20" fill="url(#shareGrad2)" stroke="#E5E5EA" stroke-width="0.5"/>
      <rect x="0" y="0" width="360" height="260" rx="20" fill="#FFFFFF" opacity="0.88"/>

      <!-- App branding -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="24" height="24" rx="6" fill="#007AFF"/>
        <text x="12" y="17" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">H</text>
        <text x="32" y="16" font-size="12" font-weight="600" fill="#1C1C1E">Laso Insight</text>
      </g>

      <!-- Date -->
      <text x="340" y="36" font-size="10" fill="#8E8E93" text-anchor="end">March 8, 2026</text>

      <!-- Divider -->
      <line x1="20" y1="52" x2="340" y2="52" stroke="#E5E5EA" stroke-width="0.5"/>

      <!-- Insight icon + severity -->
      <g transform="translate(20, 68)">
        <circle cx="16" cy="16" r="16" fill="#FF950020"/>
        <text x="16" y="22" font-size="16" text-anchor="middle" fill="#FF9500">!</text>

        <rect x="42" y="4" width="66" height="24" rx="12" fill="#FF9500"/>
        <text x="75" y="20" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Warning</text>
      </g>

      <!-- Insight text -->
      <text x="20" y="120" font-size="17" font-weight="600" fill="#1C1C1E">Sleep Duration Declining</text>
      <text x="20" y="142" font-size="13" fill="#8E8E93">Your average sleep has dropped from</text>
      <text x="20" y="158" font-size="13" fill="#8E8E93">7h 45m to 6h 30m over the past 2 weeks.</text>

      <!-- Mini visualization placeholder -->
      <g transform="translate(20, 175)">
        <rect x="0" y="0" width="320" height="48" rx="8" fill="#F2F2F7"/>
        <!-- Simplified trend line -->
        <polyline points="16,12 48,14 80,16 112,20 144,18 176,22 208,26 240,30 272,34 304,36"
                  fill="none" stroke="#FF9500" stroke-width="2" stroke-linecap="round"/>
        <text x="16" y="42" font-size="9" fill="#8E8E93">2 weeks ago</text>
        <text x="304" y="42" font-size="9" fill="#8E8E93" text-anchor="end">Today</text>
      </g>

      <!-- Footer branding -->
      <text x="180" y="248" font-size="9" fill="#8E8E93" text-anchor="middle" opacity="0.6">Tracked with Laso for iOS</text>
    </g>
  </g>

  <!-- ==================== Share Button ==================== -->
  <g id="ShareButton">
    <text x="400" y="420" font-size="16" font-weight="600" fill="#8E8E93">SHARE BUTTON + FLOW</text>

    <!-- Share button component -->
    <g id="Share-Button-Component" transform="translate(400, 440)">
      <!-- Button -->
      <rect x="0" y="0" width="180" height="50" rx="12" fill="#007AFF"/>

      <!-- Share icon -->
      <g transform="translate(50, 12)">
        <rect x="4" y="12" width="16" height="14" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
        <line x1="12" y1="4" x2="12" y2="18" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
        <polyline points="8,8 12,4 16,8" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="108" y="30" font-size="17" font-weight="600" fill="#FFFFFF">Share</text>
    </g>

    <!-- Flow arrow -->
    <g transform="translate(600, 458)">
      <line x1="0" y1="8" x2="30" y2="8" stroke="#8E8E93" stroke-width="1" stroke-dasharray="3,2"/>
      <polygon points="30,4 38,8 30,12" fill="#8E8E93"/>
    </g>

    <!-- iOS Share Sheet mock -->
    <g id="ShareSheet-Mock" transform="translate(648, 430)">
      <rect x="0" y="0" width="112" height="90" rx="12" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>

      <!-- Handle -->
      <rect x="42" y="6" width="28" height="3" rx="1.5" fill="#E5E5EA"/>

      <!-- Share row icons -->
      <g transform="translate(12, 18)">
        <!-- Messages -->
        <rect x="0" y="0" width="24" height="24" rx="6" fill="#34C759"/>
        <text x="12" y="16" font-size="8" fill="#FFFFFF" text-anchor="middle">M</text>
        <text x="12" y="34" font-size="7" fill="#8E8E93" text-anchor="middle">Messages</text>

        <!-- Mail -->
        <rect x="32" y="0" width="24" height="24" rx="6" fill="#007AFF"/>
        <text x="44" y="16" font-size="8" fill="#FFFFFF" text-anchor="middle">@</text>
        <text x="44" y="34" font-size="7" fill="#8E8E93" text-anchor="middle">Mail</text>

        <!-- More -->
        <rect x="64" y="0" width="24" height="24" rx="6" fill="#E5E5EA"/>
        <text x="76" y="18" font-size="12" fill="#8E8E93" text-anchor="middle">...</text>
        <text x="76" y="34" font-size="7" fill="#8E8E93" text-anchor="middle">More</text>
      </g>

      <!-- Copy / Save actions -->
      <g transform="translate(12, 62)">
        <rect x="0" y="0" width="88" height="20" rx="5" fill="#F2F2F7"/>
        <text x="44" y="14" font-size="9" fill="#1C1C1E" text-anchor="middle">Copy Image  |  Save</text>
      </g>
    </g>
  </g>

  <!-- ==================== Specs ==================== -->
  <g id="ShareCard-Specs">
    <text x="40" y="540" font-size="16" font-weight="600" fill="#8E8E93">CARD SPECIFICATIONS</text>

    <g transform="translate(40, 555)">
      <text x="0" y="0" font-size="11" fill="#8E8E93">Score Card: 300x380pt  |  Insight Card: 360x260pt  |  Corner radius: 20pt  |  Rendered as UIImage for sharing</text>
      <text x="0" y="18" font-size="11" fill="#8E8E93">Gradient background (subtle, semi-transparent overlay)  |  Always includes app branding + date  |  File protection + auto-cleanup after share</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="400" y="590" font-size="11" fill="#8E8E93" text-anchor="middle">Laso Design System - Shareable Cards - v1.0</text>
</svg>