<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="393" height="852" fill="#F2F2F7"/>

  <!-- Status Bar -->
  <g id="StatusBar">
    <text x="36" y="22" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
    <g transform="translate(312, 10)">
      <rect x="0" y="6" width="3" height="4" rx="1" fill="#1C1C1E"/>
      <rect x="5" y="4" width="3" height="6" rx="1" fill="#1C1C1E"/>
      <rect x="10" y="2" width="3" height="8" rx="1" fill="#1C1C1E"/>
      <rect x="15" y="0" width="3" height="10" rx="1" fill="#1C1C1E"/>
    </g>
    <g transform="translate(338, 10)">
      <path d="M4 8 L8 8 L6 4 Z" fill="#1C1C1E"/>
      <circle cx="6" cy="9" r="1" fill="#1C1C1E"/>
    </g>
    <g transform="translate(354, 10)">
      <rect x="0" y="1" width="22" height="10" rx="2" stroke="#1C1C1E" stroke-width="1" fill="none"/>
      <rect x="22" y="4" width="2" height="4" rx="1" fill="#1C1C1E"/>
      <rect x="2" y="3" width="18" height="6" rx="1" fill="#34C759"/>
    </g>
  </g>

  <!-- Navigation Title -->
  <g id="NavTitle">
    <text x="20" y="68" font-size="34" font-weight="700" fill="#1C1C1E">Explore</text>
  </g>

  <!-- Time Range Selector Pills -->
  <g id="TimeRangeSelector" transform="translate(20, 82)">
    <!-- 30d (selected) -->
    <rect x="0" y="0" width="56" height="32" rx="16" fill="#007AFF"/>
    <text x="28" y="21" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">30d</text>
    <!-- 90d -->
    <rect x="64" y="0" width="56" height="32" rx="16" fill="#E5E5EA"/>
    <text x="92" y="21" font-size="14" font-weight="500" fill="#8E8E93" text-anchor="middle">90d</text>
    <!-- 180d -->
    <rect x="128" y="0" width="56" height="32" rx="16" fill="#E5E5EA"/>
    <text x="156" y="21" font-size="14" font-weight="500" fill="#8E8E93" text-anchor="middle">180d</text>
  </g>

  <!-- Score Hero Card -->
  <g id="ScoreHero">
    <rect x="20" y="126" width="353" height="180" rx="16" fill="#FFFFFF"/>
    <text x="40" y="156" font-size="13" font-weight="600" fill="#8E8E93">HEALTH SCORE</text>

    <!-- Score Ring -->
    <g transform="translate(196, 230)">
      <!-- Track -->
      <circle cx="0" cy="0" r="52" fill="none" stroke="#E5E5EA" stroke-width="10"/>
      <!-- Progress (78/100) -->
      <circle cx="0" cy="0" r="52" fill="none" stroke="#007AFF" stroke-width="10" stroke-dasharray="256" stroke-dashoffset="56" stroke-linecap="round" transform="rotate(-90)"/>
      <!-- Score Number -->
      <text x="0" y="10" font-size="36" font-weight="700" fill="#1C1C1E" text-anchor="middle">78</text>
    </g>

    <!-- Change from last week -->
    <g transform="translate(300, 150)">
      <text x="0" y="0" font-size="14" font-weight="600" fill="#34C759">+4</text>
      <text x="0" y="18" font-size="12" fill="#8E8E93">from last week</text>
    </g>
  </g>

  <!-- Data Summary Bar -->
  <g id="DataSummaryBar">
    <rect x="20" y="318" width="353" height="52" rx="16" fill="#FFFFFF"/>
    <g transform="translate(0, 350)">
      <!-- Days tracked -->
      <text x="55" y="0" font-size="15" font-weight="700" fill="#007AFF" text-anchor="middle">142</text>
      <text x="55" y="16" font-size="11" fill="#8E8E93" text-anchor="middle">days tracked</text>
      <!-- Divider -->
      <line x1="130" y1="-14" x2="130" y2="18" stroke="#E5E5EA" stroke-width="1"/>
      <!-- Metrics -->
      <text x="196" y="0" font-size="15" font-weight="700" fill="#007AFF" text-anchor="middle">12</text>
      <text x="196" y="16" font-size="11" fill="#8E8E93" text-anchor="middle">metrics</text>
      <!-- Divider -->
      <line x1="263" y1="-14" x2="263" y2="18" stroke="#E5E5EA" stroke-width="1"/>
      <!-- Data points -->
      <text x="338" y="0" font-size="15" font-weight="700" fill="#007AFF" text-anchor="middle">847</text>
      <text x="338" y="16" font-size="11" fill="#8E8E93" text-anchor="middle">data points</text>
    </g>
  </g>

  <!-- Trends Section -->
  <g id="TrendsSection">
    <text x="20" y="404" font-size="20" font-weight="700" fill="#1C1C1E">Trends</text>

    <!-- Trend Card 1: HRV -->
    <g id="TrendHRV">
      <rect x="20" y="416" width="353" height="56" rx="16" fill="#FFFFFF"/>
      <text x="48" y="450" font-size="16" font-weight="500" fill="#1C1C1E">HRV</text>
      <g transform="translate(310, 436)">
        <text x="0" y="0" font-size="15" font-weight="600" fill="#34C759">&#8593; 8%</text>
      </g>
      <!-- Up arrow icon -->
      <rect x="352" y="434" width="8" height="14" rx="2" fill="#34C759" opacity="0.15"/>
    </g>

    <!-- Trend Card 2: Resting HR -->
    <g id="TrendRestingHR">
      <rect x="20" y="480" width="353" height="56" rx="16" fill="#FFFFFF"/>
      <text x="48" y="514" font-size="16" font-weight="500" fill="#1C1C1E">Resting HR</text>
      <g transform="translate(310, 500)">
        <text x="0" y="0" font-size="15" font-weight="600" fill="#34C759">&#8595; 3%</text>
      </g>
    </g>

    <!-- Trend Card 3: Steps -->
    <g id="TrendSteps">
      <rect x="20" y="544" width="353" height="56" rx="16" fill="#FFFFFF"/>
      <text x="48" y="578" font-size="16" font-weight="500" fill="#1C1C1E">Steps</text>
      <g transform="translate(300, 564)">
        <text x="0" y="0" font-size="15" font-weight="600" fill="#8E8E93">&#8594; stable</text>
      </g>
    </g>
  </g>

  <!-- Needs Attention / Declining Section -->
  <g id="DecliningSection">
    <text x="20" y="634" font-size="20" font-weight="700" fill="#1C1C1E">Declining</text>

    <!-- Declining Card 1 -->
    <g id="DecliningCard1">
      <rect x="20" y="646" width="170" height="80" rx="16" fill="#FFFFFF"/>
      <!-- Red indicator dot -->
      <circle cx="40" cy="670" r="5" fill="#FF3B30"/>
      <text x="52" y="674" font-size="14" font-weight="600" fill="#1C1C1E">Sleep Duration</text>
      <text x="40" y="704" font-size="20" font-weight="700" fill="#FF3B30">&#8595; 12%</text>
    </g>

    <!-- Declining Card 2 -->
    <g id="DecliningCard2">
      <rect x="203" y="646" width="170" height="80" rx="16" fill="#FFFFFF"/>
      <!-- Orange indicator dot -->
      <circle cx="223" cy="670" r="5" fill="#FF9500"/>
      <text x="235" y="674" font-size="14" font-weight="600" fill="#1C1C1E">VO2 Max</text>
      <text x="223" y="704" font-size="20" font-weight="700" fill="#FF9500">&#8595; 5%</text>
    </g>
  </g>

  <!-- Tab Bar -->
  <g id="TabBar">
    <rect x="0" y="782" width="393" height="70" fill="#FFFFFF"/>
    <line x1="0" y1="782" x2="393" y2="782" stroke="#E5E5EA" stroke-width="0.5"/>
    <!-- Home Tab -->
    <g id="TabHome" transform="translate(65, 796)">
      <path d="M0 12 L8 4 L16 12 L16 20 L10 20 L10 14 L6 14 L6 20 L0 20 Z" fill="none" stroke="#8E8E93" stroke-width="1.5"/>
      <text x="8" y="34" font-size="10" fill="#8E8E93" text-anchor="middle">Home</text>
    </g>
    <!-- Live Tab -->
    <g id="TabLive" transform="translate(188, 796)">
      <polyline points="0,12 4,6 6,14 8,4 10,16 12,8 16,12" fill="none" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="8" y="34" font-size="10" fill="#8E8E93" text-anchor="middle">Live</text>
    </g>
    <!-- Explore Tab (Active) -->
    <g id="TabExplore" transform="translate(311, 796)">
      <rect x="0" y="10" width="4" height="10" rx="1" fill="#007AFF"/>
      <rect x="6" y="6" width="4" height="14" rx="1" fill="#007AFF"/>
      <rect x="12" y="2" width="4" height="18" rx="1" fill="#007AFF"/>
      <text x="8" y="34" font-size="10" fill="#007AFF" font-weight="600" text-anchor="middle">Explore</text>
    </g>
    <rect x="140" y="838" width="113" height="5" rx="2.5" fill="#1C1C1E"/>
  </g>
</svg>