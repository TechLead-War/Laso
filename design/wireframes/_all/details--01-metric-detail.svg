<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <clipPath id="screenClip"><rect width="393" height="852" rx="44"/></clipPath>
  </defs>

  <!-- Background -->
  <g id="MetricDetailView" clip-path="url(#screenClip)">
    <rect width="393" height="852" fill="#F2F2F7" rx="44"/>

    <!-- Status Bar -->
    <g id="StatusBar">
      <text x="36" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
      <g transform="translate(330,10)">
        <rect x="0" y="2" width="18" height="10" rx="2" stroke="#1C1C1E" stroke-width="1.2" fill="none"/>
        <rect x="19" y="5" width="1.5" height="4" rx="0.75" fill="#1C1C1E"/>
        <rect x="2" y="4" width="13" height="6" rx="1" fill="#1C1C1E"/>
      </g>
      <g transform="translate(296,8)">
        <path d="M0 10 Q4 0 8 10 Q12 0 16 10 Q20 0 24 10" stroke="#1C1C1E" stroke-width="1.5" fill="none"/>
      </g>
      <g transform="translate(268,8)">
        <rect x="0" y="8" width="4" height="4" rx="1" fill="#1C1C1E"/>
        <rect x="6" y="5" width="4" height="7" rx="1" fill="#1C1C1E"/>
        <rect x="12" y="2" width="4" height="10" rx="1" fill="#1C1C1E"/>
        <rect x="18" y="0" width="4" height="12" rx="1" fill="#1C1C1E"/>
      </g>
    </g>

    <!-- Navigation Bar -->
    <g id="NavBar">
      <g id="BackButton" transform="translate(16, 48)">
        <path d="M10 2 L2 12 L10 22" stroke="#007AFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="16" font-family="-apple-system, system-ui, sans-serif" font-size="17" fill="#007AFF">Back</text>
      </g>
      <text x="197" y="64" font-family="-apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#1C1C1E" text-anchor="middle">Heart Rate</text>
      <g id="ShareButton" transform="translate(349, 50)">
        <rect x="0" y="6" width="16" height="12" rx="2" stroke="#007AFF" stroke-width="1.5" fill="none"/>
        <path d="M8 2 L8 14 M4 6 L8 2 L12 6" stroke="#007AFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Time Range Pills -->
    <g id="TimeRangePills" transform="translate(16, 86)">
      <rect x="0" y="0" width="80" height="34" rx="17" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="40" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#8E8E93" text-anchor="middle">7d</text>
      <rect x="90" y="0" width="80" height="34" rx="17" fill="#007AFF"/>
      <text x="130" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">30d</text>
      <rect x="180" y="0" width="80" height="34" rx="17" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="220" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#8E8E93" text-anchor="middle">90d</text>
      <rect x="270" y="0" width="80" height="34" rx="17" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="310" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#8E8E93" text-anchor="middle">180d</text>
    </g>

    <!-- Chart Card -->
    <g id="ChartCard" transform="translate(16, 132)">
      <rect width="361" height="220" rx="16" fill="#FFFFFF"/>
      <!-- Y-Axis Labels -->
      <text x="20" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93">140</text>
      <text x="20" y="76" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93">110</text>
      <text x="20" y="116" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93">80</text>
      <text x="20" y="156" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93">50</text>
      <!-- Grid lines -->
      <line x1="50" y1="32" x2="340" y2="32" stroke="#E5E5EA" stroke-width="0.5"/>
      <line x1="50" y1="72" x2="340" y2="72" stroke="#E5E5EA" stroke-width="0.5"/>
      <line x1="50" y1="112" x2="340" y2="112" stroke="#E5E5EA" stroke-width="0.5"/>
      <line x1="50" y1="152" x2="340" y2="152" stroke="#E5E5EA" stroke-width="0.5"/>
      <!-- Normal Range Shading -->
      <rect x="50" y="82" width="290" height="50" rx="0" fill="#34C759" opacity="0.08"/>
      <!-- Baseline Dotted Line -->
      <line x1="50" y1="108" x2="340" y2="108" stroke="#34C759" stroke-width="1.5" stroke-dasharray="6,4"/>
      <!-- Data Line (polyline) -->
      <polyline points="55,100 80,95 105,88 130,105 155,110 180,98 205,92 230,102 255,95 280,90 305,100 330,96"
                stroke="#007AFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Data dots -->
      <circle cx="55" cy="100" r="3" fill="#007AFF"/>
      <circle cx="130" cy="105" r="3" fill="#007AFF"/>
      <circle cx="205" cy="92" r="3" fill="#007AFF"/>
      <circle cx="280" cy="90" r="3" fill="#007AFF"/>
      <circle cx="330" cy="96" r="3" fill="#007AFF"/>
      <!-- X-Axis Labels -->
      <text x="70" y="185" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93" text-anchor="middle">Feb 7</text>
      <text x="145" y="185" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93" text-anchor="middle">Feb 14</text>
      <text x="220" y="185" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93" text-anchor="middle">Feb 21</text>
      <text x="295" y="185" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93" text-anchor="middle">Feb 28</text>
      <!-- Legend -->
      <line x1="60" y1="204" x2="76" y2="204" stroke="#007AFF" stroke-width="2"/>
      <text x="82" y="208" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93">Heart Rate</text>
      <line x1="160" y1="204" x2="176" y2="204" stroke="#34C759" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="182" y="208" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93">Baseline</text>
      <rect x="250" y="199" width="12" height="10" rx="2" fill="#34C759" opacity="0.15"/>
      <text x="268" y="208" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#8E8E93">Normal Range</text>
    </g>

    <!-- Stats Grid 2x2 -->
    <g id="StatsGrid" transform="translate(16, 364)">
      <rect width="173" height="72" rx="16" fill="#FFFFFF"/>
      <text x="16" y="28" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93">Average</text>
      <text x="16" y="52" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1C1C1E">68</text>
      <text x="50" y="52" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">bpm</text>

      <rect x="188" y="0" width="173" height="72" rx="16" fill="#FFFFFF"/>
      <text x="204" y="28" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93">Min</text>
      <text x="204" y="52" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1C1C1E">52</text>
      <text x="238" y="52" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">bpm</text>

      <rect x="0" y="82" width="173" height="72" rx="16" fill="#FFFFFF"/>
      <text x="16" y="110" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93">Max</text>
      <text x="16" y="134" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1C1C1E">142</text>
      <text x="60" y="134" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">bpm</text>

      <rect x="188" y="82" width="173" height="72" rx="16" fill="#FFFFFF"/>
      <text x="204" y="110" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93">Baseline</text>
      <text x="204" y="134" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1C1C1E">65</text>
      <text x="238" y="134" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">bpm</text>
    </g>

    <!-- Moving Average Section -->
    <g id="MovingAverage" transform="translate(16, 530)">
      <text x="0" y="0" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Moving Averages</text>
      <rect x="0" y="14" width="361" height="76" rx="16" fill="#FFFFFF"/>
      <text x="16" y="40" font-family="-apple-system, system-ui, sans-serif" font-size="15" fill="#1C1C1E">7-day MA</text>
      <text x="250" y="40" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E" text-anchor="end">66 bpm</text>
      <text x="280" y="40" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#34C759">↓ 2%</text>
      <line x1="16" y1="54" x2="345" y2="54" stroke="#E5E5EA" stroke-width="0.5"/>
      <text x="16" y="76" font-family="-apple-system, system-ui, sans-serif" font-size="15" fill="#1C1C1E">30-day MA</text>
      <text x="250" y="76" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E" text-anchor="end">68 bpm</text>
    </g>

    <!-- Insights Section -->
    <g id="InsightsSection" transform="translate(16, 634)">
      <text x="0" y="0" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Insights</text>
      <!-- Insight Card 1 -->
      <rect x="0" y="14" width="361" height="72" rx="16" fill="#FFFFFF"/>
      <rect x="16" y="26" width="62" height="20" rx="10" fill="#FF9500" opacity="0.15"/>
      <text x="47" y="40" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF9500" text-anchor="middle">Warning</text>
      <text x="16" y="66" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#1C1C1E">Your resting HR has been declining over the past</text>
      <text x="16" y="80" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#1C1C1E">2 weeks — this is a positive trend.</text>
      <!-- Insight Card 2 -->
      <rect x="0" y="96" width="361" height="56" rx="16" fill="#FFFFFF"/>
      <rect x="16" y="108" width="38" height="20" rx="10" fill="#007AFF" opacity="0.15"/>
      <text x="35" y="122" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#007AFF" text-anchor="middle">Info</text>
      <text x="16" y="144" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#1C1C1E">Peak HR during workouts averages 148 bpm.</text>
    </g>

    <!-- Historical Context Section -->
    <g id="HistoricalContext" transform="translate(16, 760)">
      <text x="0" y="0" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Historical Context</text>
      <rect x="0" y="14" width="361" height="76" rx="16" fill="#FFFFFF"/>
      <text x="16" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">vs. Last Year</text>
      <text x="345" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#34C759" text-anchor="end">-4 bpm (improved)</text>
      <line x1="16" y1="50" x2="345" y2="50" stroke="#E5E5EA" stroke-width="0.5"/>
      <text x="16" y="68" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">Percentile</text>
      <text x="345" y="68" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1C1C1E" text-anchor="end">Top 25%</text>
      <line x1="16" y1="78" x2="345" y2="78" stroke="#E5E5EA" stroke-width="0.5"/>
    </g>
  </g>
</svg>