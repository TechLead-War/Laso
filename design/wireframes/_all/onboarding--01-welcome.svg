<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#34C759"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <g id="background">
    <rect width="393" height="852" fill="#F2F2F7" rx="0"/>
  </g>

  <!-- Status Bar -->
  <g id="status-bar">
    <text x="36" y="22" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
    <!-- Signal bars -->
    <g id="signal-bars" transform="translate(312, 10)">
      <rect x="0" y="6" width="3" height="4" rx="0.5" fill="#1C1C1E"/>
      <rect x="5" y="4" width="3" height="6" rx="0.5" fill="#1C1C1E"/>
      <rect x="10" y="2" width="3" height="8" rx="0.5" fill="#1C1C1E"/>
      <rect x="15" y="0" width="3" height="10" rx="0.5" fill="#1C1C1E"/>
    </g>
    <!-- WiFi -->
    <g id="wifi-icon" transform="translate(336, 10)">
      <path d="M5 2 C7.5 0, 10.5 0, 13 2" stroke="#1C1C1E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M7 5 C8.5 3.5, 9.5 3.5, 11 5" stroke="#1C1C1E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="9" cy="8" r="1.5" fill="#1C1C1E"/>
    </g>
    <!-- Battery -->
    <g id="battery-icon" transform="translate(355, 10)">
      <rect x="0" y="1" width="22" height="10" rx="2" stroke="#1C1C1E" stroke-width="1" fill="none"/>
      <rect x="22" y="4" width="2" height="4" rx="1" fill="#1C1C1E"/>
      <rect x="2" y="3" width="17" height="6" rx="1" fill="#1C1C1E"/>
    </g>
  </g>

  <!-- App Logo -->
  <g id="app-logo" transform="translate(146.5, 280)">
    <rect width="100" height="100" rx="22" fill="url(#logo-gradient)"/>
    <!-- Heart icon -->
    <g transform="translate(50, 42)" fill="#FFFFFF">
      <path d="M0-12 C-5-22,-20-18,-20-8 C-20,2,-5,12,0,20 C5,12,20,2,20-8 C20-18,5-22,0-12Z" fill="#FFFFFF"/>
    </g>
    <!-- Pulse line over heart -->
    <g transform="translate(25, 50)">
      <polyline points="0,0 12,0 18,-14 24,10 30,-8 36,4 42,0 50,0" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    </g>
  </g>

  <!-- App Name -->
  <g id="app-name">
    <text x="196.5" y="420" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="34" font-weight="700" fill="#1C1C1E" text-anchor="middle">Laso</text>
  </g>

  <!-- Tagline -->
  <g id="tagline">
    <text x="196.5" y="458" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="20" font-weight="400" fill="#8E8E93" text-anchor="middle">Your health, understood.</text>
  </g>

  <!-- Get Started Button -->
  <g id="get-started-button" transform="translate(32, 738)">
    <rect width="329" height="56" rx="14" fill="#007AFF"/>
    <text x="164.5" y="35" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Get Started</text>
  </g>

  <!-- Home Indicator -->
  <g id="home-indicator">
    <rect x="128" y="832" width="137" height="5" rx="2.5" fill="#1C1C1E" opacity="0.2"/>
  </g>
</svg>