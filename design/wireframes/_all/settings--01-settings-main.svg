<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="393" height="852" fill="#F2F2F7"/>

  <!-- Status Bar -->
  <g id="StatusBar">
    <text x="36" y="20" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
    <g transform="translate(330,8)">
      <rect x="0" y="2" width="4" height="10" rx="1" fill="#1C1C1E"/>
      <rect x="6" y="4" width="4" height="8" rx="1" fill="#1C1C1E"/>
      <rect x="12" y="6" width="4" height="6" rx="1" fill="#1C1C1E"/>
      <rect x="18" y="8" width="4" height="4" rx="1" fill="#1C1C1E"/>
    </g>
    <g transform="translate(352,6)">
      <rect x="0" y="2" width="22" height="11" rx="2" stroke="#1C1C1E" stroke-width="1" fill="none"/>
      <rect x="22" y="5" width="2" height="5" rx="1" fill="#1C1C1E"/>
      <rect x="2" y="4" width="16" height="7" rx="1" fill="#1C1C1E"/>
    </g>
  </g>

  <!-- Sheet Handle Bar -->
  <g id="SheetHandle">
    <rect x="172" y="6" width="50" height="5" rx="2.5" fill="#C7C7CC"/>
  </g>

  <!-- Navigation Bar -->
  <g id="NavBar">
    <text x="197" y="50" font-size="17" font-weight="600" fill="#1C1C1E" text-anchor="middle">Settings</text>
  </g>

  <!-- Section: Connected Devices -->
  <g id="Section-ConnectedDevices">
    <text x="32" y="78" font-size="13" fill="#8E8E93" letter-spacing="0.5">CONNECTED DEVICES</text>
    <rect x="16" y="84" width="361" height="44" rx="12" fill="#FFFFFF"/>
    <rect x="28" y="94" width="24" height="24" rx="6" fill="#007AFF" opacity="0.15"/>
    <rect x="34" y="100" width="12" height="12" rx="2" fill="#007AFF"/>
    <text x="62" y="112" font-size="17" fill="#1C1C1E">Devices</text>
    <text x="310" y="112" font-size="15" fill="#8E8E93">2 connected</text>
    <path d="M365,106 l5,5 l-5,5" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Section: Notifications -->
  <g id="Section-Notifications">
    <text x="32" y="152" font-size="13" fill="#8E8E93" letter-spacing="0.5">NOTIFICATIONS</text>
    <rect x="16" y="158" width="361" height="88" rx="12" fill="#FFFFFF"/>
    <g id="Row-DailySummary">
      <text x="32" y="190" font-size="17" fill="#1C1C1E">Daily Summary</text>
      <g transform="translate(326,174)">
        <rect width="51" height="31" rx="15.5" fill="#34C759"/>
        <circle cx="35" cy="15.5" r="13.5" fill="#FFFFFF"/>
      </g>
    </g>
    <line x1="32" y1="202" x2="361" y2="202" stroke="#E5E5EA" stroke-width="0.5"/>
    <g id="Row-WeeklyReview">
      <text x="32" y="234" font-size="17" fill="#1C1C1E">Weekly Review</text>
      <g transform="translate(326,218)">
        <rect width="51" height="31" rx="15.5" fill="#34C759"/>
        <circle cx="35" cy="15.5" r="13.5" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- Section: Alerts -->
  <g id="Section-Alerts">
    <text x="32" y="272" font-size="13" fill="#8E8E93" letter-spacing="0.5">ALERTS</text>
    <rect x="16" y="278" width="361" height="88" rx="12" fill="#FFFFFF"/>
    <g id="Row-HeartRateSpike">
      <text x="32" y="310" font-size="17" fill="#1C1C1E">Heart Rate Spike</text>
      <g transform="translate(326,294)">
        <rect width="51" height="31" rx="15.5" fill="#34C759"/>
        <circle cx="35" cy="15.5" r="13.5" fill="#FFFFFF"/>
      </g>
    </g>
    <line x1="32" y1="322" x2="361" y2="322" stroke="#E5E5EA" stroke-width="0.5"/>
    <g id="Row-HeartRateDrop">
      <text x="32" y="354" font-size="17" fill="#1C1C1E">Heart Rate Drop</text>
      <g transform="translate(326,338)">
        <rect width="51" height="31" rx="15.5" fill="#E5E5EA"/>
        <circle cx="15.5" cy="15.5" r="13.5" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- Section: Export -->
  <g id="Section-Export">
    <text x="32" y="392" font-size="13" fill="#8E8E93" letter-spacing="0.5">EXPORT</text>
    <rect x="16" y="398" width="361" height="44" rx="12" fill="#FFFFFF"/>
    <text x="32" y="426" font-size="17" fill="#1C1C1E">Export Health Data</text>
    <rect x="188" y="412" width="40" height="20" rx="6" fill="#FF9500"/>
    <text x="208" y="426" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">PRO</text>
    <path d="M365,420 l5,5 l-5,5" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Section: Appearance -->
  <g id="Section-Appearance">
    <text x="32" y="468" font-size="13" fill="#8E8E93" letter-spacing="0.5">APPEARANCE</text>
    <rect x="16" y="474" width="361" height="88" rx="12" fill="#FFFFFF"/>
    <g id="Row-AppIcon">
      <text x="32" y="506" font-size="17" fill="#1C1C1E">App Icon</text>
      <path d="M365,500 l5,5 l-5,5" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <line x1="32" y1="518" x2="361" y2="518" stroke="#E5E5EA" stroke-width="0.5"/>
    <g id="Row-Theme">
      <text x="32" y="550" font-size="17" fill="#1C1C1E">Theme</text>
      <text x="340" y="550" font-size="15" fill="#8E8E93" text-anchor="end">System</text>
      <path d="M365,544 l5,5 l-5,5" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Section: Data -->
  <g id="Section-Data">
    <text x="32" y="588" font-size="13" fill="#8E8E93" letter-spacing="0.5">DATA</text>
    <rect x="16" y="594" width="361" height="88" rx="12" fill="#FFFFFF"/>
    <g id="Row-ClearCache">
      <text x="32" y="626" font-size="17" fill="#1C1C1E">Clear Cache</text>
    </g>
    <line x1="32" y1="638" x2="361" y2="638" stroke="#E5E5EA" stroke-width="0.5"/>
    <g id="Row-DataStorage">
      <text x="32" y="670" font-size="17" fill="#1C1C1E">Data Storage</text>
      <text x="371" y="670" font-size="15" fill="#8E8E93" text-anchor="end">142 MB</text>
    </g>
  </g>

  <!-- Section: About -->
  <g id="Section-About">
    <text x="32" y="708" font-size="13" fill="#8E8E93" letter-spacing="0.5">ABOUT</text>
    <rect x="16" y="714" width="361" height="132" rx="12" fill="#FFFFFF"/>
    <g id="Row-Version">
      <text x="32" y="742" font-size="17" fill="#1C1C1E">Version</text>
      <text x="371" y="742" font-size="15" fill="#8E8E93" text-anchor="end">1.57</text>
    </g>
    <line x1="32" y1="750" x2="361" y2="750" stroke="#E5E5EA" stroke-width="0.5"/>
    <g id="Row-PrivacyPolicy">
      <text x="32" y="774" font-size="17" fill="#1C1C1E">Privacy Policy</text>
      <path d="M365,768 l5,5 l-5,5" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <line x1="32" y1="782" x2="361" y2="782" stroke="#E5E5EA" stroke-width="0.5"/>
    <g id="Row-TermsOfService">
      <text x="32" y="806" font-size="17" fill="#1C1C1E">Terms of Service</text>
      <path d="M365,800 l5,5 l-5,5" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <line x1="32" y1="814" x2="361" y2="814" stroke="#E5E5EA" stroke-width="0.5"/>
    <g id="Row-RateApp">
      <text x="32" y="838" font-size="17" fill="#1C1C1E">Rate HealthPulse</text>
      <path d="M365,832 l5,5 l-5,5" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>