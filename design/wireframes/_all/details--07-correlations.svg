<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <clipPath id="screenClip"><rect width="393" height="852" rx="44"/></clipPath>
  </defs>

  <g id="CorrelationsView" clip-path="url(#screenClip)">
    <rect width="393" height="852" fill="#F2F2F7" rx="44"/>

    <!-- Status Bar -->
    <g id="StatusBar">
      <text x="36" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
      <g transform="translate(330,10)">
        <rect x="0" y="2" width="18" height="10" rx="2" stroke="#1C1C1E" stroke-width="1.2" fill="none"/>
        <rect x="19" y="5" width="1.5" height="4" rx="0.75" fill="#1C1C1E"/>
        <rect x="2" y="4" width="13" height="6" rx="1" fill="#1C1C1E"/>
      </g>
      <g transform="translate(296,8)">
        <path d="M0 10 Q4 0 8 10 Q12 0 16 10 Q20 0 24 10" stroke="#1C1C1E" stroke-width="1.5" fill="none"/>
      </g>
      <g transform="translate(268,8)">
        <rect x="0" y="8" width="4" height="4" rx="1" fill="#1C1C1E"/>
        <rect x="6" y="5" width="4" height="7" rx="1" fill="#1C1C1E"/>
        <rect x="12" y="2" width="4" height="10" rx="1" fill="#1C1C1E"/>
        <rect x="18" y="0" width="4" height="12" rx="1" fill="#1C1C1E"/>
      </g>
    </g>

    <!-- Navigation Bar -->
    <g id="NavBar">
      <g id="BackButton" transform="translate(16, 48)">
        <path d="M10 2 L2 12 L10 22" stroke="#007AFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="16" font-family="-apple-system, system-ui, sans-serif" font-size="17" fill="#007AFF">Back</text>
      </g>
      <text x="174" y="64" font-family="-apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#1C1C1E" text-anchor="middle">Correlations</text>
      <!-- PRO Badge -->
      <rect x="244" y="50" width="42" height="20" rx="10" fill="#FF9500"/>
      <text x="265" y="64" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">PRO</text>
    </g>

    <!-- Filter Pills -->
    <g id="FilterPills" transform="translate(16, 86)">
      <rect x="0" y="0" width="44" height="30" rx="15" fill="#007AFF"/>
      <text x="22" y="20" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">All</text>

      <rect x="52" y="0" width="64" height="30" rx="15" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="84" y="20" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93" text-anchor="middle">Strong</text>

      <rect x="124" y="0" width="80" height="30" rx="15" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="164" y="20" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93" text-anchor="middle">Moderate</text>

      <rect x="212" y="0" width="58" height="30" rx="15" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="241" y="20" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93" text-anchor="middle">Sleep</text>

      <rect x="278" y="0" width="72" height="30" rx="15" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <text x="314" y="20" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93" text-anchor="middle">Exercise</text>
    </g>

    <!-- Correlation Card 1 — Strong Positive -->
    <g id="CorrelationCard1" transform="translate(16, 130)">
      <rect width="361" height="132" rx="16" fill="#FFFFFF"/>
      <!-- Metric pair header -->
      <text x="20" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Sleep Duration</text>
      <text x="165" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#8E8E93">↔</text>
      <text x="185" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">HRV</text>
      <!-- Badges row -->
      <rect x="20" y="42" width="58" height="22" rx="11" fill="#34C759" opacity="0.12"/>
      <text x="49" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34C759" text-anchor="middle">Strong</text>
      <rect x="86" y="42" width="66" height="22" rx="11" fill="#007AFF" opacity="0.1"/>
      <text x="119" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#007AFF" text-anchor="middle">Positive ↑</text>
      <!-- r-value -->
      <text x="341" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1C1E" text-anchor="end">r = 0.72</text>
      <!-- Description -->
      <text x="20" y="86" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">When you sleep longer, your HRV tends to</text>
      <text x="20" y="102" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">be higher the next day.</text>
      <!-- Confidence -->
      <text x="20" y="122" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#8E8E93">Confidence: High · Based on 87 days</text>
    </g>

    <!-- Correlation Card 2 — Strong Negative -->
    <g id="CorrelationCard2" transform="translate(16, 276)">
      <rect width="361" height="132" rx="16" fill="#FFFFFF"/>
      <text x="20" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Stress</text>
      <text x="76" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#8E8E93">↔</text>
      <text x="96" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Sleep Quality</text>
      <rect x="20" y="42" width="58" height="22" rx="11" fill="#34C759" opacity="0.12"/>
      <text x="49" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34C759" text-anchor="middle">Strong</text>
      <rect x="86" y="42" width="76" height="22" rx="11" fill="#FF3B30" opacity="0.1"/>
      <text x="124" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF3B30" text-anchor="middle">Negative ↓</text>
      <text x="341" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1C1E" text-anchor="end">r = -0.68</text>
      <text x="20" y="86" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">Higher stress levels are associated with</text>
      <text x="20" y="102" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">lower sleep quality that night.</text>
      <text x="20" y="122" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#8E8E93">Confidence: High · Based on 74 days</text>
    </g>

    <!-- Correlation Card 3 — Moderate Positive -->
    <g id="CorrelationCard3" transform="translate(16, 422)">
      <rect width="361" height="132" rx="16" fill="#FFFFFF"/>
      <text x="20" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Exercise Duration</text>
      <text x="182" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#8E8E93">↔</text>
      <text x="202" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Deep Sleep</text>
      <rect x="20" y="42" width="76" height="22" rx="11" fill="#FF9500" opacity="0.12"/>
      <text x="58" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF9500" text-anchor="middle">Moderate</text>
      <rect x="104" y="42" width="66" height="22" rx="11" fill="#007AFF" opacity="0.1"/>
      <text x="137" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#007AFF" text-anchor="middle">Positive ↑</text>
      <text x="341" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1C1E" text-anchor="end">r = 0.51</text>
      <text x="20" y="86" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">Days with 30+ min exercise tend to have</text>
      <text x="20" y="102" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">15-20% more deep sleep.</text>
      <text x="20" y="122" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#8E8E93">Confidence: Medium · Based on 62 days</text>
    </g>

    <!-- Correlation Card 4 — Moderate Positive -->
    <g id="CorrelationCard4" transform="translate(16, 568)">
      <rect width="361" height="132" rx="16" fill="#FFFFFF"/>
      <text x="20" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Steps</text>
      <text x="68" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#8E8E93">↔</text>
      <text x="88" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Resting HR</text>
      <rect x="20" y="42" width="76" height="22" rx="11" fill="#FF9500" opacity="0.12"/>
      <text x="58" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF9500" text-anchor="middle">Moderate</text>
      <rect x="104" y="42" width="76" height="22" rx="11" fill="#FF3B30" opacity="0.1"/>
      <text x="142" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF3B30" text-anchor="middle">Negative ↓</text>
      <text x="341" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1C1E" text-anchor="end">r = -0.44</text>
      <text x="20" y="86" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">More active days correlate with a slightly</text>
      <text x="20" y="102" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">lower resting heart rate the next morning.</text>
      <text x="20" y="122" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#8E8E93">Confidence: Medium · Based on 90 days</text>
    </g>

    <!-- Correlation Card 5 — Moderate -->
    <g id="CorrelationCard5" transform="translate(16, 714)">
      <rect width="361" height="120" rx="16" fill="#FFFFFF"/>
      <text x="20" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Weight</text>
      <text x="82" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#8E8E93">↔</text>
      <text x="102" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Blood Pressure</text>
      <rect x="20" y="42" width="76" height="22" rx="11" fill="#FF9500" opacity="0.12"/>
      <text x="58" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF9500" text-anchor="middle">Moderate</text>
      <rect x="104" y="42" width="66" height="22" rx="11" fill="#007AFF" opacity="0.1"/>
      <text x="137" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#007AFF" text-anchor="middle">Positive ↑</text>
      <text x="341" y="57" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1C1E" text-anchor="end">r = 0.47</text>
      <text x="20" y="86" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">Weight increases tend to coincide with</text>
      <text x="20" y="102" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93">higher blood pressure readings.</text>
    </g>
  </g>
</svg>