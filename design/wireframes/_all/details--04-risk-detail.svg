<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <clipPath id="screenClip"><rect width="393" height="852" rx="44"/></clipPath>
  </defs>

  <g id="HealthRiskDetailView" clip-path="url(#screenClip)">
    <rect width="393" height="852" fill="#F2F2F7" rx="44"/>

    <!-- Status Bar -->
    <g id="StatusBar">
      <text x="36" y="22" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
      <g transform="translate(330,10)">
        <rect x="0" y="2" width="18" height="10" rx="2" stroke="#1C1C1E" stroke-width="1.2" fill="none"/>
        <rect x="19" y="5" width="1.5" height="4" rx="0.75" fill="#1C1C1E"/>
        <rect x="2" y="4" width="13" height="6" rx="1" fill="#1C1C1E"/>
      </g>
      <g transform="translate(296,8)">
        <path d="M0 10 Q4 0 8 10 Q12 0 16 10 Q20 0 24 10" stroke="#1C1C1E" stroke-width="1.5" fill="none"/>
      </g>
      <g transform="translate(268,8)">
        <rect x="0" y="8" width="4" height="4" rx="1" fill="#1C1C1E"/>
        <rect x="6" y="5" width="4" height="7" rx="1" fill="#1C1C1E"/>
        <rect x="12" y="2" width="4" height="10" rx="1" fill="#1C1C1E"/>
        <rect x="18" y="0" width="4" height="12" rx="1" fill="#1C1C1E"/>
      </g>
    </g>

    <!-- Navigation Bar -->
    <g id="NavBar">
      <g id="BackButton" transform="translate(16, 48)">
        <path d="M10 2 L2 12 L10 22" stroke="#007AFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="18" y="16" font-family="-apple-system, system-ui, sans-serif" font-size="17" fill="#007AFF">Back</text>
      </g>
      <text x="197" y="64" font-family="-apple-system, system-ui, sans-serif" font-size="17" font-weight="600" fill="#1C1C1E" text-anchor="middle">Cardiovascular Risk</text>
    </g>

    <!-- Risk Gauge -->
    <g id="RiskGauge" transform="translate(197, 168)">
      <!-- Gauge arc segments -->
      <!-- Green zone (low) -->
      <path d="M-100 0 A100 100 0 0 1 -70.7 -70.7" stroke="#34C759" stroke-width="18" fill="none" stroke-linecap="round"/>
      <!-- Yellow zone -->
      <path d="M-66 -76 A100 100 0 0 1 0 -100" stroke="#FFCC00" stroke-width="18" fill="none"/>
      <!-- Orange zone (current) -->
      <path d="M5 -100 A100 100 0 0 1 70.7 -70.7" stroke="#FF9500" stroke-width="18" fill="none"/>
      <!-- Red zone (high) -->
      <path d="M76 -66 A100 100 0 0 1 100 0" stroke="#FF3B30" stroke-width="18" fill="none" stroke-linecap="round"/>

      <!-- Gauge needle pointing to orange zone -->
      <line x1="0" y1="0" x2="42" y2="-72" stroke="#1C1C1E" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="6" fill="#1C1C1E"/>

      <!-- Score and label -->
      <text x="0" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#8E8E93" text-anchor="middle">Risk Level</text>
      <text x="0" y="58" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FF9500" text-anchor="middle">Moderate</text>

      <!-- Zone labels -->
      <text x="-108" y="16" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#34C759" text-anchor="middle">Low</text>
      <text x="108" y="16" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#FF3B30" text-anchor="middle">High</text>
    </g>

    <!-- Risk Grade Badge -->
    <g id="RiskGradeBadge" transform="translate(160, 240)">
      <rect width="73" height="44" rx="12" fill="#FF9500" opacity="0.15"/>
      <text x="36" y="30" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="800" fill="#FF9500" text-anchor="middle">B-</text>
    </g>

    <!-- Contributing Factors -->
    <g id="ContributingFactors" transform="translate(16, 306)">
      <text x="0" y="0" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Contributing Factors</text>

      <!-- Factor 1 -->
      <rect x="0" y="16" width="361" height="78" rx="16" fill="#FFFFFF"/>
      <text x="20" y="40" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">Resting Heart Rate</text>
      <rect x="260" y="26" width="48" height="22" rx="11" fill="#FF9500" opacity="0.15"/>
      <text x="284" y="41" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF9500" text-anchor="middle">High</text>
      <text x="20" y="58" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93">72 bpm (target: &lt;65 bpm)</text>
      <!-- Impact bar -->
      <rect x="20" y="68" width="321" height="4" rx="2" fill="#E5E5EA"/>
      <rect x="20" y="68" width="240" height="4" rx="2" fill="#FF9500"/>

      <!-- Factor 2 -->
      <rect x="0" y="104" width="361" height="78" rx="16" fill="#FFFFFF"/>
      <text x="20" y="128" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">Blood Pressure</text>
      <rect x="244" y="114" width="64" height="22" rx="11" fill="#FF9500" opacity="0.15"/>
      <text x="276" y="129" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF9500" text-anchor="middle">Medium</text>
      <text x="20" y="146" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93">128/82 mmHg (target: &lt;120/80)</text>
      <rect x="20" y="156" width="321" height="4" rx="2" fill="#E5E5EA"/>
      <rect x="20" y="156" width="180" height="4" rx="2" fill="#FF9500"/>

      <!-- Factor 3 -->
      <rect x="0" y="192" width="361" height="78" rx="16" fill="#FFFFFF"/>
      <text x="20" y="216" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">HRV</text>
      <rect x="260" y="202" width="48" height="22" rx="11" fill="#34C759" opacity="0.15"/>
      <text x="284" y="217" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34C759" text-anchor="middle">Low</text>
      <text x="20" y="234" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93">42 ms (target: &gt;40 ms)</text>
      <rect x="20" y="244" width="321" height="4" rx="2" fill="#E5E5EA"/>
      <rect x="20" y="244" width="100" height="4" rx="2" fill="#34C759"/>

      <!-- Factor 4 -->
      <rect x="0" y="280" width="361" height="78" rx="16" fill="#FFFFFF"/>
      <text x="20" y="304" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">VO2 Max</text>
      <rect x="244" y="290" width="64" height="22" rx="11" fill="#FF9500" opacity="0.15"/>
      <text x="276" y="305" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF9500" text-anchor="middle">Medium</text>
      <text x="20" y="322" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93">38 mL/kg/min (target: &gt;42)</text>
      <rect x="20" y="332" width="321" height="4" rx="2" fill="#E5E5EA"/>
      <rect x="20" y="332" width="200" height="4" rx="2" fill="#FF9500"/>
    </g>

    <!-- Focus Areas -->
    <g id="FocusAreas" transform="translate(16, 680)">
      <text x="0" y="0" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">Focus Areas</text>

      <!-- Suggestion 1 -->
      <rect x="0" y="16" width="361" height="56" rx="16" fill="#FFFFFF"/>
      <circle cx="36" cy="44" r="14" fill="#007AFF" opacity="0.12"/>
      <text x="36" y="49" font-family="-apple-system, system-ui, sans-serif" font-size="16" text-anchor="middle">🏃</text>
      <text x="60" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#1C1C1E">Increase aerobic exercise</text>
      <text x="60" y="56" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93">Aim for 150 min/week to lower resting HR</text>

      <!-- Suggestion 2 -->
      <rect x="0" y="82" width="361" height="56" rx="16" fill="#FFFFFF"/>
      <circle cx="36" cy="110" r="14" fill="#007AFF" opacity="0.12"/>
      <text x="36" y="115" font-family="-apple-system, system-ui, sans-serif" font-size="16" text-anchor="middle">😴</text>
      <text x="60" y="104" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#1C1C1E">Improve sleep consistency</text>
      <text x="60" y="122" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#8E8E93">Regular sleep schedule improves HRV recovery</text>
    </g>
  </g>
</svg>