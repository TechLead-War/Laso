<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, sans-serif; }
    </style>
    <!-- Subtle dot pattern for background -->
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#E5E5EA" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background with subtle pattern -->
  <rect width="393" height="852" fill="#F2F2F7"/>
  <rect width="393" height="852" fill="url(#dotPattern)"/>

  <!-- Status Bar (dimmed) -->
  <g id="StatusBar" opacity="0.4">
    <text x="36" y="20" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
    <g transform="translate(330,8)">
      <rect x="0" y="2" width="4" height="10" rx="1" fill="#1C1C1E"/>
      <rect x="6" y="4" width="4" height="8" rx="1" fill="#1C1C1E"/>
      <rect x="12" y="6" width="4" height="6" rx="1" fill="#1C1C1E"/>
      <rect x="18" y="8" width="4" height="4" rx="1" fill="#1C1C1E"/>
    </g>
    <g transform="translate(352,6)">
      <rect x="0" y="2" width="22" height="11" rx="2" stroke="#1C1C1E" stroke-width="1" fill="none"/>
      <rect x="22" y="5" width="2" height="5" rx="1" fill="#1C1C1E"/>
      <rect x="2" y="4" width="16" height="7" rx="1" fill="#1C1C1E"/>
    </g>
  </g>

  <!-- Centered Content -->
  <g id="CenteredContent">
    <!-- Wrench/Tool Icon -->
    <g id="WrenchIcon" transform="translate(157,280)">
      <circle cx="40" cy="40" r="48" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
      <!-- Wrench shape -->
      <g transform="translate(18,16)">
        <!-- Wrench body -->
        <path d="M30,8 C26,4 20,4 16,8 C12,12 12,18 16,22 L28,34 L36,26 L24,14 C28,10 30,8 30,8 Z" fill="none" stroke="#8E8E93" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Wrench head -->
        <path d="M8,36 L22,22 L26,26 L12,40 C10,42 6,42 4,40 C2,38 2,34 4,32 Z" fill="#8E8E93" opacity="0.3" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Gear/cog near wrench -->
        <circle cx="36" cy="12" r="8" fill="none" stroke="#8E8E93" stroke-width="2"/>
        <circle cx="36" cy="12" r="3" fill="#8E8E93"/>
        <!-- Gear teeth -->
        <line x1="36" y1="2" x2="36" y2="5" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
        <line x1="36" y1="19" x2="36" y2="22" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
        <line x1="26" y1="12" x2="29" y2="12" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
        <line x1="43" y1="12" x2="46" y2="12" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Headline -->
    <text x="197" y="420" font-size="28" font-weight="700" fill="#1C1C1E" text-anchor="middle">We'll Be Right Back</text>

    <!-- Body text -->
    <g id="BodyText">
      <text x="197" y="458" font-size="17" fill="#8E8E93" text-anchor="middle">
        <tspan x="197" dy="0">Laso is undergoing scheduled</tspan>
        <tspan x="197" dy="24">maintenance. Your data is safe and</tspan>
        <tspan x="197" dy="24">we'll be back shortly.</tspan>
      </text>
    </g>

    <!-- Check Status Button (outlined) -->
    <g id="CheckStatusButton">
      <rect x="116" y="536" width="161" height="48" rx="12" fill="none" stroke="#007AFF" stroke-width="2"/>
      <text x="197" y="566" font-size="17" font-weight="600" fill="#007AFF" text-anchor="middle">Check Status</text>
    </g>
  </g>
</svg>