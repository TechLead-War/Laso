<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <!-- Background -->
  <g id="background">
    <rect width="393" height="852" fill="#F2F2F7"/>
  </g>

  <!-- Status Bar -->
  <g id="status-bar">
    <text x="36" y="22" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">9:41</text>
    <g id="signal-bars" transform="translate(312, 10)">
      <rect x="0" y="6" width="3" height="4" rx="0.5" fill="#1C1C1E"/>
      <rect x="5" y="4" width="3" height="6" rx="0.5" fill="#1C1C1E"/>
      <rect x="10" y="2" width="3" height="8" rx="0.5" fill="#1C1C1E"/>
      <rect x="15" y="0" width="3" height="10" rx="0.5" fill="#1C1C1E"/>
    </g>
    <g id="wifi-icon" transform="translate(336, 10)">
      <path d="M5 2 C7.5 0, 10.5 0, 13 2" stroke="#1C1C1E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M7 5 C8.5 3.5, 9.5 3.5, 11 5" stroke="#1C1C1E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="9" cy="8" r="1.5" fill="#1C1C1E"/>
    </g>
    <g id="battery-icon" transform="translate(355, 10)">
      <rect x="0" y="1" width="22" height="10" rx="2" stroke="#1C1C1E" stroke-width="1" fill="none"/>
      <rect x="22" y="4" width="2" height="4" rx="1" fill="#1C1C1E"/>
      <rect x="2" y="3" width="17" height="6" rx="1" fill="#1C1C1E"/>
    </g>
  </g>

  <!-- Circular Progress Ring -->
  <g id="progress-ring" transform="translate(196.5, 310)">
    <!-- Background ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#E5E5EA" stroke-width="8"/>
    <!-- Progress arc (~60%) -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#007AFF" stroke-width="8"
            stroke-dasharray="339.29 565.49"
            stroke-linecap="round"
            transform="rotate(-90)"/>
    <!-- Inner background -->
    <circle cx="0" cy="0" r="74" fill="#FFFFFF"/>
    <!-- Percentage text -->
    <text x="0" y="-8" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="42" font-weight="700" fill="#007AFF" text-anchor="middle">60%</text>
    <text x="0" y="18" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="14" font-weight="400" fill="#8E8E93" text-anchor="middle">complete</text>
  </g>

  <!-- Animated dots placeholder -->
  <g id="loading-dots" transform="translate(196.5, 430)">
    <circle cx="-16" cy="0" r="4" fill="#007AFF" opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#007AFF" opacity="0.6"/>
    <circle cx="16" cy="0" r="4" fill="#007AFF" opacity="1"/>
  </g>

  <!-- Headline -->
  <g id="headline">
    <text x="196.5" y="486" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1C1C1E" text-anchor="middle">Analyzing your</text>
    <text x="196.5" y="522" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1C1C1E" text-anchor="middle">health data...</text>
  </g>

  <!-- Body Text -->
  <g id="body-text">
    <text x="196.5" y="562" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="16" font-weight="400" fill="#8E8E93" text-anchor="middle">This may take a moment. We're building</text>
    <text x="196.5" y="584" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="16" font-weight="400" fill="#8E8E93" text-anchor="middle">your personalized baseline.</text>
  </g>

  <!-- Linear Progress Bar -->
  <g id="progress-bar" transform="translate(48, 630)">
    <!-- Track -->
    <rect width="297" height="6" rx="3" fill="#E5E5EA"/>
    <!-- Fill (~60%) -->
    <rect width="178" height="6" rx="3" fill="#007AFF"/>
  </g>

  <!-- Status Text -->
  <g id="status-text">
    <text x="196.5" y="668" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#007AFF" text-anchor="middle">Processing 3 months of data...</text>
  </g>

  <!-- Processing steps -->
  <g id="processing-steps" transform="translate(80, 700)">
    <!-- Completed step -->
    <g id="step-1" transform="translate(0, 0)">
      <circle cx="8" cy="8" r="8" fill="#34C759"/>
      <polyline points="4,8 7,11 12,5" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="13" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="400" fill="#8E8E93">Connected to Apple Health</text>
    </g>
    <!-- Completed step -->
    <g id="step-2" transform="translate(0, 28)">
      <circle cx="8" cy="8" r="8" fill="#34C759"/>
      <polyline points="4,8 7,11 12,5" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="13" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="400" fill="#8E8E93">Reading health records</text>
    </g>
    <!-- In-progress step -->
    <g id="step-3" transform="translate(0, 56)">
      <circle cx="8" cy="8" r="8" fill="none" stroke="#007AFF" stroke-width="2"/>
      <circle cx="8" cy="8" r="3" fill="#007AFF"/>
      <text x="24" y="13" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="500" fill="#1C1C1E">Building baseline profile</text>
    </g>
    <!-- Pending step -->
    <g id="step-4" transform="translate(0, 84)">
      <circle cx="8" cy="8" r="8" fill="none" stroke="#E5E5EA" stroke-width="1.5"/>
      <text x="24" y="13" font-family="SF Pro Display, -apple-system, system-ui, sans-serif" font-size="13" font-weight="400" fill="#8E8E93" opacity="0.5">Generating insights</text>
    </g>
  </g>

  <!-- Home Indicator -->
  <g id="home-indicator">
    <rect x="128" y="832" width="137" height="5" rx="2.5" fill="#1C1C1E" opacity="0.2"/>
  </g>
</svg>