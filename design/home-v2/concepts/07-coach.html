<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laso Home v2 — Concept 07, The Coach</title>
<style>
/* ============================================================
   Laso design tokens (verbatim from DESIGN-TOKENS.md)
   ============================================================ */
:root{
  --sunken:#E4E4EC; --base:#EEEEF4; --raised:#F8F8FB; --elev:#FCFCFD;
  --overlay:#FEFEFF; --subtle:#EAEAF1;
  --t1:#1B1B20; --t2:#44444D; --t3:#5B5B65;
  --bl:#E0E0E8; --bm:#C9C9D3;
  --primary:#0064CC;
  --good:#0C7752; --warn:#8A6400; --bad:#C42B33;
  --cardShadow:0 1px 2px rgba(0,0,0,.12);
  --bandTint:rgba(12,119,82,.16);
  --bandStroke:rgba(12,119,82,.34);
  --track:#E1E1EA;
  --skel:rgba(27,27,32,.07);
}
html[data-theme="dark"]{
  --sunken:#08080A; --base:#0F0F13; --raised:#1B1B21; --elev:#26262D;
  --overlay:#33333B; --subtle:#17171C;
  --t1:#F2F2F6; --t2:#C9C9D2; --t3:#ADADB8;
  --bl:#2E2E36; --bm:#414149;
  --primary:#4DA3FF;
  --good:#3DCC99; --warn:#E3B45A; --bad:#E05C64;
  --cardShadow:none;
  --bandTint:rgba(61,204,153,.15);
  --bandStroke:rgba(61,204,153,.38);
  --track:#2E2E36;
  --skel:rgba(242,242,246,.07);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--sunken);
  color:var(--t1);
  font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:17px;
  line-height:1.45;
}
.num{
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  font-feature-settings:"tnum" 1;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  letter-spacing:-.02em;
  white-space:nowrap;
}
button{font:inherit;color:inherit;margin:0}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}

/* ---------- phone frame ---------- */
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:0}
.phone{
  position:relative;width:100%;max-width:375px;height:100dvh;
  background:var(--sunken);display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:520px){
  .stage{padding:28px}
  .phone{
    height:812px;border-radius:44px;
    box-shadow:0 0 0 10px #101014, 0 0 0 11px #35353d, 0 28px 70px rgba(0,0,0,.4);
  }
}

/* ---------- status bar ---------- */
.statusbar{
  flex:0 0 auto;height:44px;padding:0 24px 0 28px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:15px;font-weight:600;color:var(--t1);letter-spacing:-.2px;
}
.statusbar .sb-r{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}

/* ---------- header ---------- */
.hdr{
  flex:0 0 auto;padding:6px 12px 10px;
  display:flex;align-items:baseline;gap:8px;
}
.hdr .date{font-size:13px;font-weight:600;color:var(--t3);letter-spacing:.02em}

/* ---------- scroll body ---------- */
.scroll{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  padding:0 12px 18px;-webkit-overflow-scrolling:touch;
}
main{display:flex;flex-direction:column;gap:12px}

/* ---------- cards ---------- */
.card{
  background:var(--raised);border:1px solid var(--bl);border-radius:16px;
  box-shadow:var(--cardShadow);padding:16px;
}
html[data-theme="dark"] .card{box-shadow:none}
.hero{
  border-radius:24px;padding:20px;
  display:flex;flex-direction:column;gap:20px;min-height:632px;
}
.hero.st-short{background:var(--raised);border-color:color-mix(in srgb,var(--warn) 20%,var(--bl))}
.hero.st-alert{background:var(--raised);border-color:color-mix(in srgb,var(--bad) 22%,var(--bl))}
.hero.st-good{background:var(--raised);border-color:color-mix(in srgb,var(--good) 18%,var(--bl))}
.hero.st-none{background:var(--raised);border-color:var(--bl)}

.glance{margin:0 -2px}
.glance svg{width:100%;height:auto;display:block}

.say{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-start;gap:14px}
.line{
  margin:0;font-size:30px;line-height:1.32;font-weight:600;
  letter-spacing:-.6px;color:var(--t1);max-width:19ch;
}
.line .num{font-size:46px;letter-spacing:-1.6px}
.because{
  margin:0;font-size:18px;line-height:1.5;color:var(--t2);max-width:32ch;
}
.because .num{font-size:27px;color:var(--t1);letter-spacing:-.7px}
.sure{
  margin:0;font-size:15px;line-height:1.45;color:var(--t3);max-width:36ch;
  padding-left:11px;border-left:2px solid var(--bm);
}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;width:100%;border-radius:14px;border:1px solid transparent;
  font-size:17px;font-weight:600;cursor:pointer;
  transition:transform 80ms ease-in,background-color 160ms ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.975);transition:transform 80ms ease-in}
.btn.primary{background:var(--primary);color:#fff;border-color:transparent}
html[data-theme="dark"] .btn.primary{color:#08080A}
.btn.set{background:var(--subtle);color:var(--t2);border-color:var(--bl)}
.btn.ghost{
  background:transparent;color:var(--primary);border-color:var(--bm);
  min-height:48px;font-weight:600;
}
.btn.ghost[aria-expanded="true"]{background:var(--subtle)}
.btn.mini{
  min-height:44px;width:auto;padding:0 16px;font-size:15px;
  background:var(--subtle);border-color:var(--bl);color:var(--t2);
}
.ack{
  margin:0;font-size:16px;line-height:1.45;color:var(--t2);
  padding:14px 0 0;border-top:1px solid var(--bl);
}

/* ---------- why panel ---------- */
.panel{
  overflow:hidden;max-height:0;opacity:0;visibility:hidden;
  transition:max-height 260ms ease-in-out,opacity 200ms ease-in-out,visibility 0s linear 260ms;
}
.panel.open{
  max-height:1200px;opacity:1;visibility:visible;
  transition:max-height 260ms ease-in-out,opacity 200ms ease-in-out,visibility 0s linear 0s;
}
.panel-in{
  padding:16px;margin-top:4px;background:var(--elev);
  border:1px solid var(--bl);border-radius:16px;
  display:flex;flex-direction:column;gap:12px;
}
.panel h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.panel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.panel li{font-size:16px;line-height:1.45;color:var(--t2);padding-left:16px;position:relative}
.panel li::before{
  content:"";position:absolute;left:0;top:9px;width:6px;height:6px;
  border-radius:50%;background:var(--bm);
}
.panel .anchor{color:var(--t3);font-size:15px;line-height:1.45;margin:0}

/* ---------- generic card parts ---------- */
.ch{
  margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:-.2px;color:var(--t1);
}
.cb{margin:0;font-size:17px;line-height:1.5;color:var(--t2)}
.cb .num{font-size:19px;color:var(--t1);letter-spacing:-.3px}
.cb .em{font-weight:600;color:var(--t1)}
.cc{margin:8px 0 0;font-size:13px;line-height:1.45;color:var(--t3)}
.lead{margin:0 0 12px;font-size:17px;line-height:1.5;color:var(--t2)}
.lead .num{font-size:19px;color:var(--t1);letter-spacing:-.3px}
.chartwrap svg{width:100%;height:auto;display:block}
.minibar{margin:12px 0 0}
.minibar svg{width:100%;height:auto;display:block}

.card.attn{border-left:3px solid var(--bm)}
.card.attn.warn{
  border-left-color:var(--bad);
  background:color-mix(in srgb,var(--bad) 4%,var(--raised));
  border-top-color:color-mix(in srgb,var(--bad) 18%,var(--bl));
  border-right-color:color-mix(in srgb,var(--bad) 18%,var(--bl));
  border-bottom-color:color-mix(in srgb,var(--bad) 18%,var(--bl));
}
.tagrow{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.tag{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--bad);
}

/* ---------- context chips ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{
  min-height:44px;padding:0 16px;border-radius:9999px;border:1px solid var(--bm);
  background:var(--overlay);color:var(--t2);font-size:15px;font-weight:600;cursor:pointer;
  transition:transform 80ms ease-in;
}
.chip:active{transform:scale(.96)}

/* ---------- plain numbers mode ---------- */
.plainbar{
  background:var(--elev);border:1px solid var(--bl);border-radius:16px;padding:16px;
}
.plainbar p{margin:0 0 12px;font-size:17px;line-height:1.5;color:var(--t2)}
.rows{background:var(--raised);border:1px solid var(--bl);border-radius:16px;overflow:hidden}
.row{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:14px 16px;border-bottom:1px solid var(--bl);
}
.row:last-child{border-bottom:0}
.row .k{font-size:17px;color:var(--t2)}
.row .v{font-size:17px;color:var(--t1);font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui;font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- footer ---------- */
.foot{display:flex;flex-direction:column;gap:10px;padding:8px 0 4px;align-items:flex-start}
.foot .upd{font-size:13px;color:var(--t3);margin:0}

/* ---------- tab bar ---------- */
.tabbar{
  flex:0 0 auto;display:flex;align-items:stretch;
  padding:6px 6px 22px;background:color-mix(in srgb,var(--base) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--bl);
}
.tab{
  flex:1;min-height:52px;background:none;border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--t3);font-size:11px;font-weight:600;letter-spacing:.01em;
  transition:transform 80ms ease-in;
}
.tab:active{transform:scale(.94)}
.tab[aria-current="page"]{color:var(--primary)}
.tab svg{display:block}

/* ---------- loading / empty ---------- */
.sk{background:var(--skel);border-radius:10px}
@keyframes shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.sk.pulse{animation:shimmer 1.4s ease-in-out infinite}
.skcard{
  background:var(--raised);border:1px solid var(--bl);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;gap:12px;box-shadow:var(--cardShadow);
}
.skcard.hero{border-radius:24px;min-height:632px;padding:20px;gap:20px}
.emptywrap{
  display:flex;flex-direction:column;gap:16px;padding:32px 20px;
  background:var(--raised);border:1px solid var(--bl);border-radius:24px;
  box-shadow:var(--cardShadow);min-height:420px;justify-content:center;
}
.emptywrap h2{margin:0;font-size:27px;line-height:1.3;font-weight:600;letter-spacing:-.5px}
.emptywrap p{margin:0;font-size:17px;line-height:1.5;color:var(--t2)}

/* ---------- stub tabs ---------- */
.stub{
  display:flex;flex-direction:column;gap:10px;justify-content:center;
  min-height:420px;padding:24px;background:var(--raised);
  border:1px solid var(--bl);border-radius:24px;box-shadow:var(--cardShadow);
}
.stub h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.4px}
.stub p{margin:0;color:var(--t2);font-size:17px;line-height:1.5}

/* ---------- dev toolbar (not part of the design) ---------- */
.devbtn{
  position:fixed;right:12px;bottom:12px;z-index:60;
  width:38px;height:38px;border-radius:19px;border:1px solid rgba(128,128,140,.5);
  background:rgba(120,120,132,.22);backdrop-filter:blur(12px);
  color:#8b8b96;font-size:15px;cursor:pointer;opacity:.5;
  display:flex;align-items:center;justify-content:center;
}
.devbtn:hover{opacity:1}
.devpanel{
  position:fixed;right:12px;bottom:58px;z-index:60;width:224px;
  background:var(--elev);border:1px solid var(--bl);border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.28);padding:12px;display:none;
}
.devpanel.open{display:block}
.devpanel .g{margin-bottom:10px}
.devpanel .g:last-child{margin-bottom:0}
.devpanel label{
  display:block;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--t3);margin-bottom:5px;
}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{
  flex:1 1 auto;min-width:52px;padding:6px 4px;border-radius:7px;font-size:11px;font-weight:600;
  border:1px solid var(--bl);background:var(--raised);color:var(--t2);cursor:pointer;
}
.seg button[data-on="1"]{background:var(--primary);color:#fff;border-color:var(--primary)}
html[data-theme="dark"] .seg button[data-on="1"]{color:#08080A}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.devnote{font-size:10px;color:var(--t3);margin:6px 0 0;line-height:1.35}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone">

    <!-- status bar -->
    <div class="statusbar">
      <span>9:41</span>
      <span class="sb-r" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.2 4.2a11 11 0 0 1 14.6 0"/><path d="M4 6.9a7 7 0 0 1 9 0"/><path d="M6.7 9.5a3 3 0 0 1 3.6 0"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".6" y=".6" width="21" height="10.8" rx="3" stroke="currentColor" stroke-opacity=".45"/><rect x="2.4" y="2.4" width="15.5" height="7.2" rx="1.8" fill="currentColor"/><path d="M23.4 4.2v3.6a2.1 2.1 0 0 0 0-3.6z" fill="currentColor" fill-opacity=".45"/></svg>
      </span>
    </div>

    <!-- header -->
    <div class="hdr"><span class="date" id="hdrDate">Wednesday 29 July</span></div>

    <!-- scrolling content -->
    <div class="scroll" id="scroll">
      <main id="slots"></main>
    </div>

    <!-- tab bar -->
    <nav class="tabbar" id="tabs" aria-label="Main">
      <button class="tab" data-act="tab" data-tab="today" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="4.8" width="17" height="15" rx="4"/><path d="M3.5 9.6h17M8 3.2v3M16 3.2v3"/></svg>
        <span>Today</span>
      </button>
      <button class="tab" data-act="tab" data-tab="live">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3.6l2.2-5.6 3.6 12 2.4-6.4H21"/></svg>
        <span>Live</span>
      </button>
      <button class="tab" data-act="tab" data-tab="explore">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.6"/><path d="M15.7 15.7l4.4 4.4"/></svg>
        <span>Explore</span>
      </button>
      <button class="tab" data-act="tab" data-tab="settings">

        <span>Settings</span>
      </button>
    </nav>

  </div>
</div>

<!-- dev toolbar -->
<button class="devbtn" id="devbtn" aria-label="Prototype controls" aria-expanded="false">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
</button>
<div class="devpanel" id="devpanel">
  <div class="g"><label>Appearance</label><div class="seg" id="segTheme">
    <button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button>
  </div></div>
  <div class="g"><label>Screen state</label><div class="seg" id="segLoad">
    <button data-v="loaded">Loaded</button><button data-v="loading">Loading</button><button data-v="empty">Empty</button>
  </div></div>
  <div class="g"><label>Data available</label><div class="seg" id="segData">
    <button data-v="watch">Watch</button><button data-v="phone">Phone only</button><button data-v="new">Brand new</button>
  </div></div>
  <div class="g"><label>The day</label><div class="seg" id="segDay">
    <button data-v="short">Short sleep</button><button data-v="quiet">Quiet</button><button data-v="attention">Attention</button>
  </div>
  <p class="devnote" id="devnote">Three days: something to fix, nothing to fix, something worth telling you.</p>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   State
   ============================================================ */
var S = {
  theme:"auto", load:"loaded", data:"watch", day:"short",
  plain:false, why:false, remind:false, dismissed:false,
  ctxOpen:false, ctxPick:null, attnOpen:false, tab:"today"
};

function resetTransient(){
  S.why=false; S.remind=false; S.dismissed=false;
  S.ctxOpen=false; S.ctxPick=null; S.attnOpen=false;
}

/* ============================================================
   Fictional user: Alex, 34.
   Sleep need 7h 40m. Usual sleep range 7h 20m to 8h.
   Last night 6h 12m  ->  1h 28m under need.
   Last five nights: 7h03, 6h45, 7h09, 6h51, 6h12  ->  4h 20m short in total.
   Resting heart rate 58 bpm, usual 55, usual range 52 to 58.
   Steps yesterday 8,400, goal 7,000 and up.
   ============================================================ */

var SLEEP_SHORT = [7.8,7.6,8.1,7.5,7.9,7.4,8.0,7.7,7.6,7.05,6.75,7.15,6.85,6.2];
var SLEEP_QUIET = [7.4,7.9,7.6,8.0,7.2,7.8,7.7,8.1,7.6,7.9,7.5,7.8,7.6,7.87];
var RHR_ATTN    = [54,56,55,54,57,55,56,54,55,56,57,60,61,61];
var STEPS_PHONE = [7200,6400,5900,6800,7100,5600,6200,5800,7900,6100,5400,6300,5900,7300];

/* ============================================================
   Content model. Fixed slots, content varies.
   ============================================================ */
function content(){
  var d = S.data, day = (d === "watch") ? S.day : null;

  if (d === "watch" && day === "short") return {
    tone:"short",
    glance:{min:5.8,max:8.6,lo:7.333,hi:8.0,val:6.2,tone:"short",
            alt:"Last night sat below your usual sleep range."},
    line:'Get to bed by <span class="num">10:30</span> tonight.',
    because:'You slept <span class="num">1h 28m</span> under your usual.',
    sure:null,
    reply:{kind:"remind", label:"Remind me", set:"Reminder set for 10pm",
           ack:"Fine. I’ll bring it up again if the run keeps going."},
    why:{
      points:[
        "Bedtime has slipped about 40 minutes later since Sunday.",
        "Your resting heart rate is a touch above your usual. Too small to act on.",
        "Getting to bed at 10:30 puts you back on the sleep you normally need."
      ],
      anchor:"One short night is normal. It only starts to matter when the run keeps going, and this run has.",
      sure:"I’m reading five nights of sleep and two weeks of your heart. That is enough for me to be fairly sure about the sleep."
    },
    attn:{warn:false, head:"Everything else",
          body:"Your heart rate, breathing and temperature all sat in your usual range last night."},
    chart:{head:"Sleep, last 14 nights",
           lead:'Your last five nights all landed under your usual. You’re <span class="num">4h 20m</span> short across them.',
           values:SLEEP_SHORT, lo:7.333, hi:8.0, min:5.6, max:8.6,
           band:"your usual, 7h 20m to 8h", left:"Two weeks ago", right:"Last night",
           tone:"short",
           alt:"Fourteen nights of sleep. The last five all sit below your usual range."},
    move:{head:"Steps yesterday",
          body:'<span class="num">8,400</span> steps, above your goal of <span class="num">7,000</span>.',
          cap:"That goal is the level where most of the health benefit has already arrived.",
          min:0,max:12000,lo:7000,hi:12000,val:8400,tone:"good",band:"your goal",
          alt:"8,400 steps sits inside your goal range."},
    proof:{head:"Earlier nights, so far",
           body:'You’ve gone to bed early <span class="num">6</span> times. Those mornings you slept <span class="num">38 minutes</span> longer than usual. It’s working.'}
  };

  if (d === "watch" && day === "quiet") return {
    tone:"good",
    glance:{min:5.8,max:8.6,lo:7.333,hi:8.0,val:7.87,tone:"good",
            alt:"Last night sat inside your usual sleep range."},
    line:'Carry on. Nothing to change today.',
    because:'You slept <span class="num">7h 52m</span>, right inside your usual.',
    sure:null,

/* ============================================================
   SVG builders
   ============================================================ */
function toneVar(t){
  if (t === "alert") return "var(--bad)";
  if (t === "short") return "var(--warn)";
  if (t === "none")  return "var(--t2)";   /* no verdict yet: neutral, never green */
  return "var(--good)";
}

/* The 0 to 1 second channel: one value, one reference range, position + shape + colour. */
function glanceSVG(g, tall){
  var W = 320, H = tall ? 150 : 74;
  var trackH = tall ? 46 : 26;
  var trackY = tall ? 52 : 22;
  var pad = 6;
  var span = g.max - g.min;
  var x = function(v){ return pad + (W - pad*2) * (Math.min(Math.max(v, g.min), g.max) - g.min) / span; };
  var lo = x(g.lo), hi = x(g.hi), mx = x(g.val);
  var c = toneVar(g.tone);
  var capY = trackY - (tall ? 26 : 14);
  var r = tall ? 9 : 6;
  var cap;
  if (g.tone === "none") {
    cap = '<circle cx="'+mx.toFixed(1)+'" cy="'+capY+'" r="'+(r-1.5)+'" fill="var(--raised)" stroke="'+c+'" stroke-width="3"/>';
  } else if (g.tone === "good") {
    cap = '<circle cx="'+mx.toFixed(1)+'" cy="'+capY+'" r="'+r+'" fill="'+c+'"/>';
  } else if (g.tone === "short") {
    cap = '<rect x="'+(mx-r).toFixed(1)+'" y="'+(capY-r)+'" width="'+(r*2)+'" height="'+(r*2)+'" rx="'+(r*0.42).toFixed(1)+'" fill="'+c+'"/>';
  } else {
    cap = '<path d="M'+mx.toFixed(1)+' '+(capY-r-1)+' L'+(mx+r+1).toFixed(1)+' '+(capY+r*0.85)+' L'+(mx-r-1).toFixed(1)+' '+(capY+r*0.85)+' Z" fill="'+c+'"/>';
  }
  var mw = tall ? 8 : 6;
  var over = tall ? 13 : 7;
  var labelSize = tall ? 13 : 12;
  var bandW = Math.max(hi - lo, 8);
  var labelX = Math.min(Math.max(lo + bandW/2, 44), W - 44);
  var labelY = trackY + trackH + (tall ? 30 : 21);

  var tick = tall ? 7 : 5;
  return ''+
  '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+g.alt+'">'+
    '<rect x="'+pad+'" y="'+trackY+'" width="'+(W-pad*2)+'" height="'+trackH+'" rx="'+(trackH/2.4).toFixed(1)+'" fill="var(--track)"/>'+
    '<rect x="'+lo.toFixed(1)+'" y="'+trackY+'" width="'+bandW.toFixed(1)+'" height="'+trackH+'" fill="var(--bandTint)"/>'+
    '<line x1="'+lo.toFixed(1)+'" y1="'+(trackY-tick)+'" x2="'+lo.toFixed(1)+'" y2="'+(trackY+trackH+tick)+'" stroke="var(--bandStroke)" stroke-width="2"/>'+
    '<line x1="'+(lo+bandW).toFixed(1)+'" y1="'+(trackY-tick)+'" x2="'+(lo+bandW).toFixed(1)+'" y2="'+(trackY+trackH+tick)+'" stroke="var(--bandStroke)" stroke-width="2"/>'+
    '<text x="'+labelX.toFixed(1)+'" y="'+labelY+'" text-anchor="middle" font-size="'+labelSize+'" font-weight="600" fill="var(--t3)" font-family="-apple-system,system-ui,sans-serif">'+(g.band || "your usual")+'</text>'+
    '<rect x="'+(mx - mw/2 - 3).toFixed(1)+'" y="'+(trackY - over - 3)+'" width="'+(mw+6)+'" height="'+(trackH + over*2 + 6)+'" rx="'+((mw+6)/2).toFixed(1)+'" fill="var(--raised)"/>'+
    '<rect x="'+(mx - mw/2).toFixed(1)+'" y="'+(trackY - over)+'" width="'+mw+'" height="'+(trackH + over*2)+'" rx="'+(mw/2)+'" fill="'+c+'"/>'+
    cap+
  '</svg>';
}

/* The chart: dots against the same "your usual" band, stems only where a day fell outside it.
   No bars, so no truncated baseline. No connecting line. */
function stripSVG(ch){
  var W = 320, H = 150, padT = 30, padB = 30, L = 16, R = 16;
  var plotH = H - padT - padB;
  var n = ch.values.length;
  var x = function(i){ return L + (W - L - R) * (n === 1 ? 0.5 : i/(n-1)); };
  var y = function(v){ return padT + plotH * (1 - (v - ch.min)/(ch.max - ch.min)); };
  var yLo = y(ch.lo), yHi = y(Math.min(ch.hi, ch.max));
  var c = toneVar(ch.tone);
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+ch.alt+'">';

  s += '<rect x="0" y="'+yHi.toFixed(1)+'" width="'+W+'" height="'+(yLo-yHi).toFixed(1)+'" fill="var(--bandTint)"/>';
  s += '<line x1="0" y1="'+yLo.toFixed(1)+'" x2="'+W+'" y2="'+yLo.toFixed(1)+'" stroke="var(--bandStroke)" stroke-width="1"/>';
  if (ch.hi < ch.max) s += '<line x1="0" y1="'+yHi.toFixed(1)+'" x2="'+W+'" y2="'+yHi.toFixed(1)+'" stroke="var(--bandStroke)" stroke-width="1"/>';
  s += '<text x="0" y="12" font-size="12" font-weight="600" fill="var(--t3)" font-family="-apple-system,system-ui,sans-serif">'+ch.band+'</text>';

  for (var i=0;i<n;i++){
    var v = ch.values[i];
    var px = x(i);
    if (v === null || v === undefined){
      s += '<line x1="'+px.toFixed(1)+'" y1="'+(padT+plotH-5)+'" x2="'+px.toFixed(1)+'" y2="'+(padT+plotH+3)+'" stroke="var(--bm)" stroke-width="2" stroke-linecap="round" opacity=".5"/>';
      continue;
    }
    var py = y(v);
    var last = (i === n-1);
    var out = (v < ch.lo) || (v > ch.hi);
    var col = last ? c : "var(--t3)";
    var op  = last ? "1" : (out ? ".62" : ".38");
    if (out){
      var edge = (v < ch.lo) ? yLo : yHi;
      s += '<line x1="'+px.toFixed(1)+'" y1="'+edge.toFixed(1)+'" x2="'+px.toFixed(1)+'" y2="'+py.toFixed(1)+'" stroke="'+col+'" stroke-width="2" stroke-linecap="round" opacity="'+(last?".55":".3")+'"/>';
    }
    if (last){
      s += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="8.5" fill="var(--raised)"/>';
      if (ch.tone === "none")
        s += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="4.6" fill="var(--raised)" stroke="'+col+'" stroke-width="2.6"/>';
      else
        s += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="6" fill="'+col+'"/>';
    } else {
      s += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.6" fill="'+col+'" opacity="'+op+'"/>';
    }
  }

  s += '<text x="0" y="'+(H-8)+'" font-size="12" fill="var(--t3)" font-family="-apple-system,system-ui,sans-serif">'+ch.left+'</text>';
  s += '<text x="'+W+'" y="'+(H-8)+'" text-anchor="end" font-size="12" fill="var(--t3)" font-family="-apple-system,system-ui,sans-serif">'+ch.right+'</text>';
  s += '</svg>';
  return s;
}

  for (var i=0;i<c.why.points.length;i++) h += '<li>'+esc(c.why.points[i])+'</li>';
  h += '</ul>';
  h += '<p class="anchor">'+esc(c.why.anchor)+'</p>';

var slots = document.getElementById("slots");

function themeNow(){
  if (S.theme !== "auto") return S.theme;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}

function render(){
  document.documentElement.setAttribute("data-theme", themeNow());

  if (S.tab !== "today"){ slots.innerHTML = stubHTML(S.tab); syncDev(); return; }
  if (S.load === "loading"){ slots.innerHTML = loadingHTML(); syncDev(); return; }
  if (S.load === "empty"){ slots.innerHTML = emptyHTML(); syncDev(); return; }
  if (S.plain){ slots.innerHTML = plainHTML(); syncDev(); return; }

  var c = content();
  slots.innerHTML = heroHTML(c) + attnHTML(c) + chartHTML(c) + moveHTML(c) + proofHTML(c) + footHTML();
  syncDev();
}


function togglePanel(btn, id, open, closedLabel, openLabel){
  var p = document.getElementById(id);
  if (p) p.classList.toggle("open", open);
  btn.setAttribute("aria-expanded", open ? "true" : "false");
  btn.textContent = open ? openLabel : closedLabel;
}

/* ============================================================
   Interaction (event delegation, so every control always works)
   ============================================================ */
document.addEventListener("click", function(e){
  var btn = e.target.closest("[data-act]");
  if (!btn) return;
  var act = btn.getAttribute("data-act");

  if (act === "tab"){
    var t = btn.getAttribute("data-tab");
    S.tab = t;
    document.querySelectorAll("#tabs .tab").forEach(function(b){
      if (b.getAttribute("data-tab") === t) b.setAttribute("aria-current","page");
      else b.removeAttribute("aria-current");
    });
    scroller.scrollTop = 0;
    render(); return;
  }
  if (act === "why"){ S.why = !S.why; togglePanel(btn, "whypanel", S.why, "Why?", "Close"); return; }
  if (act === "attn"){ S.attnOpen = !S.attnOpen; togglePanel(btn, "attnpanel", S.attnOpen, "Show the three signals", "Close"); return; }
  if (act === "remind"){ S.remind = !S.remind; render(); return; }
  if (act === "dismiss"){ S.dismissed = true; S.why = false; S.remind = false; render(); return; }
  if (act === "undismiss"){ S.dismissed = false; render(); return; }
  if (act === "ctx"){ S.ctxOpen = !S.ctxOpen; render(); return; }
  if (act === "ctxpick"){ S.ctxPick = btn.getAttribute("data-v"); S.ctxOpen = false; render(); return; }
  if (act === "ctxclear"){ S.ctxPick = null; render(); return; }
  if (act === "plainon"){ S.plain = true; scroller.scrollTop = 0; render(); return; }
  if (act === "plainoff"){ S.plain = false; scroller.scrollTop = 0; render(); return; }
  if (act === "connect"){ S.load = "loading"; render(); setTimeout(function(){ S.load = "loaded"; render(); }, 1100); return; }
});

/* ============================================================
   Dev toolbar
   ============================================================ */
var devbtn = document.getElementById("devbtn");
var devpanel = document.getElementById("devpanel");
devbtn.addEventListener("click", function(){
  var open = devpanel.classList.toggle("open");
  devbtn.setAttribute("aria-expanded", open ? "true" : "false");
});

function wireSeg(id, key, after){
  var host = document.getElementById(id);
  host.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (!b || b.disabled) return;
    S[key] = b.getAttribute("data-v");
    if (after) after();
    render();
  });
}
wireSeg("segTheme","theme");
wireSeg("segLoad","load", function(){ S.tab = "today"; S.plain = false; resetTransient(); });
wireSeg("segData","data", function(){ S.tab = "today"; S.load = "loaded"; resetTransient(); });
wireSeg("segDay","day", function(){ S.tab = "today"; S.load = "loaded"; S.plain = false; resetTransient(); });

function syncDev(){
  var map = {segTheme:"theme", segLoad:"load", segData:"data", segDay:"day"};
  Object.keys(map).forEach(function(id){
    document.querySelectorAll("#"+id+" button").forEach(function(b){
      b.setAttribute("data-on", b.getAttribute("data-v") === S[map[id]] ? "1" : "0");
    });
  });
  var dayDisabled = (S.data !== "watch");
  document.querySelectorAll("#segDay button").forEach(function(b){ b.disabled = dayDisabled; });
  document.getElementById("devnote").textContent = dayDisabled
    ? "Day variants need watch data. Switch Data available back to Watch."
    : "Three days: something to fix, nothing to fix, something worth telling you.";
}

if (window.matchMedia){
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  var onChange = function(){ if (S.theme === "auto") render(); };
  if (mq.addEventListener) mq.addEventListener("change", onChange);
  else if (mq.addListener) mq.addListener(onChange);
}

render();
</script>
