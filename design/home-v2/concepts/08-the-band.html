<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laso Home v2 — Concept 08 — The Band</title>
<style>
/* ============================================================
   Concept 08 — THE BAND
   Every signal is a position inside your own range.
   No scores. No grades. No failure state.
   Tokens verbatim from design/home-v2/DESIGN-TOKENS.md
   ============================================================ */

:root{
  --sunken:#E4E4EC; --base:#EEEEF4; --raised:#F8F8FB; --elevated:#FCFCFD;
  --overlay:#FEFEFF; --subtle:#EAEAF1;
  --t1:#1B1B20; --t2:#44444D; --t3:#5B5B65;
  --bLow:#E0E0E8; --bMed:#C9C9D3;
  --primary:#0064CC; --accent:#0E7490;
  --ok:#0C7752; --warn:#8A6400; --bad:#C42B33;
  --cardShadow:0 1px 2px rgba(0,0,0,0.12);
  --bandFill:rgba(0,100,204,0.16);
  --bandEdge:rgba(0,100,204,0.36);
  --ink:#1B1B20;
  --skel:linear-gradient(90deg,#E6E6EE 25%,#F1F1F7 37%,#E6E6EE 63%);
}
html[data-theme="dark"]{
  --sunken:#08080A; --base:#0F0F13; --raised:#1B1B21; --elevated:#26262D;
  --overlay:#33333B; --subtle:#17171C;
  --t1:#F2F2F6; --t2:#C9C9D2; --t3:#ADADB8;
  --bLow:#2E2E36; --bMed:#414149;
  --primary:#4DA3FF; --accent:#22D3EE;
  --ok:#3DCC99; --warn:#E3B45A; --bad:#E05C64;
  --cardShadow:none;
  --bandFill:rgba(77,163,255,0.16);
  --bandEdge:rgba(77,163,255,0.38);
  --ink:#F2F2F6;
  --skel:linear-gradient(90deg,#22222A 25%,#2C2C35 37%,#22222A 63%);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--sunken);
  color:var(--t1);
  font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.35;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.num{font-family:ui-rounded,-apple-system,"SF Pro Rounded","SF Pro Text",system-ui,sans-serif;
  font-feature-settings:"tnum" 1; font-variant-numeric:tabular-nums;}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:6px}

/* ---------- phone frame ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:0}
.phone{
  width:100%;max-width:430px;height:100dvh;max-height:932px;
  background:var(--sunken);position:relative;display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:620px){
  body{background:#0d0d10}
  html[data-theme="light"] body{background:#c9c9d3}
  .stage{padding:24px}
  .phone{height:844px;border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08)}
}

/* ---------- status bar ---------- */
.statusbar{
  flex:0 0 auto;height:52px;padding:14px 26px 0;display:flex;align-items:center;
  justify-content:space-between;font-size:15px;font-weight:600;letter-spacing:.2px;
}
.statusbar .icons{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}

/* ---------- header ---------- */
.hdr{
  flex:0 0 auto;padding:2px 12px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
}
.hdr h1{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.05}
.hdr .date{font-size:13px;color:var(--t3);font-weight:500;padding-bottom:3px}

/* ---------- scroll ---------- */
.scroll{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:0 12px calc(96px + env(safe-area-inset-bottom));
  scroll-behavior:smooth;
}
.scroll::-webkit-scrollbar{width:0}

/* fold marker (design aid, hidden by default) */
.fold{position:absolute;left:0;right:0;top:675px;border-top:1px dashed rgba(255,0,0,.5);pointer-events:none;z-index:60;display:none}
.fold::after{content:"fold — 5.4in";position:absolute;right:8px;top:-16px;font-size:10px;color:#C42B33;background:var(--raised);padding:1px 4px;border-radius:3px}
body.showfold .fold{display:block}

/* ---------- cards ---------- */
.card{
  background:var(--raised);border:1px solid var(--bLow);box-shadow:var(--cardShadow);
  border-radius:16px;padding:16px;margin-bottom:12px;
}
.card.hero{border-radius:24px;padding:16px 16px 14px}
html[data-theme="dark"] .card{box-shadow:none}

/* ---------- hero: message ---------- */
.msgRow{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.msgRow .tick{flex:0 0 3px;align-self:stretch;min-height:38px;border-radius:9999px;background:var(--bandEdge)}
.msg{font-size:20px;font-weight:600;letter-spacing:-.3px;line-height:1.25;color:var(--t1)}

/* ---------- hero: attention strip (position 1, never hidden) ---------- */
.attn{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--elevated);border:1px solid var(--bMed);border-left:3px solid var(--warn);
  border-radius:12px;padding:12px 12px 12px 11px;margin-bottom:14px;
}
.attn svg{flex:0 0 20px;margin-top:1px;color:var(--warn)}
.attn .t{font-size:15px;font-weight:600;line-height:1.3;color:var(--t1)}
.attn .a{font-size:13px;color:var(--t2);margin-top:5px;line-height:1.35}

/* ---------- hero: bars ---------- */
.bars{display:flex;flex-direction:column;gap:16px}
.bar .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.bar .lab{font-size:15px;font-weight:600;letter-spacing:-.1px;color:var(--t1)}
.bar .val{font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--t1);white-space:nowrap}
.bar .val .pos{font-size:13px;font-weight:600;color:var(--t3);margin-left:6px;letter-spacing:0}

.track{
  position:relative;height:14px;border-radius:9999px;background:var(--subtle);
  border:1px solid var(--bLow);overflow:visible;
}
.band{
  position:absolute;top:-1px;bottom:-1px;border-radius:9999px;
  background:var(--bandFill);border:1px solid var(--bandEdge);
  transition:left 420ms cubic-bezier(.22,1,.36,1),width 420ms cubic-bezier(.22,1,.36,1);
}
.band.provisional{border-style:dashed;background:none}
.mark{
  position:absolute;top:50%;width:14px;height:14px;border-radius:9999px;
  background:var(--ink);border:2px solid var(--raised);
  transform:translate(-50%,-50%);
  left:50%;
  transition:left 520ms cubic-bezier(.22,1,.36,1);
  box-shadow:0 0 0 0 var(--bandEdge);
}
.mark.past{width:9px;height:9px;opacity:.42;border-width:1px}
.mark.today{animation:settle 900ms ease-out 1}
@keyframes settle{
  0%{box-shadow:0 0 0 0 var(--bandEdge)}
  45%{box-shadow:0 0 0 7px var(--bandEdge)}
  100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}
}
.bar .clause{font-size:13px;color:var(--t2);margin-top:8px;line-height:1.3}

.legend{display:flex;align-items:center;gap:7px;margin-top:16px;padding-top:12px;border-top:1px solid var(--bLow);
  font-size:12px;color:var(--t3)}
.legend .sw{width:22px;height:10px;border-radius:9999px;background:var(--bandFill);border:1px solid var(--bandEdge)}
.stateNote{font-size:12px;color:var(--t3);margin-top:8px;line-height:1.35}

/* ---------- today card ---------- */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
.todaySentence{font-size:20px;font-weight:600;letter-spacing:-.3px;line-height:1.3}
.todayWhy{font-size:13px;color:var(--t2);margin-top:8px;line-height:1.35}
.btn{
  margin-top:14px;width:100%;min-height:48px;border-radius:12px;
  background:var(--primary);color:#fff;font-size:17px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform 80ms ease-in,opacity 120ms linear;
}
html[data-theme="dark"] .btn{color:#04121F}
.btn:active{transform:scale(.975);transition:transform 80ms ease-in}
.btn.done{background:var(--subtle);color:var(--t2);border:1px solid var(--bMed)}
html[data-theme="dark"] .btn.done{color:var(--t2)}

/* ---------- chart card ---------- */
.chartHead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px}
.chartTitle{font-size:17px;font-weight:600;letter-spacing:-.2px}
.chartSub{font-size:13px;color:var(--t2);margin-bottom:12px;line-height:1.35}
.chartWrap{margin:0 -2px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.axisTxt{font-size:11px;fill:var(--t3);font-family:ui-rounded,-apple-system,system-ui,sans-serif}
.dot{fill:var(--ink);opacity:.34}
.dot.last{opacity:1}
.chartFoot{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--t3)}

.ghost{
  margin-top:14px;width:100%;min-height:44px;border-radius:12px;border:1px solid var(--bMed);
  background:var(--elevated);color:var(--t1);font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform 80ms ease-in;
}
.ghost:active{transform:scale(.975)}

.disc{margin-top:12px;border-top:1px solid var(--bLow);padding-top:4px}
.discBtn{
  width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:15px;font-weight:600;color:var(--t1);
}
.discBtn .chev{transition:transform 250ms cubic-bezier(.22,1,.36,1);color:var(--t3);display:flex}
.discBtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.discPanel{overflow:hidden;max-height:0;transition:max-height 300ms cubic-bezier(.22,1,.36,1),opacity 200ms linear;opacity:0}
.discPanel.open{max-height:720px;opacity:1}
.discPanel dl{padding:4px 0 8px;display:flex;flex-direction:column;gap:10px}
.discPanel dt{font-size:13px;font-weight:700;color:var(--t1)}
.discPanel dd{font-size:13px;color:var(--t2);line-height:1.4;margin-top:2px}

/* ---------- escape hatch ---------- */
.raw{
  width:100%;min-height:52px;border-radius:16px;background:var(--raised);
  border:1px solid var(--bLow);box-shadow:var(--cardShadow);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;margin-bottom:12px;transition:transform 80ms ease-in;
}
html[data-theme="dark"] .raw{box-shadow:none}
.raw:active{transform:scale(.99)}
.raw .rl{text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.raw .rt{display:block;font-size:15px;font-weight:600;line-height:1.25}
.raw .rs{display:block;font-size:12px;color:var(--t3);line-height:1.3}
.raw svg{color:var(--t3);flex:0 0 auto}

.footNote{font-size:12px;color:var(--t3);text-align:left;padding:2px 4px 8px}

/* ---------- raw mode ---------- */
.rawList{display:flex;flex-direction:column}
.rawRow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bLow)}
.rawRow:last-child{border-bottom:none}
.rawRow .k{font-size:15px;color:var(--t2)}
.rawRow .v{font-size:17px;font-weight:600}
.rawSeries{font-size:13px;color:var(--t2);line-height:1.7;word-spacing:2px;padding-top:10px}

/* ---------- skeleton ---------- */
.sk{display:block;background:var(--skel);background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skLine{height:14px;margin-bottom:10px}
.skTrack{height:14px;border-radius:9999px;margin:8px 0 10px}

/* ---------- empty ---------- */
.emptyTrack{position:relative;height:14px;border-radius:9999px;background:var(--subtle);border:1px dashed var(--bMed)}
.emptyBand{position:absolute;left:34%;width:32%;top:-1px;bottom:-1px;border-radius:9999px;border:1px dashed var(--bMed)}

/* ---------- tab bar ---------- */
.tabs{
  flex:0 0 auto;position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));
  height:64px;border-radius:24px;display:flex;align-items:stretch;
  background:color-mix(in srgb, var(--raised) 78%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--bLow);
  box-shadow:0 6px 24px rgba(0,0,0,.10);
}
html[data-theme="dark"] .tabs{box-shadow:0 6px 24px rgba(0,0,0,.5)}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--t3);border-radius:20px;min-height:44px;
  transition:transform 80ms ease-in,color 160ms linear;
}
.tab:active{transform:scale(.94)}
.tab[aria-current="page"]{color:var(--primary)}
.tab svg{display:block}

/* ---------- dev toolbar ---------- */
/* Deliberately parked on the right edge, clear of every real control. */
.devBtn{
  position:fixed;right:0;top:112px;z-index:80;
  width:22px;height:44px;border-radius:12px 0 0 12px;background:var(--overlay);
  border:1px solid var(--bMed);border-right:none;
  color:var(--t3);display:flex;align-items:center;justify-content:center;opacity:.34;
  box-shadow:-2px 2px 10px rgba(0,0,0,.12);
}
.devBtn svg{width:14px;height:14px}
.devBtn:hover,.devBtn[aria-expanded="true"]{opacity:1}
.devPanel{
  position:fixed;right:8px;top:160px;z-index:81;
  width:230px;background:var(--overlay);border:1px solid var(--bMed);border-radius:16px;
  padding:12px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.3);font-size:12px;
}
@media (min-width:620px){
  .devBtn{right:calc(50% - 215px - 46px);top:140px;width:44px;border-radius:12px;border-right:1px solid var(--bMed);opacity:.55}
  .devBtn svg{width:20px;height:20px}
  .devPanel{right:calc(50% - 215px - 296px);top:140px}
}
.devPanel.open{display:block}
.devPanel h3{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin:10px 0 5px;font-weight:700}
.devPanel h3:first-child{margin-top:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{
  flex:1 1 auto;min-height:30px;padding:5px 8px;border-radius:8px;border:1px solid var(--bLow);
  background:var(--raised);color:var(--t2);font-size:11px;font-weight:600;white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
html[data-theme="dark"] .seg button[aria-pressed="true"]{color:#04121F}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>

<div class="stage">
  <div class="phone">

    <!-- status bar -->
    <div class="statusbar">
      <span class="num">9:41</span>
      <span class="icons" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.2 6.2 9.3a2.6 2.6 0 0 1 3.6 0L8 11.2Zm0-4.4a5 5 0 0 0-3.6 1.5L3 6.9a7 7 0 0 1 10 0l-1.4 1.4A5 5 0 0 0 8 6.8Zm0-4.3a9.3 9.3 0 0 0-6.6 2.7L0 3.8a11.3 11.3 0 0 1 16 0l-1.4 1.4A9.3 9.3 0 0 0 8 2.5Z"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3.2" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><path d="M24 4.2v3.6a2 2 0 0 0 0-3.6Z" fill="currentColor" opacity=".45"/></svg>
      </span>
    </div>

    <!-- header -->
    <div class="hdr">
      <h1>Today</h1>
      <span class="date">Tuesday, 29 July</span>
    </div>

    <main class="scroll" id="scroll"></main>
    <div class="fold" aria-hidden="true"></div>

    <!-- tab bar -->
    <nav class="tabs" aria-label="Main">
      <button class="tab" aria-current="page" data-tab="Today">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="4"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4"/><circle cx="12" cy="15" r="2.1" fill="currentColor" stroke="none"/></svg>

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12h4l2-5 3.5 10 2.5-6 1.8 3h5.2"/></svg>
        Live
      </button>
      <button class="tab" data-tab="Explore">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.4 8.6 13.6 13.6 8.6 15.4 10.4 10.4Z"/></svg>
        Explore

      <button class="tab" data-tab="Settings">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.3 14.6a1.6 1.6 0 0 0 .32 1.77l.06.06a1.95 1.95 0 1 1-2.76 2.76l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47v.17a1.95 1.95 0 1 1-3.9 0v-.09a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a1.95 1.95 0 1 1-2.76-2.76l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97h-.17a1.95 1.95 0 1 1 0-3.9h.09a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a1.95 1.95 0 1 1 2.76-2.76l.06.06a1.6 1.6 0 0 0 1.77.32h.08a1.6 1.6 0 0 0 .97-1.47v-.17a1.95 1.95 0 1 1 3.9 0v.09a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a1.95 1.95 0 1 1 2.76 2.76l-.06.06a1.6 1.6 0 0 0-.32 1.77v.08a1.6 1.6 0 0 0 1.47.97h.17a1.95 1.95 0 1 1 0 3.9h-.09a1.6 1.6 0 0 0-1.47.97Z"/></svg>
        Settings
      </button>
    </nav>

  </div>
</div>

<!-- dev toolbar (not part of the design under judgement) -->
<button class="devBtn" id="devBtn" aria-label="Prototype controls" aria-expanded="false">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg>
</button>
<div class="devPanel" id="devPanel" role="group" aria-label="Prototype controls">
  <h3>Appearance</h3>
  <div class="seg" data-group="theme">
    <button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button>
  </div>
  <h3>Data available</h3>
  <div class="seg" data-group="data">
    <button data-v="full">Watch</button><button data-v="phone">Phone only</button><button data-v="new">New user</button>
  </div>
  <h3>Screen</h3>
  <div class="seg" data-group="screen">
    <button data-v="loaded">Loaded</button><button data-v="loading">Loading</button><button data-v="empty">Empty</button>
  </div>
  <h3>Today looks like</h3>
  <div class="seg" data-group="day">
    <button data-v="short">Short night</button><button data-v="rested">Rested</button><button data-v="attention">Worth a look</button>
  </div>
  <h3>Design aid</h3>
  <div class="seg" data-group="fold">
    <button data-v="off">Fold off</button><button data-v="on">Show fold</button>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   1. STATE
   ============================================================ */
const S = {
  theme:"auto", data:"full", screen:"loaded", day:"short",
  raw:false, chartIdx:0, discOpen:false, actionDone:false, fold:false
};

/* ============================================================
   2. FORMATTERS — borrowed units only. No index anywhere.
   ============================================================ */
const F = {
  sleep : h => Math.floor(h) + "h " + String(Math.round((h - Math.floor(h)) * 60)).padStart(2,"0") + "m",
  steps : n => n.toLocaleString("en-GB"),
  bed   : m => {                       // minutes past 22:00
            let t = (22*60 + m) % 1440;
            let hh = Math.floor(t/60), mm = t % 60;
            const ap = hh < 12 ? "am" : "pm";
            let h12 = hh % 12; if (h12 === 0) h12 = 12;
            return h12 + ":" + String(mm).padStart(2,"0") + " " + ap;
          },
  rhr   : n => n + " bpm",
  dist  : k => k.toFixed(1) + " km",
  stair : n => n + (n === 1 ? " flight" : " flights"),
  pace  : k => k.toFixed(1) + " km/h",
  hrv   : n => n + " ms"
};

/* position word — derived from the value and the band, never hard-coded */
function posWord(v, band, key){
  if (v < band[0]) return key === "bedtime" ? "earlier" : "under";
  if (v > band[1]) return key === "bedtime" ? "later"   : "above";
  return "inside";
}

/* ============================================================
   3. GEOMETRY — the single uncertainty mechanism.
      Every band is drawn in the SAME place on every bar, so the
      column of markers is readable with no text at all.
      Lower confidence => the band is drawn WIDER. That is the
      only confidence widget on this screen.
   ============================================================ */
const BAND_HALF = { full:16, phone:24, new:36 };   // % either side of centre

function markX(v, band, half){
  const t  = (v - band[0]) / (band[1] - band[0]);   // 0..1 inside the band
  const tc = t - 0.5;                                // centred
  let x;
  if (Math.abs(tc) <= 0.5) {
    x = 50 + tc * 2 * half;
  } else {
    const over = Math.abs(tc) - 0.5;
    x = 50 + Math.sign(tc) * (half + over * 2 * half * 0.55);
  }
  return Math.max(7, Math.min(93, x));
}

/* ============================================================
   4. DATA — one fictional user, Alex, 34. Every number below is
      consistent with every other number, and with the 14-day series.
      Sleep need 7h 40m -> the sleep range is 7h 15m to 8h 05m.
   ============================================================ */
const SERIES = {
  full:{
    sleep  :{ band:[7.25, 8.083], v:[7.9,7.6,8.0,7.4,7.7,7.3,7.9,7.1,7.5,7.2,6.8,7.0,6.85,6.20], fmt:F.sleep, name:"Sleep",              first:"two weeks ago", last:"last night" },
    steps  :{ band:[6200, 11000], v:[7100,9200,6800,11400,8100,5900,10200,7600,12800,8900,6400,9700,7300,8400], fmt:F.steps, name:"Steps", first:"two weeks ago", last:"yesterday" },
    bedtime:{ band:[100, 135],    v:[98,105,92,118,101,110,96,125,132,119,140,128,145,155], fmt:F.bed, name:"Bedtime",                    first:"two weeks ago", last:"last night" },
    rhr    :{ band:[53, 57],      v:[55,54,56,55,57,54,55,56,54,56,55,57,56,58], fmt:F.rhr, name:"Resting heart rate",                    first:"two weeks ago", last:"this morning" }
  },
  phone:{
    steps  :{ band:[6200, 11000], v:[7100,9200,6800,11400,8100,5900,10200,7600,12800,8900,6400,9700,7300,8400], fmt:F.steps, name:"Steps", first:"two weeks ago", last:"yesterday" },
    dist   :{ band:[4.4, 8.2],    v:[5.2,6.8,4.9,8.4,6.0,4.3,7.5,5.6,9.4,6.6,4.7,7.1,5.4,6.1], fmt:F.dist, name:"Distance",              first:"two weeks ago", last:"yesterday" },
    stairs :{ band:[5, 16],       v:[8,12,6,15,9,4,13,7,17,10,5,11,6,3], fmt:F.stair, name:"Stairs",                                      first:"two weeks ago", last:"yesterday" },
    pace   :{ band:[4.2, 5.0],    v:[4.7,4.5,4.8,4.6,4.4,4.9,4.6,4.5,4.7,4.4,4.8,4.6,4.5,4.6], fmt:F.pace, name:"Walking pace",           first:"two weeks ago", last:"yesterday" }
  },
  new:{
    sleep  :{ band:[5.5, 9.0],    v:[7.1,6.6,6.9], fmt:F.sleep, name:"Sleep",                    first:"day one", last:"last night" },
    steps  :{ band:[3500, 13500], v:[6100,8300,7200], fmt:F.steps, name:"Steps",                  first:"day one", last:"yesterday" },
    bedtime:{ band:[70, 190],     v:[120,142,130], fmt:F.bed, name:"Bedtime",                     first:"day one", last:"last night" },
    rhr    :{ band:[48, 64],      v:[57,55,56], fmt:F.rhr, name:"Resting heart rate",             first:"day one", last:"this morning" }
  }
};

/* the three days, for the full-data state. Each overrides the last
   point of the relevant series so nothing on screen can disagree. */
const DAYS = {
  short:{
    message:"Short night. You showed up.",
    values:{ sleep:6.20, steps:8400, bedtime:155, rhr:58 },
    clauses:{ sleep:"by about an hour", steps:"an ordinary day", bedtime:"later all week", rhr:"one morning only" },
    tail:{ sleep:[7.0,6.85,6.20], steps:[9700,7300,8400], bedtime:[128,145,155], rhr:[57,56,58] },
    today:{ line:"Keep today easy. A walk is plenty.", why:"Because sleep ran under your range.", cta:"That works", ack:"Noted. Rest counts." },
    attn:null
  },
  rested:{
    message:"Everything landed inside your range.",
    values:{ sleep:7.60, steps:9700, bedtime:118, rhr:55 },
    clauses:{ sleep:"a full tank", steps:"a solid day", bedtime:"back on your usual", rhr:"nothing unusual" },
    tail:{ sleep:[7.0,7.2,7.60], steps:[6400,8100,9700], bedtime:[124,121,118], rhr:[56,55,55] },
    today:{ line:"Room for a harder session if you want one.", why:"Because every reading sat inside your range.", cta:"Good to know", ack:"Noted. Enjoy it." },
    attn:null
  },
  attention:{
    message:"Something has repeated. Read this first.",
    values:{ sleep:6.00, steps:5100, bedtime:160, rhr:62 },
    clauses:{ sleep:"third short night", steps:"quieter than usual", bedtime:"later all week", rhr:"three mornings running" },
    tail:{ sleep:[6.4,6.1,6.0], steps:[6300,5600,5100], bedtime:[148,152,160], rhr:[59,61,62] },
    today:{ line:"Keep today light and look again tomorrow.", why:"Because three readings moved together for three days.", cta:"That works", ack:"Noted. Rest counts." },
    attn:{
      title:"Resting heart rate has sat above your range for three mornings, with shorter sleep.",
      anchor:"This is not an emergency. If it carries on, or you feel unwell, speak to a doctor."
    },
    extraMarks:{ rhr:[59,61], sleep:[6.4,6.1] }
  }
};

/* iPhone-only and new-user states get their own single day. */
const ALT = {
  phone:{
    message:"Phone only. Wider bands, same idea.",
    values:{ steps:8400, dist:6.1, stairs:3, pace:4.6 },
    clauses:{ steps:"an ordinary day", dist:"usual ground covered", stairs:"plenty left over", pace:"steady on your feet" },
    note:"Bands are wider because your phone alone reads fewer signals. Sleep and heart rate need a wearable, so they are not shown.",
    today:{ line:"A walk after lunch would sit right.", why:"Because stairs came in under your range.", cta:"That works", ack:"Noted. Rest counts." }
  },
  new:{
    message:"Day three. Your ranges are still wide.",
    values:{ sleep:6.9, steps:7200, bedtime:130, rhr:56 },
    clauses:{ sleep:"still learning it", steps:"still learning it", bedtime:"still learning it", rhr:"still learning it" },
    note:"Three days recorded. Bands are drawn at their widest and narrow from day seven, once there is enough of your own history to draw them properly.",
    today:{ line:"Keep recording. Your ranges arrive on day seven.", why:"Because three days cannot show your usual.", cta:"Got it", ack:"Noted." }
  }
};

const BAR_ORDER = {
  full : ["sleep","steps","bedtime","rhr"],
  phone: ["steps","dist","stairs","pace"],
  new  : ["sleep","steps","bedtime","rhr"]
};

/* ============================================================
   5. BUILD the bar models for the current state
   ============================================================ */
function currentDay(){
  if (S.data === "full") return DAYS[S.day];
  return ALT[S.data];
}

function buildBars(){
  const day  = currentDay();
  const half = BAND_HALF[S.data];
  return BAR_ORDER[S.data].map(key => {
    const s = SERIES[S.data][key];
    const v = day.values[key];
    const extras = (day.extraMarks && day.extraMarks[key]) || [];
    return {
      key,
      label : s.name,
      value : v,
      text  : s.fmt(v),
      band  : s.band,
      pos   : posWord(v, s.band, key),
      clause: day.clauses[key],
      x     : markX(v, s.band, half),
      xs    : extras.map(e => markX(e, s.band, half)),
      half
    };
  });
}

/* the 14-day series for the chart, with its last points swapped to
   match today so the chart can never contradict the bars */
function chartSeries(key){
  const s = SERIES[S.data][key];
  const v = s.v.slice();
  const day = currentDay();
  if (S.data === "full"){
    const t = DAYS[S.day].tail[key];
    v.splice(v.length - t.length, t.length, ...t);
  } else if (day.values[key] !== undefined){
    v[v.length - 1] = day.values[key];
  }
  return Object.assign({}, s, { v });
}

/* ============================================================
   6. RENDER PIECES
   ============================================================ */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function barHTML(b, i){
  const left  = (50 - b.half) + "%";
  const width = (b.half * 2) + "%";
  const prov  = S.data === "new" ? " provisional" : "";
  const past  = b.xs.map(x => `<span class="mark past" style="left:${x}%"></span>`).join("");
  return `
  <div class="bar">
    <div class="top">
      <span class="lab">${esc(b.label)}</span>
      <span class="val num">${esc(b.text)}<span class="pos">${esc(b.pos)}</span></span>
    </div>
    <div class="track" role="img" aria-label="${esc(b.label)} ${esc(b.text)}, ${esc(b.pos)} your range">
      <span class="band${prov}" style="left:${left};width:${width}"></span>
      ${past}
      <span class="mark today" data-x="${b.x}" style="--i:${i}"></span>
    </div>
    <p class="clause">${esc(b.clause)}</p>
  </div>`;
}

function heroHTML(){
  const day  = currentDay();
  const bars = buildBars();
  const attn = (S.data === "full" && DAYS[S.day].attn) ? DAYS[S.day].attn : null;
  return `
  <section class="card hero" aria-labelledby="heroMsg">
    ${attn ? `
    <div class="attn" role="note">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.6v5.2M12 16.4h.01"/></svg>
      <div>
        <p class="t">${esc(attn.title)}</p>
        <p class="a">${esc(attn.anchor)}</p>
      </div>
    </div>` : ""}
    <div class="msgRow">
      <span class="tick" aria-hidden="true"></span>
      <p class="msg" id="heroMsg">${esc(day.message)}</p>
    </div>
    <div class="bars">${bars.map(barHTML).join("")}</div>
    <div class="legend"><span class="sw" aria-hidden="true"></span> your range</div>
    ${day.note ? `<p class="stateNote">${esc(day.note)}</p>` : ""}
  </section>`;
}

function todayHTML(){
  const t = currentDay().today;
  return `
  <section class="card" aria-labelledby="todayHead">
    <p class="eyebrow" id="todayHead">Today</p>
    <p class="todaySentence">${esc(t.line)}</p>
    <p class="todayWhy">${esc(t.why)}</p>
    <button class="btn${S.actionDone ? " done" : ""}" data-act="action">
      ${S.actionDone
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>${esc(t.ack)}`
        : esc(t.cta)}
    </button>
  </section>`;
}

function chartHTML(){
  const keys = BAR_ORDER[S.data];
  const key  = keys[S.chartIdx % keys.length];
  const nextKey = keys[(S.chartIdx + 1) % keys.length];
  const s = chartSeries(key);
  const n = s.v.length;

  const W = 320, H = 116, padL = 58, padR = 6, padT = 12, padB = 22;
  const lo = Math.min(...s.v, s.band[0]);
  const hi = Math.max(...s.v, s.band[1]);
  const pad = (hi - lo) * 0.16 || 1;
  const min = lo - pad, max = hi + pad;
  const y = v => padT + (max - v) / (max - min) * (H - padT - padB);
  const x = i => padL + (n === 1 ? 0 : i * (W - padL - padR) / (n - 1));

  const bandTop = y(s.band[1]), bandBot = y(s.band[0]);
  const dots = s.v.map((v,i) =>
    `<circle class="dot${i === n-1 ? " last" : ""}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === n-1 ? 4.6 : 3.4}"/>`
  ).join("");

  const title = S.data === "new" ? "Your first three days" : "Your last 14 days";
  const sub   = `${s.name} against your range. Each dot is one day.`;

  return `
  <section class="card" aria-labelledby="chartHead">
    <div class="chartHead"><h2 class="chartTitle" id="chartHead">${esc(title)}</h2></div>
    <p class="chartSub">${esc(sub)}</p>
    <div class="chartWrap">
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
           aria-label="${esc(s.name)} for the last ${n} days. Your range is ${esc(s.fmt(s.band[0]))} to ${esc(s.fmt(s.band[1]))}. Latest reading ${esc(s.fmt(s.v[n-1]))}.">
        <rect x="${padL}" y="${bandTop.toFixed(1)}" width="${W-padL-padR}" height="${Math.max(2,(bandBot-bandTop)).toFixed(1)}"
              rx="7" fill="var(--bandFill)" stroke="var(--bandEdge)" stroke-width="1"${S.data==="new"?' stroke-dasharray="4 3"':""}/>
        <text class="axisTxt" x="0" y="${(bandTop+4).toFixed(1)}">${esc(s.fmt(s.band[1]))}</text>
        <text class="axisTxt" x="0" y="${(bandBot+4).toFixed(1)}">${esc(s.fmt(s.band[0]))}</text>
        ${dots}
        <text class="axisTxt" x="${padL}" y="${H-6}">${esc(s.first)}</text>
        <text class="axisTxt" x="${W-padR}" y="${H-6}" text-anchor="end">${esc(s.last)}</text>
      </svg>
    </div>
    <button class="ghost" data-act="cycle">Show ${esc(SERIES[S.data][nextKey].name.toLowerCase())}</button>

    <div class="disc">
      <button class="discBtn" data-act="disc" aria-expanded="${S.discOpen}" aria-controls="discPanel">
        How your range is built
        <span class="chev" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
      </button>
      <div class="discPanel${S.discOpen ? " open" : ""}" id="discPanel">
        <dl>
          <div><dt>Where the band comes from</dt><dd>Your own last 14 days, and nobody else's. Sleep uses the amount your own nights say you need; the rest use the middle of your own recent readings.</dd></div>
          <div><dt>Why the band is this wide</dt><dd>Width is the only confidence signal on this screen. The more of your own history there is, the narrower it gets. With a phone alone, or in your first week, it is drawn wider on purpose.</dd></div>
          <div><dt>Why there is no score</dt><dd>A single number for a whole body has never been checked against how people actually feel. Hours, steps, a clock time and beats per minute are units you already own.</dd></div>
          <div><dt>Below the band</dt><dd>Below is not a fail. For movement it means capacity you have not spent. For sleep it means less in reserve, which is why today's suggestion gets lighter, not harder.</dd></div>
        </dl>
      </div>
    </div>
  </section>`;
}

function rawHTML(){
  const day  = currentDay();
  const keys = BAR_ORDER[S.data];
  const rows = keys.map(k => {
    const s = SERIES[S.data][k];
    return `<div class="rawRow"><span class="k">${esc(s.name)}</span><span class="v num">${esc(s.fmt(day.values[k]))}</span></div>`;
  }).join("");
  const sleep14 = S.data === "full" ? chartSeries("sleep").v : null;
  const extra = sleep14
    ? `<div class="rawRow"><span class="k">Heart rate variability</span><span class="v num">48 ms</span></div>
       <div class="rawRow"><span class="k">Sleep, 14-night average</span><span class="v num">${esc(F.sleep(sleep14.reduce((a,b)=>a+b,0)/sleep14.length))}</span></div>`
    : "";
  const s14 = chartSeries(keys[0]);
  return `
  <section class="card">
    <p class="eyebrow">Raw readings</p>
    <div class="rawList">${rows}${extra}</div>
  </section>
  <section class="card">
    <p class="eyebrow">${esc(SERIES[S.data][keys[0]].name)}, day by day</p>
    <p class="rawSeries num">${s14.v.map(v => esc(s14.fmt(v))).join("  ·  ")}</p>
  </section>
  <button class="raw" data-act="raw">
    <span class="rl"><span class="rt">Bring the ranges back</span><span class="rs">Show positions, words and today's suggestion again</span></span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <p class="footNote">Nothing here is judged. These are the numbers as recorded.</p>`;
}

function loadingHTML(){
  const rows = [0,1,2,3].map(() => `
    <div class="bar">
      <div class="top"><span class="sk skLine" style="width:34%"></span><span class="sk skLine" style="width:26%"></span></div>
      <div class="sk skTrack"></div>
      <span class="sk skLine" style="width:48%;height:11px"></span>
    </div>`).join("");
  return `
  <section class="card hero">
    <div class="msgRow"><span class="tick" aria-hidden="true"></span><span class="sk skLine" style="width:70%;height:18px;margin-top:4px"></span></div>
    <div class="bars">${rows}</div>
    <div class="legend"><span class="sw" aria-hidden="true"></span> reading your last 14 days</div>
  </section>
  <section class="card">
    <p class="eyebrow">Today</p>
    <span class="sk skLine" style="width:82%;height:18px"></span>
    <span class="sk skLine" style="width:56%;height:12px"></span>
  </section>
  <p class="footNote">Reading your last 14 days.</p>`;
}

function emptyHTML(){
  const labels = ["Sleep","Steps","Bedtime","Resting heart rate"];
  const rows = labels.map(l => `
    <div class="bar">
      <div class="top"><span class="lab">${esc(l)}</span><span class="val num" style="color:var(--t3);font-size:15px;font-weight:600">not yet</span></div>
      <div class="emptyTrack"><span class="emptyBand"></span></div>
      <p class="clause">waiting for data</p>
    </div>`).join("");
  return `
  <section class="card hero">
    <div class="msgRow"><span class="tick" aria-hidden="true"></span><p class="msg">Nothing to read yet. The shapes are ready.</p></div>
    <div class="bars">${rows}</div>
    <div class="legend"><span class="sw" aria-hidden="true"></span> your range, once there is one</div>
  </section>
  <section class="card">
    <p class="eyebrow">Today</p>
    <p class="todaySentence">Connect Apple Health to fill the first band.</p>
    <p class="todayWhy">Steps and distance arrive the same day. The rest follow.</p>
    <button class="btn" data-act="connect">Connect Apple Health</button>
  </section>
  <p class="footNote">No data is sent anywhere. Everything is read on this phone.</p>`;
}

function normalHTML(){
  return heroHTML() + todayHTML() + chartHTML() + `
  <button class="raw" data-act="raw">
    <span class="rl"><span class="rt">Just the numbers</span><span class="rs">Turn off ranges and words. Nothing gets judged.</span></span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <p class="footNote">Updated just now.</p>`;
}

/* ============================================================
   7. RENDER
   ============================================================ */
const scroll = document.getElementById("scroll");
let lastAnimKey = null;

function render(){
  if (S.screen === "loading")      scroll.innerHTML = loadingHTML();
  else if (S.screen === "empty")   scroll.innerHTML = emptyHTML();
  else if (S.raw)                  scroll.innerHTML = rawHTML();
  else                             scroll.innerHTML = normalHTML();

  // Markers settle from the centre of the band into position, but only when
  // the underlying reading actually changed. Expanding a section or pressing a
  // button must not make the whole screen move again.
  const key = [S.screen, S.data, S.day, S.raw].join("|");
  const animate = key !== lastAnimKey;
  lastAnimKey = key;

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  scroll.querySelectorAll(".mark.today[data-x]").forEach(m => {
    const x = m.getAttribute("data-x") + "%";
    if (reduce || !animate) { m.style.transition = "none"; m.style.left = x; return; }
    requestAnimationFrame(() => {
      setTimeout(() => { m.style.left = x; }, 60 + Number(m.style.getPropertyValue("--i") || 0) * 70);
    });
  });
}

/* ============================================================
   8. EVENTS — one delegated handler, so nothing can lose a binding
   ============================================================ */
scroll.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");

  if (act === "action"){
    S.actionDone = !S.actionDone;
    render();
  }
  else if (act === "cycle"){
    S.chartIdx = (S.chartIdx + 1) % BAR_ORDER[S.data].length;
    render();
  }
  else if (act === "disc"){
    S.discOpen = !S.discOpen;
    render();
    const btn = scroll.querySelector('[data-act="disc"]');
    if (btn) btn.focus();
  }
  else if (act === "raw"){
    S.raw = !S.raw;
    render();
    scroll.scrollTop = 0;
  }
  else if (act === "connect"){
    S.screen = "loading";
    syncDev();
    render();
    setTimeout(() => { S.screen = "loaded"; syncDev(); render(); }, 1400);
  }
});

/* tab bar */
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(o => o.removeAttribute("aria-current"));
    t.setAttribute("aria-current","page");
  });
});

/* ============================================================
   9. THEME + DEV TOOLBAR
   ============================================================ */
const mq = window.matchMedia("(prefers-color-scheme: dark)");
function applyTheme(){
  const t = S.theme === "auto" ? (mq.matches ? "dark" : "light") : S.theme;
  document.documentElement.setAttribute("data-theme", t);
}
mq.addEventListener("change", () => { if (S.theme === "auto") applyTheme(); });

const devBtn = document.getElementById("devBtn");
const devPanel = document.getElementById("devPanel");
devBtn.addEventListener("click", () => {
  const open = devPanel.classList.toggle("open");
  devBtn.setAttribute("aria-expanded", String(open));
});

function syncDev(){
  document.querySelectorAll(".devPanel .seg").forEach(seg => {
    const g = seg.getAttribute("data-group");
    const cur = g === "fold" ? (S.fold ? "on" : "off") : S[g];
    seg.querySelectorAll("button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === cur)));
  });
}

document.querySelectorAll(".devPanel .seg button").forEach(b => {
  b.addEventListener("click", () => {
    const g = b.parentElement.getAttribute("data-group");
    const v = b.getAttribute("data-v");
    if (g === "fold"){
      S.fold = (v === "on");
      document.body.classList.toggle("showfold", S.fold);
    } else {
      S[g] = v;
      if (g === "theme") applyTheme();
      if (g === "data"){ S.chartIdx = 0; S.actionDone = false; }
      if (g === "day"){ S.actionDone = false; }
    }
    syncDev();
    render();
  });
});

applyTheme();
syncDev();
render();
</script>
</body>
</html>
