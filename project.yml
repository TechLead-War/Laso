name: Laso
options:
  bundleIdPrefix: com.lasohealth
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  HealthPulse:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "README.md"
          - "*.xcodeproj"
          - "admin-panel"
          - "build"
          - ".git"
          - ".claude"
          - "node_modules"
          - "*.md"
          - "Test.swift"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Laso
        NSHealthShareUsageDescription: "Laso reads your health data from Apple Watch and iPhone to provide real-time vitals, personalized health scores, trend analysis, and actionable insights."
        NSHealthUpdateUsageDescription: "Laso requests write access to Apple Health to allow future features like logging workouts and health entries directly from the app."
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: ["com.lasohealth.com.background-refresh"]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthPulse.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.lasohealth.com
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        TARGETED_DEVICE_FAMILY: "1"
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: true
        com.apple.BackgroundModes:
          enabled: true
