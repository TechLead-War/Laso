name: Laso
options:
  bundleIdPrefix: com.lasohealth
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.0.0

targets:
  Laso:
    type: application
    platform: iOS
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: PostHog
        product: PostHog
      - target: LasoWidgets
        embed: true
    sources:
      - path: Analysis
      - path: App
      - path: Config
      - path: Copy
      - path: Data
      - path: Extensions
      - path: Intents
      - path: Models
      - path: Notifications
      - path: Referral
      - path: Security
      - path: Subscriptions
      - path: Tracking
      - path: ViewModels
      - path: Views
      - path: WebExport
      - path: Shared
      - path: Assets.xcassets
      - path: GoogleService-Info.plist
      - path: PrivacyInfo.xcprivacy
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Laso
        NSSiriUsageDescription: "Laso uses Siri to let you check your health score, log water, view sleep data, and track workouts hands-free."
        NSHealthShareUsageDescription: "Laso reads your health data from Apple Watch and iPhone to provide real-time vitals, personalized health scores, trend analysis, and actionable insights."
        NSHealthUpdateUsageDescription: "Laso requests write access to Apple Health to allow future features like logging workouts and health entries directly from the app."
        POSTHOG_API_KEY: $(POSTHOG_API_KEY)
        POSTHOG_HOST: $(POSTHOG_HOST)
        NSSupportsLiveActivities: true
        UIBackgroundModes: [health-update]
        BGTaskSchedulerPermittedIdentifiers: ["com.lasohealth.app.background-refresh"]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBackground
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Laso.entitlements
        DEVELOPMENT_TEAM: S2MAH8X8JM
        PRODUCT_BUNDLE_IDENTIFIER: com.lasohealth.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        TARGETED_DEVICE_FAMILY: "1"
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: true
        com.apple.BackgroundModes:
          enabled: true

  LasoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LasoWidgets
      - path: Shared
      - path: Config/AppKeys.swift
      - path: Data/WidgetDataStore.swift
    info:
      path: LasoWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        INFOPLIST_FILE: LasoWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: LasoWidgets/LasoWidgets.entitlements
        DEVELOPMENT_TEAM: S2MAH8X8JM
        PRODUCT_BUNDLE_IDENTIFIER: com.lasohealth.app.widgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: true
        SWIFT_EMIT_LOC_STRINGS: "YES"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: true

schemes:
  Laso:
    build:
      targets:
        Laso: all
        LasoWidgets: [build]

  LasoWidgets:
    build:
      targets:
        LasoWidgets: all
