name: Laso
options:
  bundleIdPrefix: com.lasohealth
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.0.0
  Amplitude:
    url: https://github.com/amplitude/Amplitude-Swift
    from: 1.18.3
  FacebookSDK:
    url: https://github.com/facebook/facebook-ios-sdk
    from: 18.0.0

targets:
  Laso:
    type: application
    platform: iOS
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseFunctions
      - package: PostHog
        product: PostHog
      - package: Amplitude
        product: AmplitudeSwift
      - package: FacebookSDK
        product: FacebookCore
      - target: LasoWidgets
        embed: true
    sources:
      - path: App
      - path: Modules
      - path: Core
      - path: Common
      - path: Shared
      - path: Assets.xcassets
      - path: GoogleService-Info.plist
      - path: PrivacyInfo.xcprivacy
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Laso
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSiriUsageDescription: "Laso uses Siri to let you check your health score, log water, view sleep data, and track workouts hands-free."
        NSHealthShareUsageDescription: "Laso reads your health data from Apple Watch and iPhone to provide real-time vitals, personalized health scores, trend analysis, and actionable insights."
        NSHealthUpdateUsageDescription: "Laso requests write access to Apple Health to allow future features like logging workouts and health entries directly from the app."
        NSCameraUsageDescription: "Laso uses your camera only when you choose to take a photo for your share card. Photos never leave your device unless you share them."
        POSTHOG_API_KEY: $(POSTHOG_API_KEY)
        POSTHOG_HOST: $(POSTHOG_HOST)
        AMPLITUDE_API_KEY: $(AMPLITUDE_API_KEY)
        AMPLITUDE_REGION: $(AMPLITUDE_REGION)
        FacebookAppID: $(FACEBOOK_APP_ID)
        FacebookClientToken: $(FACEBOOK_CLIENT_TOKEN)
        FacebookDisplayName: Laso
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - fb$(FACEBOOK_APP_ID)
              - laso
        LSApplicationQueriesSchemes: [fbapi, fbauth2, fb-messenger-share-api]
        NSUserTrackingUsageDescription: "We use this identifier to measure ad performance and improve Laso for you."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch, processing, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: ["com.lasohealth.fit.background-refresh"]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBackground
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Laso.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S2MAH8X8JM
        PRODUCT_BUNDLE_IDENTIFIER: com.lasohealth.fit
        MARKETING_VERSION: "1.2.18"
        CURRENT_PROJECT_VERSION: "26"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    postBuildScripts:
      - name: Generate dSYMs for Embedded Frameworks
        runOnlyWhenInstalling: true
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ "${ACTION:-}" != "install" ]; then
            echo "Skipping dSYM generation (ACTION=${ACTION:-none})"
            exit 0
          fi
          FRAMEWORKS_DIR="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          if [ ! -d "$FRAMEWORKS_DIR" ]; then
            echo "No embedded Frameworks folder, skipping"
            exit 0
          fi
          echo "Scanning: $FRAMEWORKS_DIR"
          echo "Target dSYM folder: $DWARF_DSYM_FOLDER_PATH"
          mkdir -p "$DWARF_DSYM_FOLDER_PATH"
          COUNT=0
          for FRAMEWORK in "$FRAMEWORKS_DIR"/*.framework; do
            [ -d "$FRAMEWORK" ] || continue
            NAME=$(basename "$FRAMEWORK" .framework)
            BINARY="$FRAMEWORK/$NAME"
            [ -f "$BINARY" ] || continue
            DSYM_PATH="$DWARF_DSYM_FOLDER_PATH/$NAME.framework.dSYM"
            if [ -d "$DSYM_PATH" ]; then
              echo "  dSYM already present: $NAME"
              continue
            fi
            echo "  generating dSYM for: $NAME"
            dsymutil "$BINARY" -o "$DSYM_PATH" 2>&1 | grep -v "no debug symbols" || true
            COUNT=$((COUNT+1))
          done
          echo "Generated $COUNT dSYM bundles"
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: true
        com.apple.BackgroundModes:
          enabled: true

  LasoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LasoUITests
    dependencies:
      - target: Laso
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lasohealth.fit.uitests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S2MAH8X8JM
        TEST_TARGET_NAME: Laso
        SWIFT_EMIT_LOC_STRINGS: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"

  LasoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LasoWidgets
      - path: Shared
      - path: Core/Config/AppKeys.swift
      - path: Core/Config/RemoteConfigKeys.swift
      - path: Core/Data/WidgetDataStore.swift
      - path: Common/Theme/AppColour.swift
    info:
      path: LasoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Laso Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        INFOPLIST_FILE: LasoWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: LasoWidgets/LasoWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S2MAH8X8JM
        PRODUCT_BUNDLE_IDENTIFIER: com.lasohealth.fit.widgets
        MARKETING_VERSION: "1.2.18"
        CURRENT_PROJECT_VERSION: "26"
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
        SWIFT_EMIT_LOC_STRINGS: "YES"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: true

schemes:
  Laso:
    build:
      targets:
        Laso: all
        LasoWidgets: [build]
        LasoUITests: [test]
    run:
      storeKitConfiguration: Laso.storekit
    test:
      targets:
        - LasoUITests

  LasoWidgets:
    build:
      targets:
        LasoWidgets: all
