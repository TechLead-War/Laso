<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laso Home — Design Prototype (beat Whoop & Oura)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow+Condensed:wght@600;700&family=Oswald:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  :root{
    --ink:#E9ECF1; --ink2:#9AA3AD; --ink3:#5E6670;
    --shell:#0a0b0d; --panel:#14161a; --line:#23272e; --accent:#22D3EE;
  }
  html,body{background:#070809;color:var(--ink);font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 16px 80px}

  /* ---------- top chrome ---------- */
  .top{width:100%;max-width:980px;margin-bottom:18px}
  .top h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .top p{color:var(--ink2);font-size:13.5px;margin-top:6px;line-height:1.5;max-width:760px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{background:none;border:0;color:var(--ink2);font-size:13px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer;transition:.18s;white-space:nowrap}
  .seg button.on{background:#23262d;color:#fff}
  .seg button:hover:not(.on){color:var(--ink)}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:600;padding:9px 14px;border-radius:11px;cursor:pointer;transition:.18s;display:inline-flex;gap:7px;align-items:center}
  .btn:hover{border-color:#3a4049;background:#1b1e23}
  .btn.primary{background:var(--accent);color:#04282d;border-color:transparent}
  .btn.primary:hover{filter:brightness(1.08)}

  .stage{display:flex;gap:26px;align-items:flex-start;width:100%;max-width:980px;justify-content:center;flex-wrap:wrap}

  /* ---------- phone ---------- */
  .phonewrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  .phone{
    width:362px;height:760px;border-radius:46px;padding:13px;position:relative;flex:0 0 auto;
    background:#000;border:1px solid #2a2e35;box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 2px #000;
    transition:background .4s;
  }
  .notch{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:120px;height:27px;background:#000;border-radius:0 0 17px 17px;z-index:20}
  .screen{position:absolute;inset:13px;border-radius:34px;overflow:hidden;background:var(--bg);transition:background .4s}
  .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:44px 18px 96px}
  .scroll::-webkit-scrollbar{width:0}
  .statusbar{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--t-hi);padding:0 4px 8px;opacity:.85}

  /* theme variables live on .screen */
  .screen{
    --bg:#121212; --bg2:#1C1C1E; --track:#2C2C2E;
    --t-hi:#F0F0F0; --t-mid:rgba(240,240,240,.62); --t-lo:rgba(240,240,240,.4);
    --good:#34D399; --warn:#F59E0B; --bad:#D55E00;
    --sleep:#7BA1BB; --strain:#0093E7; --act:#22D3EE;
    --fp:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    --fn:-apple-system,"SF Pro Rounded","SF Pro Display","Helvetica Neue",sans-serif;
    --ringD:168; --ringStroke:10;
    font-family:var(--fp);
  }
  .screen.theme-intensity{
    --bg:#101518; --bg2:#1b242b; --track:#283339;
    --t-hi:#FFFFFF; --t-mid:rgba(255,255,255,.62); --t-lo:rgba(255,255,255,.42);
    --good:#16EC06; --warn:#FFDE00; --bad:#FF0026;
    --sleep:#7BA1BB; --strain:#0093E7; --act:#00F19F;
    --fp:'Barlow Semi Condensed','Helvetica Neue',Arial,sans-serif;
    --fn:'Oswald','Barlow Condensed','DIN Alternate','Helvetica Neue',sans-serif;
    --ringD:150; --ringStroke:14;
    background:linear-gradient(180deg,#283339 0%,#101518 70%);
  }
  .screen.theme-calm{
    --bg:#0E0E12; --bg2:#16161c; --track:#26262e;
    --t-hi:#F2F0EC; --t-mid:rgba(242,240,236,.6); --t-lo:rgba(242,240,236,.38);
    --good:#86C5A8; --warn:#E3B373; --bad:#DD8A78;
    --sleep:#9FB6C6; --strain:#86A7C2; --act:#7FB6A6;
    --fp:'Inter',-apple-system,'Helvetica Neue',sans-serif;
    --fn:'Inter',-apple-system,'Helvetica Neue',sans-serif;
    --ringD:160; --ringStroke:7;
    background:linear-gradient(180deg,#15151b 0%,#0E0E12 60%);
  }
  .screen.theme-signature{ background:linear-gradient(180deg,#1C1C1E 0%,#121212 55%); }

  /* ---------- shared bits ---------- */
  .greet{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 2px}
  .greet .hi{font-size:17px;color:var(--t-mid);font-weight:500}
  .streak{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--act) 14%,transparent);border:1px solid color-mix(in srgb,var(--act) 38%,transparent);color:var(--act);border-radius:999px;padding:6px 11px;font-weight:600;font-size:14px;font-family:var(--fn);cursor:pointer}
  .freshstart{font-size:12px;color:var(--t-lo);letter-spacing:.12em;text-transform:uppercase;margin:14px 2px 2px;font-weight:600}

  .hero{display:flex;flex-direction:column;align-items:center;margin-top:6px;position:relative}
  .ringbox{position:relative;display:flex;align-items:center;justify-content:center}
  .ringbox svg{transform:rotate(-90deg)}
  .ringnum{position:absolute;display:flex;flex-direction:column;align-items:center}
  .ringnum .v{font-family:var(--fn);font-weight:700;font-size:84px;line-height:.95;letter-spacing:-.013em;font-variant-numeric:tabular-nums;color:var(--t-hi)}
  .theme-intensity .ringnum .v{font-weight:600}
  .deltachip{position:absolute;top:6px;right:-2px;font-family:var(--fn);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent);border:1px solid color-mix(in srgb,var(--good) 34%,transparent);border-radius:999px;padding:3px 9px;display:flex;align-items:center;gap:3px}
  .tier{margin-top:14px;font-size:22px;font-weight:600;letter-spacing:-.007em;font-family:var(--fp)}
  .imper{margin-top:6px;font-size:17px;color:var(--t-hi);text-align:center;letter-spacing:-.02em}
  .label{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t-lo)}

  .contribs{margin:18px 2px 4px;display:flex;flex-direction:column;gap:9px}
  .crow{display:flex;align-items:center;gap:9px;font-size:16px;color:var(--t-mid);letter-spacing:-.02em}
  .crow b{color:var(--t-hi);font-weight:600}
  .crow .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}

  .chips{display:flex;gap:11px;margin:18px 2px 0}
  .chip{flex:1;background:var(--bg2);border:1px solid var(--line,rgba(255,255,255,.06));border-radius:16px;padding:13px 14px;cursor:pointer;transition:.18s}
  .chip:hover{transform:translateY(-2px)}
  .chip .cv{font-family:var(--fn);font-weight:600;font-size:27px;letter-spacing:-.008em;font-variant-numeric:tabular-nums}
  .chip .cl{margin-top:7px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t-lo)}

  .cta{width:100%;margin-top:18px;background:var(--act);color:#04282d;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:700;letter-spacing:-.01em;cursor:pointer;font-family:var(--fp);transition:.18s}
  .theme-calm .cta{color:#10231d}
  .cta:hover{filter:brightness(1.07)}

  .invest{margin-top:16px}
  .invest .it{font-size:13px;color:var(--t-lo);margin-bottom:8px;font-weight:600;letter-spacing:.04em}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-size:13px;color:var(--t-mid);background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:999px;padding:8px 13px;cursor:pointer;transition:.16s}
  .tag:hover,.tag.on{color:var(--t-hi);border-color:var(--act);background:color-mix(in srgb,var(--act) 12%,transparent)}

  /* tab bar */
  .tabbar{position:absolute;left:13px;right:13px;bottom:13px;height:66px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-around;border-radius:0 0 34px 34px;z-index:10}
  .tabbar button{background:none;border:0;color:var(--t-lo);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-family:var(--fp)}
  .tabbar button .ti{font-size:19px;line-height:1}
  .tabbar button.on{color:var(--act)}

  /* deep-dive / detail screens */
  .navhdr{display:flex;align-items:center;gap:12px;padding:2px 0 6px}
  .navhdr .bk{font-size:24px;color:var(--t-mid);cursor:pointer;line-height:1}
  .navhdr h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
  .recap{display:flex;align-items:baseline;gap:10px;margin:8px 2px 16px}
  .recap .rv{font-family:var(--fn);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
  .recap .rt{font-size:15px;font-weight:600}
  .card{background:var(--bg2);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:15px;margin:12px 0}
  .card h3{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t-lo);margin-bottom:11px}
  .rank{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:15px}
  .rank:last-child{border-bottom:0}
  .rank .rl{color:var(--t-hi);font-weight:500}
  .rank .rr{font-family:var(--fn);font-variant-numeric:tabular-nums;color:var(--t-mid);font-size:14px}
  .coach{font-size:15px;color:var(--t-hi);line-height:1.5;letter-spacing:-.01em}
  .linkrow{display:flex;justify-content:space-between;align-items:center;color:var(--act);font-size:15px;font-weight:600;padding:14px 2px 2px;cursor:pointer}

  .gridv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .gauge{background:var(--bg2);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;transition:.18s}
  .gauge:hover{transform:translateY(-2px)}
  .gauge .gv{font-family:var(--fn);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums;position:absolute}
  .gauge .gwrap{position:relative;display:flex;align-items:center;justify-content:center}
  .gauge .gl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t-mid)}
  .gauge .gs{font-size:11px;color:var(--t-lo)}

  .setrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:15px;color:var(--t-hi)}
  .setrow:last-child{border-bottom:0}
  .setrow .sv{color:var(--t-mid);font-size:14px;font-family:var(--fn)}
  .pips{display:flex;gap:5px}
  .pips i{width:9px;height:9px;border-radius:50%;background:var(--act);display:block}
  .pips i.used{background:#3a3f47}

  .entrance{opacity:0}

  /* page dots + arrows */
  .navrow{display:flex;align-items:center;gap:16px}
  .dots{display:flex;gap:8px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#2c313a;cursor:pointer;transition:.2s}
  .dots i.on{background:var(--accent);width:22px;border-radius:999px}
  .scrname{font-size:12.5px;color:var(--ink2);min-width:150px;text-align:center}

  /* ---------- science panel ---------- */
  .sci{flex:1 1 340px;max-width:430px;min-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;align-self:stretch;max-height:786px;overflow-y:auto}
  .sci::-webkit-scrollbar{width:8px}.sci::-webkit-scrollbar-thumb{background:#2a2f37;border-radius:8px}
  .sci.hide{display:none}
  .sci h2{font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .sci .sub{color:var(--ink2);font-size:12.5px;margin:6px 0 16px;line-height:1.5}
  .acc{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden;background:#0f1115}
  .acc>summary{cursor:pointer;padding:13px 15px;font-size:13.5px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .cnt{color:var(--ink3);font-weight:600;font-size:12px}
  .acc[open]>summary{border-bottom:1px solid var(--line)}
  .sitem{padding:12px 15px;border-bottom:1px solid #1a1d22}
  .sitem:last-child{border-bottom:0}
  .sitem .sh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .sitem .nm{font-size:13px;font-weight:700;color:var(--ink)}
  .sitem .spec{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:#aeb6c0;background:#1a1e24;border:1px solid #262b32;border-radius:6px;padding:2px 7px}
  .sw{width:13px;height:13px;border-radius:4px;border:1px solid rgba(255,255,255,.18);flex:0 0 auto}
  .sitem .why{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:6px}
  .sitem a{color:var(--accent);font-size:11.5px;text-decoration:none;word-break:break-all}
  .sitem a:hover{text-decoration:underline}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;margin-top:7px}
  .pill.eff{background:#12251f;color:#5fe3a3;border:1px solid #1f5a3c}
  .beat{background:#0f1115;border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:14px}
  .beat li{font-size:12.5px;color:var(--ink2);line-height:1.55;margin-left:16px;margin-bottom:7px}
  .note{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:10px}

  @media(max-width:820px){.stage{flex-direction:column;align-items:center}.sci{max-width:362px;width:100%}}
</style>
</head>
<body>
  <div class="top">
    <h1>Laso Home — design prototype</h1>
    <p>Three directions, switchable. Walk the 5-screen flow with Next/Prev (or tap the ring, chips, tab bar). Hit <b>Show science</b> to see the study behind every font, color, size, animation and retention choice. Recommended direction is <b>Laso Signature</b>.</p>
    <div class="controls">
      <div class="seg" id="dirSeg">
        <button data-dir="intensity">Whoop Intensity</button>
        <button data-dir="calm">Oura Calm</button>
        <button data-dir="signature" class="on">Laso Signature ★</button>
      </div>
      <button class="btn" id="replayBtn">↻ Replay reveal</button>
      <button class="btn primary" id="sciBtn">Show science</button>
    </div>
  </div>

  <div class="stage">
    <div class="phonewrap">
      <div class="phone">
        <div class="notch"></div>
        <div class="screen theme-signature" id="screen">
          <div class="scroll" id="scroll"></div>
          <div class="tabbar" id="tabbar">
            <button data-screen="0" class="on"><span class="ti">◎</span>Today</button>
            <button data-screen="3"><span class="ti">▥</span>Vitals</button>
            <button data-screen="4"><span class="ti">❤</span>My Health</button>
          </div>
        </div>
      </div>
      <div class="navrow">
        <button class="btn" id="prevBtn">‹ Prev</button>
        <div class="dots" id="dots"></div>
        <button class="btn" id="nextBtn">Next ›</button>
      </div>
      <div class="scrname" id="scrname"></div>
    </div>

    <div class="sci hide" id="sci"></div>
  </div>

<script>
/* ============================ SPEC DATA (from research workflow) ============================ */
const SPEC = {
  philosophy: "Win the same quiet morning glance Whoop and Oura own, then beat them on three gaps neither solved: ONE chosen hero (not a 7-card grid, and the user picks it — Oura forbids reordering); the plain-English WHY on the home itself (Whoop's coaching is jargon, Oura buries insight in Labs); and a real daily-return engine layered on the readiness ritual (the score alone is not the habit).",
  beat: [
    "Beat Whoop's information overload: one hero ring + 2 glance numbers on first paint; hide the 7-metric grid behind taps (the5krunner cites Whoop's 'daunting' amount of info).",
    "Put the WHY on home in first-person plain English ('HRV up 12% vs your 2-week average') instead of jargon (Whoop) or buried Labs insight (Oura).",
    "Never show a naked 0-100: number + 3-tier word + one imperative line; render the tier word in the band color so the legend self-teaches (fixes Oura's unexplained colors).",
    "Near-zero-effort streak (open + glance) with TWO freezes at signup — neither Whoop nor Oura ships a habit streak on readiness; the 1→2 day jump is Duolingo's biggest lift.",
    "Frame return around LOSS ('Keep your 12-day run') — losses loom ~2.25× larger than gains (Kahneman, λ=2.25).",
    "Morning reset as a Fresh Start landmark ('Yesterday 58 · today, clean slate') so a bad day never discourages return (people act +33% at period starts).",
    "One engineered peak per open: ring snaps shut + number locks in under ~900ms, then freezes static and instantly readable (Peak-End + Doherty 400ms feel-threshold)."
  ],
  recommended: "signature",
  type: [
    {nm:"Hero score numeral", spec:"84px · 700 · -0.013em · tabular", why:"Bigger is significantly faster to read at a glance (p<0.01). Hero lands ~72–88pt on a 390pt iPhone; monospacedDigit stops layout jitter as it ticks.", src:"https://www.nngroup.com/articles/glanceable-fonts/"},
    {nm:"Tier word", spec:"22px · 600", why:"Never show a naked 0-100; pair with a 3-tier label. Rendering the tier word in the band hue makes Oura's hidden color mapping legible.", src:"https://ouraring.com/blog/readiness-score/"},
    {nm:"Imperative line", spec:"17px · 400 · 87% white", why:"The number is always paired with a plain-language verdict the user can act on. Body 17pt; step weight down on dark.", src:"https://ouraring.com/blog/readiness-score/"},
    {nm:"Delta chip '+18'", spec:"17px · 600 · tabular", why:"Garmin's +/- charge delta maps an abstract score onto a battery model everyone understands; tabular figures so it never reflows.", src:"https://www8.garmin.com/manuals/webhelp/"},
    {nm:"Glance chip numeral", spec:"27px · 600 · tabular", why:"1.25 Major Third scale (17→21→27) gives clean low-contrast dashboard hierarchy.", src:"https://imperavi.com/books/ui-typography/principles/modular-scale/"},
    {nm:"All-caps label", spec:"12px · 600 · +0.0125em", why:"Uppercase reads faster at a glance; small sizes need POSITIVE tracking (Caption1 12pt +0.12px).", src:"https://www.nngroup.com/articles/glanceable-fonts/"},
    {nm:"Streak counter", spec:"17px · 600 · tabular", why:"The 1→2 day streak jump is Duolingo's biggest retention lift; show the count once past day 2.", src:"https://www.recall.it/summary/lennys-podcast/behind-the-product-duolingo-streaks"}
  ],
  color: [
    {nm:"Base background", hex:"#121212", why:"Pure #000 strains eyes and kills depth (shadows invisible); #121212 keeps OLED savings. White on it = 18.73:1.", src:"https://www.fourzerothree.in/p/scalable-accessible-dark-mode"},
    {nm:"Raised surface", hex:"#1C1C1E", why:"Apple HIG dark mode pairs base + elevated backgrounds; lighter surfaces advance (#000→#1C1C1E→#2C2C2E).", src:"https://developer.apple.com/design/human-interface-guidelines/dark-mode"},
    {nm:"Ring track / elevated", hex:"#2C2C2E", why:"Material elevation overlay: higher surfaces get a brighter white tint to separate without shadows (invisible on near-black).", src:"https://m2.material.io/design/color/dark-theme.html"},
    {nm:"High-emphasis text", hex:"#F0F0F0", why:"Don't use pure #FFF on #000 (halation/bloom); off-white ~87% is gentler and still high-contrast.", src:"https://www.smashingmagazine.com/2025/04/inclusive-dark-mode-designing-accessible-dark-themes/"},
    {nm:"State High — PRIMED", hex:"#34D399", why:"Discrete band, not gradient; desaturated teal so it doesn't vibrate on dark. 10.92:1; locked as highest luminance for red-green CVD safety.", src:"https://m2.material.io/design/color/dark-theme.html"},
    {nm:"State Mid — STEADY", hex:"#F59E0B", why:"Amber 9.78:1; distinct luminance between green and red so bands separate by lightness, not hue alone (CVD-safe).", src:"https://www.lyssna.com/blog/color-blind-friendly-palette/"},
    {nm:"State Low — RECOVER", hex:"#D55E00", why:"Okabe-Ito vermillion widens red-green separation vs a pure red; only rendered at hero size where 3:1 large-text rules apply.", src:"https://conceptviz.app/blog/okabe-ito-palette-hex-codes-complete-reference"},
    {nm:"Single action accent", hex:"#22D3EE", why:"60-30-10: one vivid accent earns meaning through scarcity. Cyan is highest contrast (11.62:1), reserved for the ONE daily action.", src:"https://hype4.academy/articles/design/60-30-10-rule-in-ui"},
    {nm:"Sleep raw-data hue", hex:"#7BA1BB", why:"Whoop gives Sleep its own muted blue-grey so recovery green/amber/red is never reused for non-recovery metrics.", src:"https://developer.whoop.com/"},
    {nm:"Strain raw-data hue", hex:"#0093E7", why:"Whoop's dedicated Strain blue keeps Strain and Recovery in different color languages so they never share meaning.", src:"https://developer.whoop.com/"}
  ],
  motion: [
    {nm:"Hero ring fill sweep", spec:"850ms · cubic-bezier(0.05,0.7,0.1,1)", why:"A value reveal (not a transition) worth savoring for the emotional peak; finishes under Nielsen's 1s thought-limit. Emphasized-Decelerate is M3's hero curve.", src:"https://m3.material.io/styles/motion/easing-and-duration/tokens-specs"},

/* ---------- ring builder ---------- */
function ringSVG(score, diameter, stroke, color, trackVar="var(--track)", numClass="v"){
  const r = (diameter - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - score/100);
  return `<div class="ringbox" style="width:${diameter}px;height:${diameter}px">
    <svg width="${diameter}" height="${diameter}" viewBox="0 0 ${diameter} ${diameter}">
      <circle cx="${diameter/2}" cy="${diameter/2}" r="${r}" fill="none" style="stroke:${trackVar}" stroke-width="${stroke}"/>
      <circle class="arc" cx="${diameter/2}" cy="${diameter/2}" r="${r}" fill="none" style="stroke:${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${reduce?off.toFixed(1):c.toFixed(1)}"
        data-final="${off.toFixed(1)}" data-circ="${c.toFixed(1)}"/>
    </svg>
    <div class="ringnum"><span class="${numClass}" data-count="${score}">${reduce?score:0}</span></div>
  </div>`;
}

/* ---------- cubic-bezier easing solver ---------- */
function bezier(x1,y1,x2,y2){
  const cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx;
  const cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  const fx=t=>((ax*t+bx)*t+cx)*t, fy=t=>((ay*t+by)*t+cy)*t, dfx=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{let t=x;for(let i=0;i<6;i++){const e=fx(t)-x;if(Math.abs(e)<1e-4)break;const d=dfx(t);if(Math.abs(d)<1e-6)break;t-=e/d;}return fy(t);};
}
const easeEmph = bezier(0.05,0.7,0.1,1);

/* ---------- animation ---------- */
function animate(){
  if(reduce){ scroll.querySelectorAll('.entrance').forEach(e=>e.style.opacity=1); return; }
  // ring sweep + count
  const arc = scroll.querySelector('.arc');
  const numEl = scroll.querySelector('[data-count]');
  if(arc){
    const circ=parseFloat(arc.dataset.circ), fin=parseFloat(arc.dataset.final), target=+numEl.dataset.count;
    const dur=850, t0=performance.now();
    function step(now){
      const p=Math.min(1,(now-t0)/dur), e=easeEmph(p);
      arc.style.strokeDashoffset=(circ-(circ-fin)*e).toFixed(1);
      numEl.textContent=Math.round(target*e);
      if(p<1) requestAnimationFrame(step); else numEl.textContent=target;
    }
    requestAnimationFrame(step);
  }
  // staggered entrances
  scroll.querySelectorAll('.entrance').forEach(el=>{
    const d=(+el.dataset.d||3)*70;
    el.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],
      {duration:300,delay:d,easing:'cubic-bezier(0,0,0.2,1)',fill:'both'});
  });
}

/* ---------- paint ---------- */
function paint(){

  $("#tabbar").querySelectorAll('button').forEach(b=>b.classList.toggle('on', +b.dataset.screen===scr || (scr<3&&+b.dataset.screen===0)));
  $("#prevBtn").disabled = scr===0;
  // wire taps
  scroll.querySelectorAll('[data-screen]').forEach(el=>el.onclick=()=>go(+el.dataset.screen));
  const ring=scroll.querySelector('.ringbox'); if(ring&&scr===0) ring.style.cursor='pointer', ring.onclick=()=>go(1);
  const cta=scroll.querySelector('.cta'); if(cta) cta.onclick=()=>go(1);
  scroll.querySelectorAll('.tag').forEach(t=>t.onclick=()=>{t.classList.toggle('on')});
  scroll.scrollTop=0;
  animate();
}
function go(n){ scr=Math.max(0,Math.min(4,n)); paint(); }

}
